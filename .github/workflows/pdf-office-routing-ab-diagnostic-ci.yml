name: PDF-to-Office Routing A/B Diagnostic

on:
  push:
    branches:
      - feat/pdf-office-v1-routing
    paths:
      - 'backend/app/bloom_proxy.py'
      - 'engines/office-service/**'
      - 'benchmarks/**'
      - 'patches/bloom/**'
      - '.github/workflows/pdf-office-routing-ab-diagnostic-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BLOOM_REPO: https://github.com/stemlen/bloom-pdf-editor.git
  BLOOM_COMMIT: 9ed16c43e356cffd4bd3b004b0dab19e582a59d5
  BLOOM_PATCH: patches/bloom/table-cluster-group-bottom.patch
  REAL_MANIFEST: benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json

jobs:
  materialize-corpus:
    name: corpus / ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case_id:
          - docx-google-doc
          - docx-multicolumn
          - docx-libreoffice-images
          - pptx-commons-copyright
          - pptx-what-is-cc
          - pptx-copyright-laws
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install corpus verification dependencies
        run: pip install pypdf==6.1.1 cryptography==46.0.3

      - name: Fetch, verify and materialize one pinned document
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/real-case-stage"
          mkdir -p "$stage/corpus" "$stage/inventory"
          python benchmarks/fetch_pdf_to_office_real_corpus.py \
            --manifest "$REAL_MANIFEST" \
            --case-id "${{ matrix.case_id }}" \
            --output-dir "$stage/corpus" \
            --output-inventory "$stage/inventory/${{ matrix.case_id }}.json"

      - name: Upload verified document artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-office-routing-ab-case-${{ matrix.case_id }}
          path: ${{ runner.temp }}/real-case-stage/
          if-no-files-found: error
          retention-days: 7

  diagnostic:
    name: Bloom vs LibreOffice real-world A/B
    needs: materialize-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install benchmark dependencies
        run: pip install -r benchmarks/requirements.txt

      - name: Download verified corpus artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-office-routing-ab-case-*
          path: /tmp/pdf-office-routing-ab-stage
          merge-multiple: true

      - name: Verify assembled target subset
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader

          root = Path('/tmp/pdf-office-routing-ab-stage')
          manifest = json.loads(Path('benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json').read_text())
          cases = [case for case in manifest['cases'] if case['target'] in {'docx', 'pptx'}]
          assert len(cases) == 6, [case['id'] for case in cases]
          pages = 0
          for case in cases:
              pdf_path = root / 'corpus' / case['filename']
              assert pdf_path.is_file(), pdf_path
              pages += len(PdfReader(pdf_path).pages)
          assert pages == 41, pages
          print(json.dumps({'cases': len(cases), 'pages': pages}, indent=2))
          PY

      - name: Fetch pinned Bloom source and apply SolYan table patch
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$BLOOM_REPO" /tmp/bloom
          git -C /tmp/bloom fetch --depth=1 origin "$BLOOM_COMMIT"
          git -C /tmp/bloom checkout --detach "$BLOOM_COMMIT"
          test "$(git -C /tmp/bloom rev-parse HEAD)" = "$BLOOM_COMMIT"
          grep -q 'Apache License' /tmp/bloom/LICENSE
          git -C /tmp/bloom apply --check "$GITHUB_WORKSPACE/$BLOOM_PATCH"
          git -C /tmp/bloom apply "$GITHUB_WORKSPACE/$BLOOM_PATCH"

      - name: Build pinned Bloom, Office and backend images
        run: |
          docker build -t solyan-bloom-routing-ab /tmp/bloom/server
          docker build -t solyan-office-routing-ab engines/office-service
          docker build -t solyan-backend-routing-ab backend

      - name: Start isolated A/B stack
        run: |
          docker network create solyan-office-routing-ab
          docker run -d --name bloom-routing-ab --network solyan-office-routing-ab \
            -e BLOOM_STORAGE_ROOT=/tmp/bloom-storage \
            solyan-bloom-routing-ab
          docker run -d --name office-routing-ab --network solyan-office-routing-ab solyan-office-routing-ab
          docker run -d --name backend-routing-ab --network solyan-office-routing-ab -p 8000:8000 \
            -e BLOOM_SERVICE_URL=http://bloom-routing-ab:8787 \
            -e OFFICE_SERVICE_URL=http://office-routing-ab:8020 \
            solyan-backend-routing-ab

      - name: Wait for backend, Bloom and Office health
        run: |
          python - <<'PY'
          import time
          import urllib.request

          urls = {
              'backend': 'http://127.0.0.1:8000/health',
              'bloom': 'http://127.0.0.1:8000/experimental/bloom/health',
              'office': 'http://127.0.0.1:8000/office/health',
          }
          deadline = time.monotonic() + 180
          pending = dict(urls)
          while pending and time.monotonic() < deadline:
              for name, url in list(pending.items()):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if 200 <= response.status < 300:
                              print(name, response.read().decode('utf-8', 'replace'))
                              pending.pop(name)
                  except Exception as exc:
                      print('waiting', name, type(exc).__name__, exc)
              if pending:
                  time.sleep(3)
          if pending:
              raise SystemExit(f'Health checks timed out: {sorted(pending)}')
          PY

      - name: Run Bloom and LibreOffice A/B with preserved logs
        run: |
          set +e
          set -o pipefail
          PYTHONPATH=benchmarks python benchmarks/run_pdf_to_office_corpus.py \
            --manifest "$REAL_MANIFEST" \
            --corpus-dir /tmp/pdf-office-routing-ab-stage/corpus \
            --api http://127.0.0.1:8000 \
            --mode bloom \
            --target docx \
            --target pptx \
            --output /tmp/pdf-office-routing-bloom-report.json \
            2>&1 | tee /tmp/pdf-office-routing-bloom.log
          bloom_status=${PIPESTATUS[0]}

          PYTHONPATH=benchmarks python benchmarks/run_pdf_to_office_corpus.py \
            --manifest "$REAL_MANIFEST" \
            --corpus-dir /tmp/pdf-office-routing-ab-stage/corpus \
            --api http://127.0.0.1:8000 \
            --mode libreoffice \
            --target docx \
            --target pptx \
            --output /tmp/pdf-office-routing-libreoffice-report.json \
            2>&1 | tee /tmp/pdf-office-routing-libreoffice.log
          libreoffice_status=${PIPESTATUS[0]}

          printf '%s\n' "$bloom_status" > /tmp/pdf-office-routing-bloom.exit
          printf '%s\n' "$libreoffice_status" > /tmp/pdf-office-routing-libreoffice.exit
          echo "bloom_exit_code=$bloom_status libreoffice_exit_code=$libreoffice_status"
          exit 0

      - name: Upload A/B execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-office-routing-ab-execution
          path: |
            /tmp/pdf-office-routing-bloom.log
            /tmp/pdf-office-routing-libreoffice.log
            /tmp/pdf-office-routing-bloom.exit
            /tmp/pdf-office-routing-libreoffice.exit
            /tmp/pdf-office-routing-bloom-report.json
            /tmp/pdf-office-routing-libreoffice-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce benchmark process results
        run: |
          set -euo pipefail
          bloom_status="$(cat /tmp/pdf-office-routing-bloom.exit)"
          libreoffice_status="$(cat /tmp/pdf-office-routing-libreoffice.exit)"
          if [ "$bloom_status" -ne 0 ] || [ "$libreoffice_status" -ne 0 ]; then
            echo "A/B process failure: bloom=$bloom_status libreoffice=$libreoffice_status"
            tail -n 150 /tmp/pdf-office-routing-bloom.log || true
            tail -n 150 /tmp/pdf-office-routing-libreoffice.log || true
            exit 1
          fi

      - name: Validate and compare A/B reports
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          bloom = json.loads(Path('/tmp/pdf-office-routing-bloom-report.json').read_text())
          libreoffice = json.loads(Path('/tmp/pdf-office-routing-libreoffice-report.json').read_text())

          for report, mode, engine in (
              (bloom, 'bloom', 'Bloom'),
              (libreoffice, 'libreoffice', 'LibreOffice-PDF-import'),
          ):
              results = report['results']
              assert report['mode'] == mode, report
              assert report['selected_targets'] == ['docx', 'pptx'], report
              assert len(results) == 6, len(results)
              assert Counter(item['target'] for item in results) == {'docx': 3, 'pptx': 3}
              assert report['summary']['engines'] == {engine: 6}, report['summary']
              assert report['failures'] == [], report
              for item in results:
                  assert item['conversion_engine'] == engine, item
                  assert item['office_bytes'] > 0, item
                  assert item['roundtrip_pdf_bytes'] > 0, item
                  diag = item.get('ooxml_diagnostics')
                  assert isinstance(diag, dict), item
                  assert diag.get('xml_parts', 0) >= 1, diag
                  assert diag.get('text_nodes', 0) >= 0, diag
                  assert diag.get('text_characters', 0) >= 0, diag
                  assert diag.get('embedded_media_files', 0) >= 0, diag

          comparison = {
              'bloom': bloom['summary'],
              'libreoffice': libreoffice['summary'],
              'per_case': [],
          }
          bloom_by_id = {item['id']: item for item in bloom['results']}
          libreoffice_by_id = {item['id']: item for item in libreoffice['results']}
          assert set(bloom_by_id) == set(libreoffice_by_id)
          for case_id in sorted(bloom_by_id):
              left = bloom_by_id[case_id]
              right = libreoffice_by_id[case_id]
              comparison['per_case'].append({
                  'id': case_id,
                  'target': left['target'],
                  'bloom_similarity': left['average_similarity'],
                  'libreoffice_similarity': right['average_similarity'],
                  'bloom_editability': left['ooxml_diagnostics'],
                  'libreoffice_editability': right['ooxml_diagnostics'],
              })

          Path('/tmp/pdf-office-routing-ab-comparison.json').write_text(
              json.dumps(comparison, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(comparison, ensure_ascii=False, indent=2))
          PY

      - name: Upload A/B comparison
        uses: actions/upload-artifact@v4
        with:
          name: pdf-office-routing-ab-comparison
          path: |
            /tmp/pdf-office-routing-bloom-report.json
            /tmp/pdf-office-routing-libreoffice-report.json
            /tmp/pdf-office-routing-ab-comparison.json
          retention-days: 30

      - name: Collect container logs on failure
        if: failure()
        run: |
          for name in bloom-routing-ab office-routing-ab backend-routing-ab; do
            echo "===== $name ====="
            docker logs "$name" || true
          done

      - name: Stop A/B stack
        if: always()
        run: |
          docker rm -f backend-routing-ab office-routing-ab bloom-routing-ab 2>/dev/null || true
          docker network rm solyan-office-routing-ab 2>/dev/null || true
