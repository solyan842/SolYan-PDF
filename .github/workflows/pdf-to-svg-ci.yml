name: PDF to SVG CI

on:
  pull_request:
    paths:
      - 'backend/app/pdf_to_svg.py'
      - 'backend/app/pdf_to_postscript.py'
      - 'frontend/app/pdf-to-svg/**'
      - 'frontend/app/page.tsx'
      - 'docs/V1.5-PARITY-AUDIT.md'
      - 'docs/ROADMAP.md'
      - '.github/workflows/pdf-to-svg-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/pdf_to_svg.py'
      - 'backend/app/pdf_to_postscript.py'
      - 'frontend/app/pdf-to-svg/**'
      - 'frontend/app/page.tsx'
      - 'docs/V1.5-PARITY-AUDIT.md'
      - 'docs/ROADMAP.md'
      - '.github/workflows/pdf-to-svg-ci.yml'

jobs:
  pdf-to-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install Poppler, qpdf and hash-verified backend dependencies
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install -y poppler-utils qpdf
            pdftocairo -v
            pdfinfo -v
            qpdf --version
            python -m pip install --require-hashes -r backend/requirements.hashed.lock
            python -m pip install --no-deps -r backend/requirements.txt
            python -m pip check
          } 2>&1 | tee /tmp/pdf-to-svg-ci.log

      - name: Compile backend
        run: |
          set -euo pipefail
          python -m compileall backend/app 2>&1 | tee -a /tmp/pdf-to-svg-ci.log

      - name: Gate real SVG conversion through public route
        working-directory: backend
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee -a /tmp/pdf-to-svg-ci.log
          from __future__ import annotations

          import io
          import subprocess
          import tempfile
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          from fastapi.testclient import TestClient

          from app.main import app


          def make_pdf(page_sizes: list[tuple[int, int]]) -> bytes:
              objects: dict[int, bytes] = {}
              objects[1] = b'<< /Type /Catalog /Pages 2 0 R >>'
              objects[3] = b'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'
              kids: list[str] = []
              next_obj = 4
              for index, (width, height) in enumerate(page_sizes, start=1):
                  page_obj = next_obj
                  content_obj = next_obj + 1
                  next_obj += 2
                  kids.append(f'{page_obj} 0 R')
                  stream = f'BT /F1 24 Tf 36 {max(40, height - 72)} Td (PAGE_{index}_842) Tj ET\n'.encode()
                  objects[page_obj] = (
                      f'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 {width} {height}] '
                      f'/Resources << /Font << /F1 3 0 R >> >> /Contents {content_obj} 0 R >>'
                  ).encode()
                  objects[content_obj] = (
                      b'<< /Length ' + str(len(stream)).encode() + b' >>\nstream\n' + stream + b'endstream'
                  )
              objects[2] = f'<< /Type /Pages /Kids [{" ".join(kids)}] /Count {len(page_sizes)} >>'.encode()

              highest = max(objects)
              data = bytearray(b'%PDF-1.4\n%\xe2\xe3\xcf\xd3\n')
              offsets = [0] * (highest + 1)
              for number in range(1, highest + 1):
                  body = objects[number]
                  offsets[number] = len(data)
                  data.extend(f'{number} 0 obj\n'.encode())
                  data.extend(body)
                  data.extend(b'\nendobj\n')
              xref = len(data)
              data.extend(f'xref\n0 {highest + 1}\n'.encode())
              data.extend(b'0000000000 65535 f \n')
              for number in range(1, highest + 1):
                  data.extend(f'{offsets[number]:010d} 00000 n \n'.encode())
              data.extend(
                  f'trailer\n<< /Size {highest + 1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode()
              )
              return bytes(data)


          client = TestClient(app)
          source = make_pdf([(612, 792), (400, 300)])

          multi = client.post(
              '/pdf/to-svg',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'raster_dpi': '150'},
          )
          assert multi.status_code == 200, multi.text
          assert multi.headers['content-type'].startswith('application/zip')
          assert 'solyan-pdf-svg.zip' in multi.headers['content-disposition']
          assert multi.headers['x-solyan-svg-pages'] == '2'
          assert multi.headers['x-solyan-svg-raster-dpi'] == '150'
          with zipfile.ZipFile(io.BytesIO(multi.content)) as archive:
              assert archive.namelist() == ['page_001.svg', 'page_002.svg'], archive.namelist()
              first_svg = archive.read('page_001.svg')
              second_svg = archive.read('page_002.svg')
              assert ET.fromstring(first_svg).tag.split('}')[-1] == 'svg'
              assert ET.fromstring(second_svg).tag.split('}')[-1] == 'svg'

          single = client.post(
              '/pdf/to-svg',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'first_page': '2', 'last_page': '2', 'raster_dpi': '200'},
          )
          assert single.status_code == 200, single.text
          assert single.headers['content-type'].startswith('image/svg+xml')
          assert 'solyan-pdf-page-2.svg' in single.headers['content-disposition']
          assert single.headers['x-solyan-svg-pages'] == '1'
          assert single.headers['x-solyan-svg-raster-dpi'] == '200'
          root = ET.fromstring(single.content)
          assert root.tag.split('}')[-1] == 'svg'
          assert root.attrib.get('width') == '400pt', root.attrib
          assert root.attrib.get('height') == '300pt', root.attrib

          bad_range = client.post(
              '/pdf/to-svg',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'first_page': '2', 'last_page': '1'},
          )
          assert bad_range.status_code == 422, bad_range.text

          out_of_range = client.post(
              '/pdf/to-svg',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'first_page': '3', 'last_page': '3'},
          )
          assert out_of_range.status_code == 422, out_of_range.text
          assert 'exceeds PDF page count' in out_of_range.text

          bad_dpi = client.post(
              '/pdf/to-svg',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'raster_dpi': '301'},
          )
          assert bad_dpi.status_code == 422, bad_dpi.text

          too_many_source = make_pdf([(100, 100)] * 101)
          too_many = client.post(
              '/pdf/to-svg',
              files={'file': ('many.pdf', too_many_source, 'application/pdf')},
          )
          assert too_many.status_code == 413, too_many.text
          assert 'limited to 100 pages' in too_many.text

          with tempfile.TemporaryDirectory(prefix='solyan-svg-password-') as temp_dir:
              source_path = Path(temp_dir) / 'source.pdf'
              encrypted_path = Path(temp_dir) / 'encrypted.pdf'
              source_path.write_bytes(source)
              subprocess.run(
                  ['qpdf', '--encrypt', 'svgpass', 'ownerpass', '256', '--', str(source_path), str(encrypted_path)],
                  check=True,
              )
              encrypted = encrypted_path.read_bytes()

          wrong_password = client.post(
              '/pdf/to-svg',
              files={'file': ('encrypted.pdf', encrypted, 'application/pdf')},
              data={'password': 'wrong', 'first_page': '1', 'last_page': '1'},
          )
          assert wrong_password.status_code == 401, wrong_password.text

          password_ok = client.post(
              '/pdf/to-svg',
              files={'file': ('encrypted.pdf', encrypted, 'application/pdf')},
              data={'password': 'svgpass', 'first_page': '1', 'last_page': '1'},
          )
          assert password_ok.status_code == 200, password_ok.text
          assert password_ok.headers['content-type'].startswith('image/svg+xml')

          not_pdf = client.post(
              '/pdf/to-svg',
              files={'file': ('bad.bin', b'not-a-pdf', 'application/octet-stream')},
          )
          assert not_pdf.status_code == 400, not_pdf.text

          print('real pdftocairo SVG route semantics: PASS')
          PY

      - name: Gate production wiring, bounds and documented boundary
        run: |
          set -euo pipefail
          {
            grep -q 'MAX_PAGES = 100' backend/app/pdf_to_svg.py
            grep -q 'MAX_SINGLE_SVG_BYTES = 64 \* 1024 \* 1024' backend/app/pdf_to_svg.py
            grep -q 'MAX_AGGREGATE_SVG_BYTES = 250 \* 1024 \* 1024' backend/app/pdf_to_svg.py
            grep -q 'MAX_ARCHIVE_BYTES = 250 \* 1024 \* 1024' backend/app/pdf_to_svg.py
            grep -q '"pdftocairo"' backend/app/pdf_to_svg.py
            grep -q 'ET.parse(path)' backend/app/pdf_to_svg.py
            grep -q 'router.include_router(pdf_to_svg_router)' backend/app/pdf_to_postscript.py
            grep -q 'CONVERT · V1.5' frontend/app/pdf-to-svg/page.tsx
            grep -q 'không thêm runtime mới' frontend/app/pdf-to-svg/page.tsx
            grep -q 'SVG nói chung có thể chứa nội dung active' frontend/app/pdf-to-svg/page.tsx
            grep -q "href: '/pdf-to-svg'" frontend/app/page.tsx
            grep -q 'Poppler `pdftocairo`' docs/V1.5-PARITY-AUDIT.md
            grep -q 'MuPDF' docs/V1.5-PARITY-AUDIT.md
            echo 'production wiring + hard bounds + SVG boundary: PASS'
          } 2>&1 | tee -a /tmp/pdf-to-svg-ci.log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee -a /tmp/pdf-to-svg-ci.log

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee -a /tmp/pdf-to-svg-ci.log

      - name: Upload PDF to SVG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-svg-ci-evidence
          path: /tmp/pdf-to-svg-ci.log
          if-no-files-found: warn
          retention-days: 14
