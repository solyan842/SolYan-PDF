name: Generate OCR dependency locks

on:
  push:
    branches:
      - chore/ocr-python-lock
    paths:
      - '.github/workflows/generate-ocr-lock.yml'
      - 'engines/ocr-service/requirements.txt'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/ocr-python-lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Resolve OCR environment from real Paddle CPU index
        run: |
          set -euo pipefail
          python -m venv /tmp/ocr-lock-source
          py=/tmp/ocr-lock-source/bin/python
          "$py" -m pip install --disable-pip-version-check --upgrade pip
          "$py" -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          "$py" -m pip install --disable-pip-version-check -r engines/ocr-service/requirements.txt
          "$py" -m pip check

          {
            echo '# Generated from the real Paddle CPU-index environment.'
            echo '# Python 3.13.16; PaddlePaddle is intentionally stored separately in paddle.lock.'
            "$py" -m pip freeze --disable-pip-version-check | grep -v -E '^paddlepaddle==' | LC_ALL=C sort
          } > engines/ocr-service/requirements.lock

          cat > engines/ocr-service/paddle.lock <<'EOF'
          # PaddlePaddle wheel source is intentionally explicit and separate from the PyPI graph.
          --index-url https://www.paddlepaddle.org.cn/packages/stable/cpu/
          paddlepaddle==3.2.0
          EOF

      - name: Reconstruct clean environment from committed lock model
        run: |
          set -euo pipefail
          python -m venv /tmp/ocr-lock-verify
          py=/tmp/ocr-lock-verify/bin/python
          "$py" -m pip install --disable-pip-version-check --upgrade pip
          "$py" -m pip install --disable-pip-version-check -r engines/ocr-service/requirements.lock -r engines/ocr-service/requirements.txt
          "$py" -m pip install --disable-pip-version-check --no-deps -r engines/ocr-service/paddle.lock
          "$py" -m pip check
          "$py" - <<'PY'
          import paddle
          import paddleocr
          print('paddle', paddle.__version__)
          print('paddleocr imported', paddleocr.__name__)
          PY

      - name: Commit OCR lockfiles
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engines/ocr-service/requirements.lock engines/ocr-service/paddle.lock
          if git diff --cached --quiet; then
            echo 'OCR lockfiles already current'
            exit 0
          fi
          git commit -m 'build: lock OCR and Paddle dependency graphs'
          git push origin HEAD:chore/ocr-python-lock
