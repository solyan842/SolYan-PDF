name: Windows OCR Runtime CI

on:
  pull_request:
    paths:
      - "desktop/backend/ocr_runner.py"
      - "desktop/backend/requirements-ocr-windows.txt"
      - "desktop/backend/stage-ocr-runtime.ps1"
      - "engines/ocr-service/**"
      - ".github/workflows/windows-ocr-runtime-ci.yml"
  push:
    branches:
      - "feat/windows-desktop-d4-ocr"
    paths:
      - "desktop/backend/ocr_runner.py"
      - "desktop/backend/requirements-ocr-windows.txt"
      - "desktop/backend/stage-ocr-runtime.ps1"
      - "engines/ocr-service/**"
      - ".github/workflows/windows-ocr-runtime-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-ocr-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ocr-runtime:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/backend/requirements-ocr-windows.txt

      - name: Prepare diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Install Windows OCR dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-pip-bootstrap.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r desktop/backend/requirements-ocr-windows.txt 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install paddlepaddle==3.2.0 --index-url https://www.paddlepaddle.org.cn/packages/stable/cpu/ 2>&1 | Tee-Object -FilePath artifacts/windows-paddle-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-pip-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python - <<'PY' 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-versions.log
          import paddle, paddleocr, paddlex
          print("paddle", paddle.__version__)
          print("paddleocr", paddleocr.__version__)
          print("paddlex", paddlex.__version__)
          PY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage pinned Tesseract and tessdata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./desktop/backend/stage-ocr-runtime.ps1 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-native-runtime.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem desktop/src-tauri/resources/ocr/tesseract -Recurse |
            Select-Object FullName, Length | Format-Table | Out-String |
            Set-Content artifacts/windows-ocr-native-inventory.log

      - name: Smoke pinned Tesseract executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path desktop/src-tauri/resources/ocr/tesseract).Path
          $exe = Join-Path $root "tesseract.exe"
          $env:TESSDATA_PREFIX = Join-Path $root "tessdata"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          image = Image.new("RGB", (1200, 240), "white")
          draw = ImageDraw.Draw(image)
          font = ImageFont.truetype(r"C:\Windows\Fonts\arial.ttf", 72)
          draw.text((40, 70), "SolYan PDF 2026", fill="black", font=font)
          image.save(Path("artifacts") / "windows-ocr-smoke.png")
          PY
          & $exe artifacts/windows-ocr-smoke.png stdout -l eng --psm 7 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-tesseract-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = Get-Content artifacts/windows-ocr-tesseract-smoke.log -Raw
          if ($text -notmatch "SolYan") { throw "Tesseract smoke output did not contain SolYan: $text" }

      - name: Build Windows OCR sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --onefile --name solyan-ocr --paths engines/ocr-service --collect-submodules app --collect-all paddle --collect-all paddleocr --collect-all paddlex --collect-all pypdfium2 --hidden-import cv2 desktop/backend/ocr_runner.py 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/solyan-ocr.exe)) { throw "solyan-ocr.exe was not produced" }
          Get-Item dist/solyan-ocr.exe | Select-Object Name, Length, FullName | Format-List | Out-String | Set-Content artifacts/windows-ocr-sidecar-inventory.log

      - name: Smoke OCR sidecar health with lazy models
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path desktop/src-tauri/resources/ocr/tesseract).Path
          $env:SOLYAN_TESSERACT_BINARY = Join-Path $root "tesseract.exe"
          $env:TESSDATA_PREFIX = Join-Path $root "tessdata"
          $env:TESSERACT_LANG = "vie+eng"
          $env:PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK = "True"
          $port = 38191
          $stdout = Join-Path $PWD "artifacts/windows-ocr-sidecar.stdout.log"
          $stderr = Join-Path $PWD "artifacts/windows-ocr-sidecar.stderr.log"
          $process = Start-Process -FilePath (Resolve-Path dist/solyan-ocr.exe) -ArgumentList "--port", "$port" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $health = $null
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { throw "solyan-ocr.exe exited before health became ready" }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health" -TimeoutSec 3
                if ($health.status -eq "ok") { break }
              } catch {}
            }
            if (-not $health -or $health.status -ne "ok") { throw "OCR sidecar health did not become ready" }
            if ($health.models_loaded.ocr -or $health.models_loaded.structure) { throw "OCR health unexpectedly loaded Paddle models" }
            if (-not $health.fallback.binary_available) { throw "OCR sidecar could not resolve staged Tesseract" }
            if ($health.fallback.language -ne "vie+eng") { throw "Unexpected Tesseract language contract" }
            $health | ConvertTo-Json -Depth 6 | Set-Content artifacts/windows-ocr-health.json -Encoding utf8
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Windows OCR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ocr-runtime-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows OCR sidecar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: solyan-ocr-windows-x64
          path: dist/solyan-ocr.exe
          if-no-files-found: error
          retention-days: 7
