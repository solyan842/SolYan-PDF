name: Windows OCR Runtime CI

on:
  pull_request:
    paths:
      - "desktop/backend/ocr_runner.py"
      - "desktop/backend/requirements-ocr-windows.txt"
      - "desktop/backend/stage-ocr-runtime.ps1"
      - "desktop/backend/stage-ocr-models.ps1"
      - "engines/ocr-service/**"
      - ".github/workflows/windows-ocr-runtime-ci.yml"
  push:
    branches:
      - "feat/windows-desktop-d4-ocr"
    paths:
      - "desktop/backend/ocr_runner.py"
      - "desktop/backend/requirements-ocr-windows.txt"
      - "desktop/backend/stage-ocr-runtime.ps1"
      - "desktop/backend/stage-ocr-models.ps1"
      - "engines/ocr-service/**"
      - ".github/workflows/windows-ocr-runtime-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-ocr-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ocr-runtime:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/backend/requirements-ocr-windows.txt

      - name: Prepare diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Install Windows OCR dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-pip-bootstrap.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r desktop/backend/requirements-ocr-windows.txt 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install paddlepaddle==3.2.0 --index-url https://www.paddlepaddle.org.cn/packages/stable/cpu/ 2>&1 | Tee-Object -FilePath artifacts/windows-paddle-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-pip-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import paddle,paddleocr,paddlex; print('paddle', paddle.__version__); print('paddleocr', paddleocr.__version__); print('paddlex', paddlex.__version__)" 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-versions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage pinned Tesseract and tessdata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./desktop/backend/stage-ocr-runtime.ps1 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-native-runtime.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem desktop/src-tauri/resources/ocr/tesseract -Recurse |
            Select-Object FullName, Length | Format-Table | Out-String |
            Set-Content artifacts/windows-ocr-native-inventory.log

      - name: Stage pinned Paddle text OCR models
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./desktop/backend/stage-ocr-models.ps1 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-model-stage.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = (Resolve-Path desktop/src-tauri/resources/ocr/paddlex-cache).Path
          $manifest = Join-Path $cache "solyan-model-inventory.json"
          if (-not (Test-Path $manifest)) { throw "Paddle model inventory was not staged" }
          Copy-Item $manifest artifacts/windows-ocr-model-inventory.json
          Get-ChildItem (Join-Path $cache "official_models") -Directory |
            ForEach-Object {
              $bytes = (Get-ChildItem $_.FullName -File -Recurse | Measure-Object Length -Sum).Sum
              [pscustomobject]@{ Model = $_.Name; Files = @(Get-ChildItem $_.FullName -File -Recurse).Count; Bytes = $bytes }
            } | Format-Table | Out-String | Set-Content artifacts/windows-ocr-model-cache.log

      - name: Smoke pinned Tesseract executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path desktop/src-tauri/resources/ocr/tesseract).Path
          $exe = Join-Path $root "tesseract.exe"
          $env:TESSDATA_PREFIX = Join-Path $root "tessdata"
          $smokeScript = @'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          image = Image.new("RGB", (1600, 360), "white")
          draw = ImageDraw.Draw(image)
          font = ImageFont.truetype(r"C:\Windows\Fonts\arial.ttf", 88)
          draw.text((50, 55), "SOLYAN PDF 2026", fill="black", font=font)
          small = ImageFont.truetype(r"C:\Windows\Fonts\arial.ttf", 56)
          draw.text((50, 190), "Tieng Viet - van ban mau", fill="black", font=small)
          image.save(Path("artifacts") / "windows-ocr-smoke.png")
          '@
          $smokeScript | Set-Content artifacts/make-windows-ocr-smoke.py -Encoding utf8
          python artifacts/make-windows-ocr-smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe artifacts/windows-ocr-smoke.png stdout -l eng --psm 6 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-tesseract-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = Get-Content artifacts/windows-ocr-tesseract-smoke.log -Raw
          if ($text -notmatch "SOLYAN") { throw "Tesseract smoke output did not contain SOLYAN: $text" }

      - name: Build Windows OCR sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --onefile --name solyan-ocr --paths engines/ocr-service --collect-submodules app --collect-all paddle --collect-all paddleocr --collect-all paddlex --collect-all pypdfium2 --hidden-import cv2 desktop/backend/ocr_runner.py 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/solyan-ocr.exe)) { throw "solyan-ocr.exe was not produced" }
          Get-Item dist/solyan-ocr.exe | Select-Object Name, Length, FullName | Format-List | Out-String | Set-Content artifacts/windows-ocr-sidecar-inventory.log

      - name: Smoke OCR sidecar health and offline Paddle text OCR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tesseractRoot = (Resolve-Path desktop/src-tauri/resources/ocr/tesseract).Path
          $cacheRoot = (Resolve-Path desktop/src-tauri/resources/ocr/paddlex-cache).Path
          $env:SOLYAN_TESSERACT_BINARY = Join-Path $tesseractRoot "tesseract.exe"
          $env:TESSDATA_PREFIX = Join-Path $tesseractRoot "tessdata"
          $env:TESSERACT_LANG = "vie+eng"
          $env:OCR_LANG = "vi"
          $env:PADDLE_PDX_CACHE_HOME = $cacheRoot
          $env:PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK = "True"
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          $env:ALL_PROXY = "http://127.0.0.1:9"
          $env:http_proxy = "http://127.0.0.1:9"
          $env:https_proxy = "http://127.0.0.1:9"
          $env:all_proxy = "http://127.0.0.1:9"
          $env:NO_PROXY = "127.0.0.1,localhost"
          $env:no_proxy = "127.0.0.1,localhost"
          $port = 38191
          $stdout = Join-Path $PWD "artifacts/windows-ocr-sidecar.stdout.log"
          $stderr = Join-Path $PWD "artifacts/windows-ocr-sidecar.stderr.log"
          $process = Start-Process -FilePath (Resolve-Path dist/solyan-ocr.exe) -ArgumentList "--port", "$port" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $health = $null
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { throw "solyan-ocr.exe exited before health became ready" }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health" -TimeoutSec 3
                if ($health.status -eq "ok") { break }
              } catch {}
            }
            if (-not $health -or $health.status -ne "ok") { throw "OCR sidecar health did not become ready" }
            if ($health.models_loaded.ocr -or $health.models_loaded.structure) { throw "OCR health unexpectedly loaded Paddle models" }
            if (-not $health.fallback.binary_available) { throw "OCR sidecar could not resolve staged Tesseract" }
            if ($health.fallback.language -ne "vie+eng") { throw "Unexpected Tesseract language contract" }
            $health | ConvertTo-Json -Depth 6 | Set-Content artifacts/windows-ocr-health-before.json -Encoding utf8

            $paddleSmoke = @'
            import json
            from pathlib import Path
            import httpx

            image = Path("artifacts/windows-ocr-smoke.png")
            with image.open("rb") as handle, httpx.Client(timeout=900.0, trust_env=False) as client:
                response = client.post(
                    "http://127.0.0.1:38191/ocr/text",
                    files={"file": (image.name, handle, "image/png")},
                )
            response.raise_for_status()
            payload = response.json()
            Path("artifacts/windows-ocr-paddle-smoke.json").write_text(
                json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                encoding="utf-8",
            )
            assert payload.get("engine") == "PaddleOCR", payload
            assert payload.get("fallback_used") is False, payload
            text = str(payload.get("text") or "")
            assert "SOLYAN" in text.upper(), text
            print(text)
            '@
            $paddleSmoke | Set-Content artifacts/run-windows-ocr-paddle-smoke.py -Encoding utf8
            python artifacts/run-windows-ocr-paddle-smoke.py 2>&1 | Tee-Object -FilePath artifacts/windows-ocr-paddle-smoke.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $after = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health" -TimeoutSec 5
            if (-not $after.models_loaded.ocr) { throw "Paddle OCR model did not stay loaded after OCR request" }
            if ($after.models_loaded.structure) { throw "Structured OCR model loaded during text-only smoke" }
            $after | ConvertTo-Json -Depth 6 | Set-Content artifacts/windows-ocr-health-after.json -Encoding utf8
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Windows OCR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ocr-runtime-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows OCR sidecar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: solyan-ocr-windows-x64
          path: dist/solyan-ocr.exe
          if-no-files-found: error
          retention-days: 7
