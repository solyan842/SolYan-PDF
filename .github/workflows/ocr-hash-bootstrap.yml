name: OCR PyPI Hash Bootstrap

on:
  push:
    branches:
      - build/hash-ocr-pypi
    paths:
      - 'scripts/hash-pinned-pypi.py'
      - '.github/workflows/ocr-hash-bootstrap.yml'
      - 'engines/ocr-service/requirements.lock'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Validate generator
        run: python -m py_compile scripts/hash-pinned-pypi.py

      - name: Generate OCR PyPI hash lock
        run: python scripts/hash-pinned-pypi.py engines/ocr-service/requirements.lock engines/ocr-service/requirements.hashed.lock

      - name: Commit generated OCR hash lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engines/ocr-service/requirements.hashed.lock
          if git diff --cached --quiet; then
            echo 'OCR hash lock already matches generated output.'
          else
            git commit -m 'build: add hash-verified OCR PyPI lock'
            git push origin HEAD:build/hash-ocr-pypi
          fi
