name: OCR XLSX Raster Page Preservation Diagnostic

on:
  push:
    branches:
      - fix/ocr-xlsx-raster-page-preservation
    paths:
      - 'backend/app/bloom_proxy.py'
      - 'engines/ocr-service/**'
      - 'engines/office-service/**'
      - 'benchmarks/**'
      - 'patches/bloom/**'
      - '.github/workflows/ocr-xlsx-raster-page-diagnostic-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BLOOM_REPO: https://github.com/stemlen/bloom-pdf-editor.git
  BLOOM_COMMIT: 9ed16c43e356cffd4bd3b004b0dab19e582a59d5
  BLOOM_PATCH: patches/bloom/table-cluster-group-bottom.patch
  BLOOM_REGRESSION_TEST: patches/bloom/solyan-table-cluster-regression.test.ts
  REAL_MANIFEST: benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json

jobs:
  materialize-corpus:
    name: corpus / ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case_id:
          - xlsx-table-material
          - xlsx-unidentified-table
          - xlsx-transport-table
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install corpus verification dependencies
        run: pip install pypdf==6.1.1 cryptography==46.0.3

      - name: Fetch, verify and materialize one pinned scan
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/scan-xlsx-raster"
          mkdir -p "$stage/corpus" "$stage/inventory"
          python benchmarks/fetch_pdf_to_office_real_corpus.py \
            --manifest "$REAL_MANIFEST" \
            --case-id "${{ matrix.case_id }}" \
            --output-dir "$stage/corpus" \
            --output-inventory "$stage/inventory/${{ matrix.case_id }}.json"

      - name: Upload verified scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr-xlsx-raster-case-${{ matrix.case_id }}
          path: ${{ runner.temp }}/scan-xlsx-raster/
          if-no-files-found: error
          retention-days: 7

  diagnostic:
    name: Bloom to PP-Structure raster-page diagnostic
    needs: materialize-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install diagnostic dependencies
        run: pip install -r benchmarks/requirements.txt openpyxl==3.1.5

      - name: Download verified scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ocr-xlsx-raster-case-*
          path: /tmp/ocr-xlsx-raster-stage
          merge-multiple: true

      - name: Verify three-case corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from pypdf import PdfReader

          root = Path('/tmp/ocr-xlsx-raster-stage')
          corpus_dir = root / 'corpus'
          inventory_dir = root / 'inventory'
          manifest = json.loads(Path('benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json').read_text())
          wanted = ['xlsx-table-material', 'xlsx-unidentified-table', 'xlsx-transport-table']
          cases = {case['id']: case for case in manifest['cases'] if case['id'] in wanted}
          assert set(cases) == set(wanted), sorted(cases)

          inventories = []
          for path in sorted(inventory_dir.glob('*.json')):
              payload = json.loads(path.read_text())
              assert len(payload['cases']) == 1, payload
              inventories.append(payload['cases'][0])
          by_id = {item['id']: item for item in inventories}
          assert set(by_id) == set(wanted), sorted(by_id)
          assert sum(int(item['output_pages']) for item in inventories) == 9, inventories

          for case_id in wanted:
              item = by_id[case_id]
              pdf_path = corpus_dir / cases[case_id]['filename']
              assert pdf_path.is_file(), pdf_path
              data = pdf_path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == item['output_sha256'], item
              assert len(PdfReader(pdf_path).pages) == 3, item
          print(json.dumps({'cases': 3, 'pages': 9, 'ids': wanted}, indent=2))
          PY

      - name: Setup Node matching Bloom image
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned Bloom source and apply SolYan patch
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$BLOOM_REPO" /tmp/bloom
          git -C /tmp/bloom fetch --depth=1 origin "$BLOOM_COMMIT"
          git -C /tmp/bloom checkout --detach "$BLOOM_COMMIT"
          test "$(git -C /tmp/bloom rev-parse HEAD)" = "$BLOOM_COMMIT"
          git -C /tmp/bloom apply --check "$GITHUB_WORKSPACE/$BLOOM_PATCH"
          git -C /tmp/bloom apply "$GITHUB_WORKSPACE/$BLOOM_PATCH"
          cp "$GITHUB_WORKSPACE/$BLOOM_REGRESSION_TEST" /tmp/bloom/server/src/tests/solyan-table-cluster-regression.test.ts

      - name: Typecheck Bloom and run SolYan regression
        working-directory: /tmp/bloom/server
        run: |
          npm ci
          npm run typecheck
          npx vitest run src/tests/solyan-table-cluster-regression.test.ts

      - name: Build Bloom, OCR, Office and backend images
        run: |
          docker build -t solyan-bloom-xlsx-raster /tmp/bloom/server
          docker build -t solyan-ocr-xlsx-raster engines/ocr-service
          docker build -t solyan-office-xlsx-raster engines/office-service
          docker build -t solyan-backend-xlsx-raster backend

      - name: Start isolated fallback stack
        run: |
          docker network create solyan-ocr-xlsx-raster
          docker run -d --name bloom-xlsx-raster --network solyan-ocr-xlsx-raster \
            -e BLOOM_STORAGE_ROOT=/tmp/bloom-storage \
            solyan-bloom-xlsx-raster
          docker run -d --name ocr-xlsx-raster --network solyan-ocr-xlsx-raster \
            -e OCR_LANG=en \
            -e PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True \
            solyan-ocr-xlsx-raster
          docker run -d --name office-xlsx-raster --network solyan-ocr-xlsx-raster \
            solyan-office-xlsx-raster
          docker run -d --name backend-xlsx-raster --network solyan-ocr-xlsx-raster -p 8000:8000 \
            -e BLOOM_SERVICE_URL=http://bloom-xlsx-raster:8787 \
            -e OCR_SERVICE_URL=http://ocr-xlsx-raster:8010 \
            -e OFFICE_SERVICE_URL=http://office-xlsx-raster:8020 \
            solyan-backend-xlsx-raster

      - name: Wait for services
        run: |
          python - <<'PY'
          import time
          import urllib.request

          urls = [
              'http://127.0.0.1:8000/health',
              'http://127.0.0.1:8000/experimental/bloom/health',
              'http://127.0.0.1:8000/ocr/health',
          ]
          deadline = time.monotonic() + 240
          for url in urls:
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=8) as response:
                          if 200 <= response.status < 300:
                              print(url, response.read().decode('utf-8', 'replace'))
                              break
                  except Exception as exc:
                      if time.monotonic() >= deadline:
                          raise SystemExit(f'health timeout {url}: {exc}')
                      time.sleep(4)
          PY

      - name: Run real scanned XLSX raster-page diagnostic with preserved log
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/ocr-xlsx-raster/results /tmp/ocr-xlsx-raster/logs
          set +e
          PYTHONPATH=benchmarks python - <<'PY' 2>&1 | tee /tmp/ocr-xlsx-raster/logs/diagnostic.log
          import json
          import time
          from pathlib import Path

          import httpx
          from openpyxl import load_workbook

          from pdf_to_office import visual_similarity

          stage = Path('/tmp/ocr-xlsx-raster-stage/corpus')
          out_root = Path('/tmp/ocr-xlsx-raster/results')
          cases = [
              ('xlsx-table-material', 'xlsx-table-material.pdf'),
              ('xlsx-unidentified-table', 'xlsx-unidentified-table.pdf'),
              ('xlsx-transport-table', 'xlsx-transport-table.pdf'),
          ]

          results = []
          with httpx.Client(timeout=httpx.Timeout(2400.0, connect=15.0)) as client:
              for case_id, filename in cases:
                  source_path = stage / filename
                  source = source_path.read_bytes()
                  case_dir = out_root / case_id
                  case_dir.mkdir(parents=True, exist_ok=True)
                  print(f'===== {case_id} =====', flush=True)

                  started = time.perf_counter()
                  response = client.post(
                      'http://127.0.0.1:8000/experimental/pdf-to-office',
                      files={'file': (filename, source, 'application/pdf')},
                      data={'target': 'xlsx'},
                  )
                  response.raise_for_status()
                  xlsx = response.content
                  xlsx_path = case_dir / 'converted.xlsx'
                  xlsx_path.write_bytes(xlsx)

                  item = {
                      'id': case_id,
                      'source_pages': 3,
                      'convert_seconds': time.perf_counter() - started,
                      'office_bytes': len(xlsx),
                      'conversion_engine': response.headers.get('x-solyan-conversion-engine'),
                      'ocr_engine': response.headers.get('x-solyan-ocr-engine'),
                      'ocr_pages': response.headers.get('x-solyan-ocr-pages'),
                      'ocr_table_workbooks': response.headers.get('x-solyan-ocr-table-workbooks'),
                  }

                  wb = load_workbook(xlsx_path, data_only=False)
                  try:
                      item['sheet_count'] = len(wb.worksheets)
                      item['nonempty_cells'] = sum(
                          1
                          for ws in wb.worksheets
                          for row in ws.iter_rows()
                          for cell in row
                          if cell.value is not None and str(cell.value).strip()
                      )
                      item['raster_image_sheets'] = [
                          ws.title for ws in wb.worksheets if getattr(ws, '_images', [])
                      ]
                  finally:
                      wb.close()

                  rt = client.post(
                      'http://127.0.0.1:8000/office/to-pdf',
                      files={'file': ('converted.xlsx', xlsx, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')},
                  )
                  rt.raise_for_status()
                  (case_dir / 'roundtrip.pdf').write_bytes(rt.content)
                  item.update(visual_similarity(source, rt.content))
                  results.append(item)
                  print(json.dumps(item, ensure_ascii=False, indent=2), flush=True)

          by_id = {item['id']: item for item in results}
          assert set(by_id) == {case_id for case_id, _ in cases}, by_id
          for item in results:
              assert item['conversion_engine'] == 'PP-StructureV3-fallback', item
              assert item['ocr_engine'] == 'PP-StructureV3', item
              assert item['sheet_count'] == 3, item
              assert item['nonempty_cells'] > 0, item
              assert item['roundtrip_pages'] == 3, item
              assert item['unmatched_pages'] == 0, item

          assert by_id['xlsx-unidentified-table']['raster_image_sheets'] == ['Page 1'], by_id['xlsx-unidentified-table']
          assert by_id['xlsx-table-material']['raster_image_sheets'] == [], by_id['xlsx-table-material']
          assert by_id['xlsx-transport-table']['raster_image_sheets'] == [], by_id['xlsx-transport-table']

          # Source orientation must survive LibreOffice round-trip. The source PDFs
          # are portrait for table-material and landscape for the other two cases.
          assert all(width < height for width, height in by_id['xlsx-table-material']['roundtrip_render_sizes'])
          assert all(width > height for width, height in by_id['xlsx-unidentified-table']['roundtrip_render_sizes'])
          assert all(width > height for width, height in by_id['xlsx-transport-table']['roundtrip_render_sizes'])

          report = {
              'baseline_bloom_roundtrip_pages': 3,
              'pre_raster_fallback_roundtrip_pages': 8,
              'source_pages': 9,
              'roundtrip_pages': sum(item['roundtrip_pages'] for item in results),
              'unmatched_pages': sum(item['unmatched_pages'] for item in results),
              'results': results,
          }
          assert report['roundtrip_pages'] == 9, report
          assert report['unmatched_pages'] == 0, report
          Path('/tmp/ocr-xlsx-raster/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('===== SUMMARY =====', flush=True)
          print(json.dumps(report, ensure_ascii=False, indent=2), flush=True)
          PY
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > /tmp/ocr-xlsx-raster/logs/diagnostic.exitcode
          exit "$status"

      - name: Collect service logs
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ocr-xlsx-raster/logs
          for name in bloom-xlsx-raster ocr-xlsx-raster office-xlsx-raster backend-xlsx-raster; do
            docker logs "$name" > "/tmp/ocr-xlsx-raster/logs/$name.log" 2>&1 || true
          done

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-xlsx-raster-page-diagnostic
          path: |
            /tmp/ocr-xlsx-raster/report.json
            /tmp/ocr-xlsx-raster/results/
            /tmp/ocr-xlsx-raster/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop services
        if: always()
        run: |
          docker rm -f backend-xlsx-raster office-xlsx-raster ocr-xlsx-raster bloom-xlsx-raster 2>/dev/null || true
          docker network rm solyan-ocr-xlsx-raster 2>/dev/null || true
