name: Publish v0.1.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release content
        uses: actions/checkout@v4

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.1.1 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.1.1 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "SolYan PDF v0.1.1" \
            --notes-file docs/RELEASE-NOTES-v0.1.1.md
