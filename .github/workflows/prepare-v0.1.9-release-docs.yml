name: Prepare v0.1.9 Release Docs

on:
  push:
    branches:
      - release/v0.1.9-20261016
    paths:
      - '.github/workflows/prepare-v0.1.9-release-docs.yml'

permissions:
  contents: write

jobs:
  prepare-release-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.9-20261016

      - name: Update changelog and release manifest
        env:
          RELEASE_DOC_SCRIPT_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_DOC_SCRIPT_B64" | base64 --decode > /tmp/prepare-release-docs.py
          python /tmp/prepare-release-docs.py

      - name: Commit release documentation if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md docs/RELEASE-MANIFEST.md; then
            echo 'Release docs already prepared.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/RELEASE-MANIFEST.md
          git commit -m 'release: document SolYan PDF v0.1.9'
          git push origin HEAD:release/v0.1.9-20261016
