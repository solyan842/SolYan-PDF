name: Windows sTool Fast CI

on:
  push:
    branches:
      - 'feat/windows-stool-*'
    paths:
      - 'desktop/src-tauri/**'
      - 'desktop/ui/**'
      - 'desktop/backend/**'
      - 'desktop/tests/stool-lazy.contract.mjs'
      - 'desktop/tests/stool-icons.contract.mjs'
      - 'desktop/tests/stool-installer.contract.mjs'
      - 'desktop/stool-tests/**'
      - '.github/workflows/windows-stool-installer.yml'
      - '.github/workflows/windows-stool-fast-ci.yml'
      - 'docs/WINDOWS-STOOL-*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-stool-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stool-fast:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
      - name: Create diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test real desktop ASGI authentication and CORS composition
        shell: pwsh
        run: |
          python -m pip install -r desktop/backend/requirements-smoke-tests.txt 2>&1 | Tee-Object artifacts/stool-cors-dependencies.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s desktop/backend/tests -p test_core_runner_cors.py -v 2>&1 | Tee-Object artifacts/stool-cors-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check sTool cold-start and service mapping contracts
        shell: pwsh
        run: |
          node --test desktop/tests/stool-lazy.contract.mjs desktop/tests/stool-icons.contract.mjs desktop/tests/stool-installer.contract.mjs 2>&1 | Tee-Object artifacts/stool-lazy-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate installed acceptance scripts without staging heavy runtimes
        shell: pwsh
        run: |
          npm ci --prefix desktop/stool-tests --ignore-scripts 2>&1 | Tee-Object artifacts/stool-test-driver.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop/stool-tests/close-protocol.test.mjs 2>&1 | Tee-Object artifacts/stool-close-protocol.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/stool-tests/check-workflows.mjs 2>&1 | Tee-Object artifacts/stool-workflow-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/stool-tests/installed.mjs 2>&1 | Tee-Object artifacts/stool-installed-script.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('stool-installer-smoke.ps1','stool-process-smoke.ps1','stool-close-response.ps1','stool-webview-policy.ps1')) {
            $tokens=$null; $errorsInScript=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path "desktop/backend/$file"),[ref]$tokens,[ref]$errorsInScript) | Out-Null
            if ($errorsInScript.Count) { throw ($errorsInScript | Out-String) }
          }
          'PowerShell acceptance scripts parse PASS' | Tee-Object artifacts/stool-installed-powershell.log
      - name: Check UI contracts, not the Reader build
        shell: pwsh
        run: |
          & ./desktop/ui/validate-contract.ps1 2>&1 | Tee-Object artifacts/stool-ui-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Tauri validates every resource directory before rustc, even in
      # cargo check. Stage EMPTY directories exclusively on disposable CI;
      # never claim this produces a packaged installer or working sidecars.
      - name: Prepare compile-only resource roots for Tauri validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $services = @('core','office','ocr','sign','archive')
          foreach ($service in $services) {
            $path = Join-Path 'desktop/src-tauri/resources' $service
            if (Test-Path $path) { throw "Refusing to overwrite staged runtime at $path" }
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            if ((Get-ChildItem $path -Force | Measure-Object).Count -ne 0) { throw "Expected an empty compile-only directory at $path" }
          }
          Write-Output 'Tauri compile-only resource roots staged without binaries, models or installers'
      - name: Check Tauri sTool Rust independently, no NSIS or sidecars
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          cargo check --no-default-features 2>&1 | Tee-Object ../../artifacts/stool-cargo-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep sTool diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stool-fast-diagnostics
          path: artifacts/stool-*.log
          if-no-files-found: warn
