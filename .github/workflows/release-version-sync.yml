name: Release Version Sync

on:
  push:
    branches:
      - release/v0.2.0
    paths:
      - '.github/workflows/release-version-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.2.0
          fetch-depth: 0

      - name: Sync package-lock version
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lock and remove helper workflow
        run: |
          rm .github/workflows/release-version-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/release-version-sync.yml
          git commit -m "chore: sync v0.2.0 package lock"
          git push origin HEAD:release/v0.2.0
