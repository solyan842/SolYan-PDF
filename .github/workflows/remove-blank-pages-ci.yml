name: Remove Blank Pages CI

on:
  pull_request:
    paths:
      - 'backend/app/remove_blank_pages.py'
      - 'backend/app/main.py'
      - 'frontend/app/remove-blank-pages/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/remove-blank-pages-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/remove_blank_pages.py'
      - 'backend/app/main.py'
      - 'frontend/app/remove-blank-pages/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/remove-blank-pages-ci.yml'

jobs:
  remove-blanks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install qpdf and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          qpdf --version
          pdftoppm -v
          pdftotext -v

      - name: Install backend dependencies
        run: |
          python -m pip install --require-hashes -r requirements.hashed.lock
          python -m pip install --no-deps -r requirements.txt
          python -m pip check

      - name: Verify conservative blank-page detection and removal
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          from fastapi.testclient import TestClient

          from app.main import app
          from app.remove_blank_pages import _compress_page_ranges

          def build_pdf(page_kinds: list[str]) -> bytes:
              objects: list[bytes] = []
              page_object_numbers = list(range(3, 3 + len(page_kinds)))
              next_object = 3 + len(page_kinds)
              content_objects: list[int] = []
              content_payloads: list[bytes] = []

              for kind in page_kinds:
                  content_objects.append(next_object)
                  next_object += 1
                  if kind == 'blank':
                      content_payloads.append(b'')
                  elif kind == 'vector':
                      content_payloads.append(b'0 0 0 rg\n50 50 40 40 re f\n')
                  elif kind == 'text':
                      content_payloads.append(b'BT\n/F1 18 Tf\n20 100 Td\n(KEEP ME) Tj\nET\n')
                  else:
                      raise AssertionError(kind)

              font_object = next_object
              objects.append(b'1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n')
              kids = ' '.join(f'{number} 0 R' for number in page_object_numbers).encode()
              objects.append(
                  b'2 0 obj\n<< /Type /Pages /Kids [' + kids + b'] /Count ' + str(len(page_kinds)).encode() + b' >>\nendobj\n'
              )

              for page_number, kind, content_object in zip(page_object_numbers, page_kinds, content_objects):
                  resources = b' /Resources << /Font << /F1 ' + str(font_object).encode() + b' 0 R >> >>' if kind == 'text' else b''
                  objects.append(
                      str(page_number).encode()
                      + b' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 200 200] /Contents '
                      + str(content_object).encode()
                      + b' 0 R'
                      + resources
                      + b' >>\nendobj\n'
                  )

              for object_number, payload in zip(content_objects, content_payloads):
                  objects.append(
                      str(object_number).encode()
                      + b' 0 obj\n<< /Length '
                      + str(len(payload)).encode()
                      + b' >>\nstream\n'
                      + payload
                      + b'endstream\nendobj\n'
                  )

              objects.append(
                  str(font_object).encode()
                  + b' 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n'
              )
              objects.sort(key=lambda obj: int(obj.split(b' ', 1)[0]))

              data = bytearray(b'%PDF-1.4\n%\xe2\xe3\xcf\xd3\n')
              offsets = {0: 0}
              for obj in objects:
                  number = int(obj.split(b' ', 1)[0])
                  offsets[number] = len(data)
                  data.extend(obj)
              size = max(offsets) + 1
              xref = len(data)
              data.extend(f'xref\n0 {size}\n'.encode())
              data.extend(b'0000000000 65535 f \n')
              for number in range(1, size):
                  data.extend(f'{offsets[number]:010d} 00000 n \n'.encode())
              data.extend(f'trailer\n<< /Size {size} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
              return bytes(data)

          assert _compress_page_ranges([1, 2, 3, 5, 7, 8]) == '1-3,5,7-8'
          client = TestClient(app)
          source = build_pdf(['blank', 'vector', 'text'])
          response = client.post(
              '/pdf/remove-blank-pages',
              files={'file': ('mixed.pdf', source, 'application/pdf')},
          )
          assert response.status_code == 200, response.text
          assert response.headers['x-solyan-blank-pages-removed'] == '1'
          assert response.headers['x-solyan-blank-pages'] == '1'
          assert response.headers['x-solyan-blank-threshold'] == '10'
          assert response.headers['x-solyan-blank-white-percent'] == '99.9'

          with tempfile.TemporaryDirectory(prefix='solyan-remove-blank-ci-') as temp_dir:
              output = Path(temp_dir) / 'output.pdf'
              output.write_bytes(response.content)
              subprocess.run(['qpdf', '--check', str(output)], check=True)
              pages = subprocess.check_output(['qpdf', '--show-npages', str(output)], text=True).strip()
              assert pages == '2', pages
              text = subprocess.check_output(['pdftotext', str(output), '-'], text=True)
              assert 'KEEP ME' in text, text

          all_blank = client.post(
              '/pdf/remove-blank-pages',
              files={'file': ('blank.pdf', build_pdf(['blank']), 'application/pdf')},
          )
          assert all_blank.status_code == 422, all_blank.text
          assert 'All pages were detected as blank' in all_blank.text

          invalid_threshold = client.post(
              '/pdf/remove-blank-pages',
              files={'file': ('mixed.pdf', source, 'application/pdf')},
              data={'threshold': '300', 'white_percent': '99.9'},
          )
          assert invalid_threshold.status_code == 422, invalid_threshold.text
          print('conservative blank-page removal ok')
          PY
