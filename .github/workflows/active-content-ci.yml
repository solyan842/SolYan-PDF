name: Active Content Inspector CI

on:
  pull_request:
    paths:
      - 'backend/app/active_content.py'
      - 'backend/app/sanitize.py'
      - 'backend/app/main.py'
      - 'frontend/app/active-content/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/active-content-ci.yml'
      - 'docs/ROADMAP.md'
  push:
    branches:
      - main
    paths:
      - 'backend/app/active_content.py'
      - 'backend/app/sanitize.py'
      - 'backend/app/main.py'
      - 'frontend/app/active-content/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/active-content-ci.yml'
      - 'docs/ROADMAP.md'

jobs:
  active-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install qpdf 11.9-compatible tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          qpdf --version
          qpdf --help=--json-output >/dev/null
          qpdf --help=--json-stream-data >/dev/null
          qpdf --help=--show-object >/dev/null
          qpdf --help=--filtered-stream-data >/dev/null

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Build active and clean fixtures
        run: |
          cat >/tmp/active.json <<'JSON'
          {
            "qpdf": [
              {"jsonversion": 2, "pdfversion": "1.7"},
              {
                "obj:1 0 R": {"value": {"/Type": "/Catalog", "/Pages": "2 0 R", "/OpenAction": "5 0 R", "/AA": {"/WC": "16 0 R"}, "/Names": {"/JavaScript": "10 0 R", "/EmbeddedFiles": "11 0 R"}, "/AcroForm": {"/Fields": [], "/XFA": "17 0 R"}, "/AF": ["7 0 R"]}},
                "obj:2 0 R": {"value": {"/Type": "/Pages", "/Count": 1, "/Kids": ["3 0 R"]}},
                "obj:3 0 R": {"value": {"/Type": "/Page", "/Parent": "2 0 R", "/MediaBox": [0, 0, 612, 792], "/Annots": ["4 0 R", "6 0 R", "18 0 R"]}},
                "obj:4 0 R": {"value": {"/Type": "/Annot", "/Subtype": "/Link", "/Rect": [10, 10, 200, 40], "/A": "15 0 R"}},
                "obj:5 0 R": {"value": {"/S": "/JavaScript", "/JS": "u:app.alert('owned')"}},
                "obj:6 0 R": {"value": {"/Type": "/Annot", "/Subtype": "/Screen", "/Rect": [10, 50, 200, 100]}},
                "obj:7 0 R": {"value": {"/Type": "/Filespec", "/F": "u:payload.bin", "/UF": "u:payload.bin", "/EF": {"/F": "8 0 R"}}},
                "obj:8 0 R": {"stream": {"dict": {"/Type": "/EmbeddedFile"}, "data": "UEFZTE9BRA=="}},
                "obj:10 0 R": {"value": {"/Names": ["u:doc-js", "5 0 R", "u:stream-js", "13 0 R"]}},
                "obj:11 0 R": {"value": {"/Names": ["u:payload.bin", "7 0 R"]}},
                "obj:13 0 R": {"value": {"/S": "/JavaScript", "/JS": "14 0 R"}},
                "obj:14 0 R": {"stream": {"dict": {}, "data": "Y29uc29sZS5wcmludGxuKCdzdHJlYW0nKTs="}},
                "obj:15 0 R": {"value": {"/S": "/URI", "/URI": "u:https://example.invalid/"}},
                "obj:16 0 R": {"value": {"/S": "/Launch", "/F": "u:calc.exe"}},
                "obj:17 0 R": {"stream": {"dict": {}, "data": "PFhmYT48L1hmYT4="}},
                "obj:18 0 R": {"value": {"/Type": "/Annot", "/Subtype": "/FileAttachment", "/Rect": [10, 120, 30, 140], "/FS": "7 0 R"}},
                "obj:19 0 R": {"value": {"/S": "/JavaScript", "/JS": "u:app.alert('unreachable')"}},
                "trailer": {"value": {"/Root": "1 0 R", "/Size": 20}}
              }
            ]
          }
          JSON
          qpdf --json-input /tmp/active.json /tmp/active.pdf
          qpdf --check /tmp/active.pdf
          qpdf --encrypt inspect owner-secret 256 -- /tmp/active.pdf /tmp/active-encrypted.pdf
          qpdf --password=inspect --check /tmp/active-encrypted.pdf

          cat >/tmp/clean.json <<'JSON'
          {
            "qpdf": [
              {"jsonversion": 2, "pdfversion": "1.7"},
              {
                "obj:1 0 R": {"value": {"/Type": "/Catalog", "/Pages": "2 0 R", "/PieceInfo": {"/Vendor": {"/A": "u:not-an-action"}}}},
                "obj:2 0 R": {"value": {"/Type": "/Pages", "/Count": 1, "/Kids": ["3 0 R"]}},
                "obj:3 0 R": {"value": {"/Type": "/Page", "/Parent": "2 0 R", "/MediaBox": [0, 0, 612, 792]}},
                "trailer": {"value": {"/Root": "1 0 R", "/Size": 4}}
              }
            ]
          }
          JSON
          qpdf --json-input /tmp/clean.json /tmp/clean.pdf
          qpdf --check /tmp/clean.pdf

      - name: Inspect reachable active content and JavaScript
        env:
          PYTHONPATH: backend
        run: |
          python <<'PY'
          from pathlib import Path
          from app.active_content import _inspect_pdf

          report = _inspect_pdf(Path('/tmp/active.pdf'))
          print(report)
          summary = report['summary']
          assert report['hasActiveContent'] is True
          assert summary['javascript'] == 2, summary
          assert summary['actions'] == 4, summary
          assert summary['activeAnnotations'] == 2, summary
          assert summary['attachmentReferences'] >= 2, summary
          assert summary['triggers'] >= 4, summary

          scripts = {item.get('name'): item for item in report['javascript']}
          assert "app.alert('owned')" in scripts['doc-js']['script']
          assert "console.println('stream');" in scripts['stream-js']['script']
          assert scripts['stream-js']['source'] == 'stream'
          assert all('unreachable' not in item.get('script', '') for item in report['javascript'])

          action_types = {item.get('actionType') for item in report['findings'] if item.get('kind') == 'action'}
          assert {'/JavaScript', '/URI', '/Launch'} <= action_types
          assert any(item.get('subtype') == '/Screen' for item in report['findings'])
          assert any(item.get('subtype') == '/FileAttachment' for item in report['findings'])
          assert report['findingsTruncated'] is False

          encrypted = _inspect_pdf(Path('/tmp/active-encrypted.pdf'), 'inspect')
          assert encrypted['summary']['javascript'] == 2, encrypted
          assert encrypted['summary']['actions'] == 4, encrypted
          encrypted_scripts = {item.get('name'): item for item in encrypted['javascript']}
          assert "console.println('stream');" in encrypted_scripts['stream-js']['script']
          PY

      - name: Verify clean PDF and route registration
        env:
          PYTHONPATH: backend
        run: |
          python <<'PY'
          from pathlib import Path
          from app.active_content import _inspect_pdf
          from app.main import app

          report = _inspect_pdf(Path('/tmp/clean.pdf'))
          assert report['hasActiveContent'] is False, report
          assert report['summary']['javascript'] == 0
          assert report['summary']['actions'] == 0
          assert report['summary']['triggers'] == 0
          assert report['findings'] == []

          paths = {route.path for route in app.routes}
          assert '/pdf/inspect-active-content' in paths
          print('active-content inspector gate ok')
          PY
