name: Windows Office Runtime CI

on:
  pull_request:
    paths:
      - "desktop/backend/office_runner.py"
      - "desktop/backend/stage-office-runtime.ps1"
      - "desktop/vendor/libreoffice-windows-x64.json"
      - "engines/office-service/**"
      - ".github/workflows/windows-office-runtime-ci.yml"
  push:
    branches:
      - "feat/windows-desktop-v1"
    paths:
      - "desktop/backend/office_runner.py"
      - "desktop/backend/stage-office-runtime.ps1"
      - "desktop/vendor/libreoffice-windows-x64.json"
      - "engines/office-service/**"
      - ".github/workflows/windows-office-runtime-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-office-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-office-runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/backend/requirements-windows.txt

      - name: Prepare dependencies and diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath artifacts/office-pip-bootstrap.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r desktop/backend/requirements-windows.txt 2>&1 | Tee-Object -FilePath artifacts/office-pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage checksum-pinned LibreOffice runtime
        shell: pwsh
        run: |
          & ./desktop/backend/stage-office-runtime.ps1 2>&1 | Tee-Object -FilePath artifacts/office-runtime-stage.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build local Office sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --onefile --name solyan-office --paths engines/office-service --collect-submodules app desktop/backend/office_runner.py 2>&1 | Tee-Object -FilePath artifacts/office-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/solyan-office.exe desktop/src-tauri/resources/office/solyan-office.exe
          if (-not (Test-Path desktop/src-tauri/resources/office/solyan-office.exe)) { throw "solyan-office.exe was not staged" }

      - name: Smoke Office health and TXT to PDF conversion
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $officeExe = (Resolve-Path "desktop/src-tauri/resources/office/solyan-office.exe").Path
          $soffice = Get-ChildItem "desktop/src-tauri/resources/office/libreoffice" -Filter soffice.com -File -Recurse | Select-Object -First 1
          if (-not $soffice) { $soffice = Get-ChildItem "desktop/src-tauri/resources/office/libreoffice" -Filter soffice.exe -File -Recurse | Select-Object -First 1 }
          if (-not $soffice) { throw "soffice executable was not found for smoke" }
          $env:PATH = "$($soffice.Directory.FullName);$env:PATH"

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()

          $stdoutLog = Join-Path (Get-Location) "artifacts/office-sidecar-stdout.log"
          $stderrLog = Join-Path (Get-Location) "artifacts/office-sidecar-stderr.log"
          $office = Start-Process -FilePath $officeExe -ArgumentList "--port", $port -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          try {
            $health = $null
            $lastHealthError = $null
            for ($i = 0; $i -lt 12; $i++) {
              Start-Sleep -Seconds 1
              if ($office.HasExited) { throw "solyan-office.exe exited before health became ready" }
              try {
                # /health probes LibreOffice with a subprocess timeout of up to 10s.
                # Keep the HTTP request longer and serial so abandoned requests cannot
                # pile up soffice.bin processes on a slow Windows cold start.
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health" -TimeoutSec 30
                if ($health.status -eq "ok") { break }
              } catch {
                $lastHealthError = $_.Exception.Message
              }
            }
            if (-not $health -or $health.status -ne "ok") {
              if (Test-Path $stderrLog) {
                Get-Content $stderrLog -ErrorAction SilentlyContinue | Tee-Object -FilePath artifacts/office-sidecar-stderr-final.log
              }
              throw "Office sidecar did not become healthy. Last error: $lastHealthError"
            }

            $input = Join-Path (Get-Location) "artifacts/office-smoke.txt"
            $output = Join-Path (Get-Location) "artifacts/office-smoke.pdf"
            [System.IO.File]::WriteAllText($input, "SolYan PDF Windows Office runtime smoke`r`nVietnamese: Tiếng Việt", [System.Text.UTF8Encoding]::new($false))
            & curl.exe --silent --show-error --fail --max-time 180 -X POST -F "file=@$input;type=text/plain" "http://127.0.0.1:$port/convert/to-pdf" --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path $output)) { throw "Office conversion smoke did not create PDF output" }
            $bytes = [System.IO.File]::ReadAllBytes($output)
            if ($bytes.Length -lt 5 -or [System.Text.Encoding]::ASCII.GetString($bytes, 0, 5) -ne "%PDF-") { throw "Office conversion smoke output is not a PDF" }

            @(
              "office_sidecar=$officeExe",
              "libreoffice=$($soffice.FullName)",
              "health_status=$($health.status)",
              "health_engine=$($health.engine)",
              "txt_to_pdf_bytes=$($bytes.Length)"
            ) | Set-Content artifacts/desktop-office-runtime-smoke.log
          } finally {
            if (-not $office.HasExited) {
              $office.Kill()
              $office.WaitForExit()
            }
          }

      - name: Upload Office diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-office-runtime-diagnostics
          path: artifacts/
          if-no-files-found: warn
