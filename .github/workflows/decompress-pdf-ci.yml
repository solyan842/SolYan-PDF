name: Decompress PDF CI

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'frontend/app/decompress/**'
      - 'frontend/app/page.tsx'
      - 'frontend/components/ServerPdfTool.tsx'
      - '.github/workflows/decompress-pdf-ci.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/ROADMAP.md'
  push:
    branches:
      - main
    paths:
      - 'backend/app/main.py'
      - 'frontend/app/decompress/**'
      - 'frontend/app/page.tsx'
      - 'frontend/components/ServerPdfTool.tsx'
      - '.github/workflows/decompress-pdf-ci.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/ROADMAP.md'

jobs:
  decompress-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install qpdf and route-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi==0.119.0 \
            uvicorn==0.37.0 \
            python-multipart==0.0.20 \
            httpx==0.28.1 \
            reportlab==4.4.4
          qpdf --version

      - name: Gate real decompression route and retained content
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python <<'PY' 2>&1 | tee /tmp/decompress-pdf-ci.log
          from __future__ import annotations

          import subprocess
          import tempfile
          from pathlib import Path

          from fastapi.testclient import TestClient
          from reportlab.pdfgen import canvas

          from app.main import app

          root = Path(tempfile.mkdtemp(prefix='solyan-decompress-ci-'))
          raw = root / 'raw.pdf'
          compressed = root / 'compressed.pdf'
          output = root / 'decompressed.pdf'

          c = canvas.Canvas(str(raw))
          c.drawString(72, 720, 'SolYan Decompress PDF retains vector text 2026')
          c.rect(72, 650, 180, 40, stroke=1, fill=0)
          c.save()

          subprocess.run([
              'qpdf',
              '--object-streams=generate',
              '--compress-streams=y',
              '--recompress-flate',
              '--compression-level=9',
              str(raw),
              str(compressed),
          ], check=True)

          client = TestClient(app)
          response = client.post(
              '/pdf/decompress',
              files={'file': ('sample.pdf', compressed.read_bytes(), 'application/pdf')},
          )
          print('status:', response.status_code)
          print('content-disposition:', response.headers.get('content-disposition'))
          assert response.status_code == 200, response.text
          assert response.headers['content-type'].startswith('application/pdf')
          assert 'solyan-decompressed.pdf' in response.headers.get('content-disposition', '')
          output.write_bytes(response.content)

          subprocess.run(['qpdf', '--check', str(output)], check=True)
          assert int(subprocess.check_output(['qpdf', '--show-npages', str(output)]).decode().strip()) == 1

          text = subprocess.check_output(['pdftotext', str(output), '-']).decode('utf-8', 'replace')
          print('retained text:', text.strip())
          assert 'SolYan Decompress PDF retains vector text 2026' in text

          qdf = root / 'decompressed-qdf.pdf'
          subprocess.run(['qpdf', '--qdf', '--object-streams=disable', str(output), str(qdf)], check=True)
          qdf_bytes = qdf.read_bytes()
          assert b'SolYan Decompress PDF retains vector text 2026' in qdf_bytes

          route = next(route for route in app.routes if getattr(route, 'path', None) == '/pdf/decompress')
          assert 'POST' in route.methods
          print('real qpdf decompress route: PASS')
          PY

      - name: Gate exact qpdf decompression flags and UI wiring
        run: |
          set -euo pipefail
          grep -q '"--stream-data=uncompress", "--object-streams=disable"' backend/app/main.py
          grep -q "| '/pdf/decompress'" frontend/components/ServerPdfTool.tsx
          grep -q 'endpoint="/pdf/decompress"' frontend/app/decompress/page.tsx
          grep -q "href: '/decompress'" frontend/app/page.tsx
          echo 'qpdf decompression flags/UI wiring: PASS' | tee -a /tmp/decompress-pdf-ci.log

      - name: Upload Decompress gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompress-pdf-ci-evidence
          path: /tmp/decompress-pdf-ci.log
          if-no-files-found: warn
          retention-days: 14
