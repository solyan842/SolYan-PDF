name: PDF to HTML CI

on:
  pull_request:
    paths:
      - 'backend/app/pdf_to_html.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-html/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-html-ci.yml'
      - 'docs/V1.3-PARITY-AUDIT.md'
  push:
    branches:
      - main
    paths:
      - 'backend/app/pdf_to_html.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-html/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-html-ci.yml'
      - 'docs/V1.3-PARITY-AUDIT.md'

jobs:
  pdf-to-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install Poppler and backend test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
          pdftohtml -v 2>&1 | tee /tmp/pdftohtml-version.log
          python -m pip install --require-hashes -r backend/requirements.hashed.lock
          python -m pip install --no-deps -r backend/requirements.txt
          python -m pip install httpx==0.28.1 pypdf==6.1.1
          python -m pip check

      - name: Compile backend PDF to HTML path
        run: python -m compileall backend/app

      - name: Gate self-contained conversion, page range, CSP and dangerous-link blocking
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/solyan-pdf-to-html
          python <<'PY' 2>&1 | tee /tmp/solyan-pdf-to-html/gate.log
          from __future__ import annotations

          import io
          from pathlib import Path

          from fastapi.testclient import TestClient
          from pypdf import PdfWriter
          from pypdf.generic import (
              ArrayObject,
              DecodedStreamObject,
              DictionaryObject,
              NameObject,
              NumberObject,
              RectangleObject,
              TextStringObject,
          )

          from app.main import app

          root = Path('/tmp/solyan-pdf-to-html')
          fixture = root / 'fixture.pdf'
          writer = PdfWriter()

          for page_number, label in ((1, 'PAGE-ONE'), (2, 'PAGE-TWO')):
              page = writer.add_blank_page(width=300, height=300)
              font = DictionaryObject({
                  NameObject('/Type'): NameObject('/Font'),
                  NameObject('/Subtype'): NameObject('/Type1'),
                  NameObject('/BaseFont'): NameObject('/Helvetica'),
              })
              font_ref = writer._add_object(font)
              resources = DictionaryObject({
                  NameObject('/Font'): DictionaryObject({NameObject('/F1'): font_ref}),
              })

              command = f'BT /F1 18 Tf 40 240 Td ({label}) Tj ET'.encode('ascii')
              if page_number == 1:
                  image = DecodedStreamObject()
                  image.set_data(bytes([255, 0, 0]) * 4)
                  image.update({
                      NameObject('/Type'): NameObject('/XObject'),
                      NameObject('/Subtype'): NameObject('/Image'),
                      NameObject('/Width'): NumberObject(2),
                      NameObject('/Height'): NumberObject(2),
                      NameObject('/ColorSpace'): NameObject('/DeviceRGB'),
                      NameObject('/BitsPerComponent'): NumberObject(8),
                  })
                  image_ref = writer._add_object(image)
                  resources[NameObject('/XObject')] = DictionaryObject({NameObject('/Im0'): image_ref})
                  command += b' q 50 0 0 50 40 160 cm /Im0 Do Q'

                  action = DictionaryObject({
                      NameObject('/S'): NameObject('/URI'),
                      NameObject('/URI'): TextStringObject('javascript:alert(1)'),
                  })
                  annotation = DictionaryObject({
                      NameObject('/Type'): NameObject('/Annot'),
                      NameObject('/Subtype'): NameObject('/Link'),
                      NameObject('/Rect'): RectangleObject([35, 230, 150, 260]),
                      NameObject('/Border'): ArrayObject([NumberObject(0), NumberObject(0), NumberObject(0)]),
                      NameObject('/A'): action,
                  })
                  page[NameObject('/Annots')] = ArrayObject([writer._add_object(annotation)])

              page[NameObject('/Resources')] = resources
              contents = DecodedStreamObject()
              contents.set_data(command)
              page[NameObject('/Contents')] = writer._add_object(contents)

          with fixture.open('wb') as output:
              writer.write(output)

          client = TestClient(app)
          source = fixture.read_bytes()
          response = client.post('/pdf/to-html', files={'file': ('fixture.pdf', source, 'application/pdf')})
          assert response.status_code == 200, response.text
          assert response.headers['content-type'].startswith('text/html'), response.headers
          assert 'attachment; filename="solyan-pdf.html"' in response.headers['content-disposition']
          assert int(response.headers['X-SolYan-Blocked-HTML-Links']) == 1, response.headers
          text = response.content.decode('utf-8')
          assert 'PAGE-ONE' in text and 'PAGE-TWO' in text
          assert 'data:image/' in text, 'expected embedded data URL image'
          assert 'href="#"' in text, 'dangerous URI must be neutralized'
          assert 'javascript:' not in text.lower(), 'dangerous URI survived sanitizer'
          assert 'Content-Security-Policy' in text
          assert "default-src 'none'" in text
          root.joinpath('all-pages.html').write_bytes(response.content)

          ranged = client.post(
              '/pdf/to-html',
              files={'file': ('fixture.pdf', source, 'application/pdf')},
              data={'first_page': '2', 'last_page': '2'},
          )
          assert ranged.status_code == 200, ranged.text
          ranged_text = ranged.content.decode('utf-8')
          assert 'PAGE-TWO' in ranged_text
          assert 'PAGE-ONE' not in ranged_text
          root.joinpath('page-two.html').write_bytes(ranged.content)

          invalid_range = client.post(
              '/pdf/to-html',
              files={'file': ('fixture.pdf', source, 'application/pdf')},
              data={'first_page': '2', 'last_page': '1'},
          )
          assert invalid_range.status_code == 422, invalid_range.text
          print('self-contained conversion/page-range/security gate: PASS')
          PY

      - name: Gate encrypted PDF password handling
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          qpdf --encrypt html-pass owner-pass 256 -- /tmp/solyan-pdf-to-html/fixture.pdf /tmp/solyan-pdf-to-html/encrypted.pdf
          python <<'PY' 2>&1 | tee -a /tmp/solyan-pdf-to-html/gate.log
          from pathlib import Path
          from fastapi.testclient import TestClient
          from app.main import app

          root = Path('/tmp/solyan-pdf-to-html')
          encrypted = root.joinpath('encrypted.pdf').read_bytes()
          client = TestClient(app)

          ok = client.post(
              '/pdf/to-html',
              files={'file': ('encrypted.pdf', encrypted, 'application/pdf')},
              data={'password': 'html-pass'},
          )
          assert ok.status_code == 200, ok.text
          assert 'PAGE-ONE' in ok.content.decode('utf-8')

          bad = client.post(
              '/pdf/to-html',
              files={'file': ('encrypted.pdf', encrypted, 'application/pdf')},
              data={'password': 'wrong-pass'},
          )
          assert bad.status_code == 401, (bad.status_code, bad.text)
          print('encrypted password handling: PASS')
          PY

      - name: Gate product wiring
        run: |
          set -euo pipefail
          grep -q 'from .pdf_to_html import router as pdf_to_html_router' backend/app/main.py
          grep -q 'app.include_router(pdf_to_html_router)' backend/app/main.py
          grep -q '/pdf/to-html' frontend/app/pdf-to-html/page.tsx
          grep -q "href: '/pdf-to-html'" frontend/app/page.tsx
          grep -q 'poppler-utils' backend/Dockerfile
          echo 'route/UI/existing Poppler dependency wiring: PASS' | tee -a /tmp/solyan-pdf-to-html/gate.log

      - name: Upload PDF to HTML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-html-evidence
          path: |
            /tmp/solyan-pdf-to-html/gate.log
            /tmp/solyan-pdf-to-html/fixture.pdf
            /tmp/solyan-pdf-to-html/encrypted.pdf
            /tmp/solyan-pdf-to-html/all-pages.html
            /tmp/solyan-pdf-to-html/page-two.html
            /tmp/pdftohtml-version.log
          if-no-files-found: warn
          retention-days: 14
