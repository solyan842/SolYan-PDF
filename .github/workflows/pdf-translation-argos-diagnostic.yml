name: PDF Translation Argos Diagnostic

on:
  push:
    branches:
      - test/v1.6-argos-live-diagnostic-20261016
    paths:
      - 'scripts/generate_translation_fixture.py'
      - 'scripts/argos_compat/sitecustomize.py'
      - '.github/workflows/pdf-translation-argos-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  argos-en-vi-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PDF2ZH_REPO: https://github.com/PDFMathTranslate/PDFMathTranslate.git
      PDF2ZH_SHA: d16604dabb5c3f4c6d4daf37197b218b0dbd4df2
      ARGOS_MODEL_URL: https://argos-net.com/v1/translate-en_vi-1_9.argosmodel
      ARGOS_MODEL_SHA256: 86957101aa4099aa9a1a7492e41987d938d3cf0fdaf4fb684c0797a9d567dd16
      WORK: /tmp/solyan-argos-live

    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Build and validate selectable-text source fixture
        run: |
          set -euo pipefail
          mkdir -p "$WORK/input" "$WORK/output" "$WORK/evidence"
          python scripts/generate_translation_fixture.py "$WORK/input/argos-en-vi.pdf"
          pdfinfo "$WORK/input/argos-en-vi.pdf" | tee "$WORK/evidence/source-pdfinfo.txt"
          test "$(pdfinfo "$WORK/input/argos-en-vi.pdf" | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext -layout "$WORK/input/argos-en-vi.pdf" "$WORK/evidence/source.txt"
          grep -Fq 'This document is a simple translation test.' "$WORK/evidence/source.txt"
          grep -Fq 'English to Vietnamese' "$WORK/evidence/source.txt"

      - name: Checkout pinned PDFMathTranslate upstream
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$PDF2ZH_REPO" "$WORK/PDFMathTranslate"
          git -C "$WORK/PDFMathTranslate" checkout --detach "$PDF2ZH_SHA"
          test "$(git -C "$WORK/PDFMathTranslate" rev-parse HEAD)" = "$PDF2ZH_SHA"
          grep -Fq 'import argotranslate.translate' "$WORK/PDFMathTranslate/pdf2zh/translator.py"
          {
            echo "PDFMathTranslate repository: $PDF2ZH_REPO"
            echo "PDFMathTranslate commit: $(git -C "$WORK/PDFMathTranslate" rev-parse HEAD)"
            echo 'Observed upstream Argos import defect: import argotranslate.translate'
            echo 'Mitigation: runtime sys.modules alias loaded through external-process sitecustomize; upstream source remains unmodified.'
          } | tee "$WORK/evidence/upstream.txt"

      - name: Install pinned upstream with Argos and ultrafast extras
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "$WORK/PDFMathTranslate[argostranslate,ultrafast]" 2>&1 | tee "$WORK/evidence/install.log"
          python -m pip check 2>&1 | tee "$WORK/evidence/pip-check.txt"
          pdf2zh --version | tee "$WORK/evidence/pdf2zh-version.txt"
          python - <<'PY' | tee "$WORK/evidence/argos-version.txt"
          import importlib.metadata
          print('argostranslate', importlib.metadata.version('argostranslate'))
          print('pdf-inspector', importlib.metadata.version('pdf-inspector'))
          PY

      - name: Download and install pinned Argos EN to VI model
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "$ARGOS_MODEL_URL" \
            --output "$WORK/translate-en_vi-1_9.argosmodel"
          sha256sum "$WORK/translate-en_vi-1_9.argosmodel" | tee "$WORK/evidence/argos-model-sha256.txt"
          echo "$ARGOS_MODEL_SHA256  $WORK/translate-en_vi-1_9.argosmodel" | sha256sum --check -
          python - <<'PY' | tee "$WORK/evidence/argos-plain-translation.txt"
          import os
          from pathlib import Path
          import argostranslate.package
          import argostranslate.translate

          model = Path(os.environ['WORK']) / 'translate-en_vi-1_9.argosmodel'
          argostranslate.package.install_from_path(model)

          source = 'This document is a simple translation test.'
          result = argostranslate.translate.translate(source, 'en', 'vi')
          print('source:', source)
          print('translation:', result)
          if not result.strip() or result.strip().casefold() == source.casefold():
              raise SystemExit('Argos returned no semantic translation')
          if not any(ord(char) > 127 for char in result):
              raise SystemExit('Argos EN->VI smoke lacks any non-ASCII Vietnamese signal')
          PY

      - name: Validate runtime-only compatibility alias
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/argos_compat
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$WORK/evidence/compat-alias.txt"
          import importlib
          import argostranslate.translate as expected

          aliased = importlib.import_module('argotranslate.translate')
          if aliased is not expected:
              raise SystemExit('runtime alias does not resolve to argostranslate.translate')
          print('argotranslate.translate -> argostranslate.translate: PASS')
          print('upstream source modified: NO')
          PY

      - name: Translate real PDF through pinned PDFMathTranslate plus Argos
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/argos_compat
        run: |
          set -euo pipefail
          timeout 900s pdf2zh \
            "$WORK/input/argos-en-vi.pdf" \
            --lang-in en \
            --lang-out vi \
            --service argos \
            --thread 1 \
            --ultrafast \
            --ignore-cache \
            --output "$WORK/output" \
            2>&1 | tee "$WORK/evidence/pdf2zh-live.log"

      - name: Validate translated PDF outputs
        run: |
          set -euo pipefail
          mapfile -t mono < <(find "$WORK/output" -maxdepth 1 -type f -name '*-mono.pdf' -print)
          mapfile -t dual < <(find "$WORK/output" -maxdepth 1 -type f -name '*-dual.pdf' -print)
          test "${#mono[@]}" -eq 1
          test "${#dual[@]}" -eq 1

          for pdf in "${mono[0]}" "${dual[0]}"; do
            test -s "$pdf"
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" -ge 1
            pdfinfo "$pdf" >> "$WORK/evidence/output-pdfinfo.txt"
            echo '---' >> "$WORK/evidence/output-pdfinfo.txt"
          done

          pdftotext -layout "${mono[0]}" "$WORK/evidence/mono.txt" || true
          pdftotext -layout "${dual[0]}" "$WORK/evidence/dual.txt" || true

          python - <<'PY' | tee "$WORK/evidence/result-summary.txt"
          import os
          import unicodedata
          from pathlib import Path

          root = Path(os.environ['WORK'])
          source = unicodedata.normalize('NFC', (root / 'evidence/source.txt').read_text(encoding='utf-8', errors='replace')).strip()
          mono = unicodedata.normalize('NFC', (root / 'evidence/mono.txt').read_text(encoding='utf-8', errors='replace')).strip()
          dual = unicodedata.normalize('NFC', (root / 'evidence/dual.txt').read_text(encoding='utf-8', errors='replace')).strip()

          source_sentence = 'This document is a simple translation test.'
          markers = ('tài liệu', 'dịch', 'tiếng việt', 'quyền riêng tư', 'xử lý', 'trang', 'bố cục')
          hits = sorted({item for item in markers if item in mono.casefold()})

          print('source chars:', len(source))
          print('mono extracted chars:', len(mono))
          print('dual extracted chars:', len(dual))
          print('Vietnamese markers:', ', '.join(hits))

          if len(hits) < 2:
              raise SystemExit(f'Translated mono PDF has insufficient Vietnamese signal: {hits!r}')
          if source_sentence.casefold() in mono.casefold():
              raise SystemExit('Translated mono PDF still contains the exact English source sentence')
          if source_sentence.casefold() not in dual.casefold():
              raise SystemExit('Bilingual PDF does not retain the original English source sentence')
          PY

          cp "${mono[0]}" "$WORK/evidence/argos-en-vi-mono.pdf"
          cp "${dual[0]}" "$WORK/evidence/argos-en-vi-dual.pdf"
          echo 'live Argos EN->VI PDF diagnostic: PASS' | tee -a "$WORK/evidence/result-summary.txt"

      - name: Upload live translation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-translation-argos-en-vi-live
          path: /tmp/solyan-argos-live/evidence
          if-no-files-found: warn
          retention-days: 14
