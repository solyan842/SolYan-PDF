name: Generate Python lockfiles

on:
  push:
    branches:
      - chore/python-lockfiles
    paths:
      - '.github/workflows/generate-python-locks.yml'
      - 'backend/requirements.txt'
      - 'engines/office-service/requirements.txt'
      - 'engines/sign-service/requirements.txt'
      - 'engines/archive-service/requirements.txt'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/python-lockfiles

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Generate clean transitive locks
        run: |
          set -euo pipefail
          services=(backend engines/office-service engines/sign-service engines/archive-service)
          for service in "${services[@]}"; do
            echo "Locking ${service}"
            rm -rf /tmp/solyan-lock-venv
            python -m venv /tmp/solyan-lock-venv
            /tmp/solyan-lock-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
            /tmp/solyan-lock-venv/bin/python -m pip install --disable-pip-version-check -r "${service}/requirements.txt"
            {
              echo '# Generated by .github/workflows/generate-python-locks.yml'
              echo '# Python 3.13.16; regenerate when requirements.txt changes.'
              /tmp/solyan-lock-venv/bin/python -m pip freeze --disable-pip-version-check | LC_ALL=C sort
            } > "${service}/requirements.lock"
            /tmp/solyan-lock-venv/bin/python -m pip check
          done
          rm -rf /tmp/solyan-lock-venv

      - name: Commit lockfiles when changed
        run: |
          set -euo pipefail
          paths=(backend/requirements.lock engines/office-service/requirements.lock engines/sign-service/requirements.lock engines/archive-service/requirements.lock)
          if git diff --quiet -- "${paths[@]}" && git ls-files --error-unmatch "${paths[@]}" >/dev/null 2>&1; then
            echo 'Python lockfiles already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'build: lock Python transitive dependency graphs'
          git push origin HEAD:chore/python-lockfiles
