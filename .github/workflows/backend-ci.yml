name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system engines
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf iputils-ping
          qpdf --version
          ping -V

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app

      - name: Import app and verify qpdf health
        run: python -c "from app.main import health; print(health())"

      - name: Verify network utility routes
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          ip = client.get('/net/ip', headers={'x-forwarded-for': '203.0.113.10'}).json()
          assert ip['ip'] == '203.0.113.10'
          ping = client.post('/net/ping', json={'host': '127.0.0.1'})
          assert ping.status_code == 200 and ping.json()['reachable'] is True
          print('network routes ok')
          PY
