name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install system engines
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf iputils-ping
          qpdf --version
          ping -V

      - name: Install hash-verified dependencies
        run: |
          python -m pip install --require-hashes -r requirements.hashed.lock
          python -m pip install --no-deps -r requirements.txt
          python -m pip check

      - name: Compile Python
        run: python -m compileall app

      - name: Import app and verify qpdf health
        run: python -c "from app.main import health; print(health())"

      - name: Verify OCR XLSX binary proxy
        run: |
          python - <<'PY'
          import httpx
          from fastapi.testclient import TestClient
          from unittest.mock import patch

          from app.main import app

          XLSX = b'PK\x03\x04solyan-xlsx'

          class FakeClient:
              def __init__(self, *args, **kwargs):
                  pass

              def __enter__(self):
                  return self

              def __exit__(self, exc_type, exc, tb):
                  return False

              def post(self, url, files):
                  assert url.endswith('/ocr/xlsx'), url
                  filename, data, content_type = files['file']
                  assert filename == 'scan.pdf'
                  assert data.startswith(b'%PDF-')
                  assert content_type == 'application/pdf'
                  return httpx.Response(
                      200,
                      content=XLSX,
                      headers={
                          'content-type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                          'content-disposition': 'attachment; filename="solyan-ocr-tables.xlsx"',
                          'x-solyan-ocr-engine': 'PP-StructureV3',
                          'x-solyan-ocr-pages': '2',
                          'x-solyan-ocr-table-workbooks': '3',
                      },
                      request=httpx.Request('POST', url),
                  )

          with patch('app.ocr_proxy.httpx.Client', FakeClient):
              response = TestClient(app).post(
                  '/ocr/xlsx',
                  files={'file': ('scan.pdf', b'%PDF-1.7\nscan', 'application/pdf')},
              )

          assert response.status_code == 200, response.text
          assert response.content == XLSX
          assert response.headers['content-type'].startswith('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')
          assert response.headers['content-disposition'] == 'attachment; filename="solyan-ocr-tables.xlsx"'
          assert response.headers['x-solyan-ocr-engine'] == 'PP-StructureV3'
          assert response.headers['x-solyan-ocr-pages'] == '2'
          assert response.headers['x-solyan-ocr-table-workbooks'] == '3'
          print('ocr xlsx binary proxy ok')
          PY

      - name: Verify Bloom no-table XLSX OCR fallback
        run: |
          python - <<'PY'
          import io
          import zipfile
          import httpx
          from fastapi.testclient import TestClient
          from unittest.mock import patch

          from app.bloom_proxy import _is_bloom_no_tables_placeholder
          from app.main import app

          NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'

          def make_xlsx(text: str) -> bytes:
              stream = io.BytesIO()
              with zipfile.ZipFile(stream, 'w', zipfile.ZIP_DEFLATED) as archive:
                  archive.writestr('[Content_Types].xml', '<Types/>')
                  archive.writestr('xl/workbook.xml', f'<workbook xmlns="{NS}"/>')
                  archive.writestr(
                      'xl/sharedStrings.xml',
                      f'<sst xmlns="{NS}"><si><t>{text}</t></si></sst>',
                  )
                  archive.writestr(
                      'xl/worksheets/sheet1.xml',
                      f'<worksheet xmlns="{NS}"><sheetData><row r="1"><c r="A1" t="s"><v>0</v></c></row></sheetData></worksheet>',
                  )
              return stream.getvalue()

          placeholder = make_xlsx('No logical tables detected in document.')
          recognized = make_xlsx('recognized-table-cell')
          assert _is_bloom_no_tables_placeholder(placeholder) is True
          assert _is_bloom_no_tables_placeholder(recognized) is False
          assert _is_bloom_no_tables_placeholder(b'not-an-xlsx') is False

          class FakeBloomClient:
              def __init__(self, *args, **kwargs):
                  pass

              def __enter__(self):
                  return self

              def __exit__(self, exc_type, exc, tb):
                  return False

              def post(self, url, files, data):
                  assert url.endswith('/convert'), url
                  assert data == {'target': 'xlsx'}
                  return httpx.Response(
                      202,
                      json={'job': {'id': 'job-1'}},
                      request=httpx.Request('POST', url),
                  )

              def get(self, url):
                  if '/jobs/' in url:
                      return httpx.Response(
                          200,
                          json={'job': {'state': 'Completed'}},
                          request=httpx.Request('GET', url),
                      )
                  if '/download/' in url:
                      return httpx.Response(
                          200,
                          content=placeholder,
                          headers={
                              'content-type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                              'content-disposition': 'attachment; filename="bloom.xlsx"',
                          },
                          request=httpx.Request('GET', url),
                      )
                  raise AssertionError(url)

          fallback = (
              recognized,
              'attachment; filename="solyan-ocr-tables.xlsx"',
              'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
              {
                  'x-solyan-ocr-engine': 'PP-StructureV3',
                  'x-solyan-ocr-pages': '3',
                  'x-solyan-ocr-table-workbooks': '4',
              },
          )

          with (
              patch('app.bloom_proxy.httpx.Client', FakeBloomClient),
              patch('app.bloom_proxy.detect_pdf_print_setup', return_value=None),
              patch('app.bloom_proxy._try_ocr_xlsx', return_value=fallback) as ocr_fallback,
          ):
              response = TestClient(app).post(
                  '/experimental/pdf-to-office',
                  files={'file': ('scan.pdf', b'%PDF-1.7\nscan', 'application/pdf')},
                  data={'target': 'xlsx'},
              )

          assert response.status_code == 200, response.text
          assert response.content == recognized
          assert response.headers['content-disposition'] == 'attachment; filename="solyan-ocr-tables.xlsx"'
          assert response.headers['x-solyan-conversion-engine'] == 'PP-StructureV3-fallback'
          assert response.headers['x-solyan-ocr-engine'] == 'PP-StructureV3'
          assert response.headers['x-solyan-ocr-pages'] == '3'
          assert response.headers['x-solyan-ocr-table-workbooks'] == '4'
          ocr_fallback.assert_called_once_with(b'%PDF-1.7\nscan', 'scan.pdf')
          print('bloom no-table xlsx -> PP-Structure fallback ok')
          PY

      - name: Verify XLSX source-aware print normalization
        run: |
          python - <<'PY'
          import io
          import zipfile
          from app.xlsx_print import _match_paper_size, apply_fit_to_width, detect_pdf_print_setup

          def make_xlsx(sheet_xml: str) -> bytes:
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as archive:
                  archive.writestr('xl/worksheets/sheet1.xml', sheet_xml)
                  archive.writestr('[Content_Types].xml', '<Types/>')
              return buf.getvalue()

          def sheet(data: bytes) -> str:
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  return archive.read('xl/worksheets/sheet1.xml').decode()

          # Standard-paper mapping is orientation independent and custom sizes
          # are deliberately not normalized.
          assert _match_paper_size(595.28, 841.89) == 9
          assert _match_paper_size(841.89, 595.28) == 9
          assert _match_paper_size(612, 792) == 1
          assert _match_paper_size(612, 1008) == 5
          assert _match_paper_size(500, 700) is None
          assert detect_pdf_print_setup(b'not-a-pdf') is None

          bare_xml = (
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
              '<sheetViews><sheetView workbookViewId="0"/></sheetViews>'
              '<sheetData><row r="1"/></sheetData>'
              '</worksheet>'
          )
          bare = make_xlsx(bare_xml)
          patched = apply_fit_to_width(bare, 9, 'portrait')
          patched_xml = sheet(patched)
          assert patched != bare
          assert '<pageSetUpPr fitToPage="1"/>' in patched_xml, patched_xml
          assert '<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/>' in patched_xml, patched_xml
          assert apply_fit_to_width(patched, 9, 'portrait') == patched

          landscape = apply_fit_to_width(bare, 9, 'landscape')
          assert 'paperSize="9" orientation="landscape"' in sheet(landscape)

          existing_xml = bare_xml.replace(
              '</worksheet>',
              '<pageSetup paperSize="1" orientation="landscape" fitToWidth="2"/></worksheet>',
          )
          existing = make_xlsx(existing_xml)
          assert apply_fit_to_width(existing, 9, 'portrait') == existing
          assert apply_fit_to_width(b'not-a-zip', 9, 'portrait') == b'not-a-zip'
          assert apply_fit_to_width(bare, 0, 'portrait') == bare
          assert apply_fit_to_width(bare, 9, 'diagonal') == bare
          print('xlsx source-aware print normalization ok')
          PY

      - name: Verify hardened network utility routes
        run: |
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)

          # Proxy headers are ignored by default.
          ip = client.get('/net/ip', headers={'x-forwarded-for': '8.8.8.8'}).json()
          assert ip['ip'] != '8.8.8.8', ip

          # Private network probing is blocked by default.
          blocked = client.post('/net/ping', json={'host': '127.0.0.1'})
          assert blocked.status_code == 403, blocked.text

          # Self-hosted administrators can explicitly enable private diagnostics.
          os.environ['ALLOW_PRIVATE_NETWORK_UTILITIES'] = '1'
          allowed = client.post('/net/ping', json={'host': '127.0.0.1'})
          assert allowed.status_code == 200 and allowed.json()['reachable'] is True, allowed.text

          # Trusted reverse proxies can explicitly enable forwarded IP reporting.
          os.environ['TRUST_PROXY_HEADERS'] = '1'
          forwarded = client.get('/net/ip', headers={'x-forwarded-for': '8.8.8.8'}).json()
          assert forwarded['ip'] == '8.8.8.8', forwarded
          print('hardened network routes ok')
          PY
