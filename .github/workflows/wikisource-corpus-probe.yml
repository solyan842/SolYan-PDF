name: Wikisource OCR corpus probe

on:
  push:
    branches:
      - benchmark/vietnamese-real-ocr-60-wikisource
    paths:
      - '.github/workflows/wikisource-corpus-probe.yml'
      - 'benchmarks/fetch_vietnamese_ocr_wikisource.py'
      - 'benchmarks/corpora/vietnamese_real_wikisource_v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install rendering dependencies
        run: pip install pypdfium2==5.14.0 Pillow

      - name: Fetch one locked real-scan page from each source
        run: |
          set -euo pipefail
          python benchmarks/fetch_vietnamese_ocr_wikisource.py \
            --output /tmp/vn-ocr-wikisource \
            --limit-per-source 1

      - name: Validate generated corpus and attribution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/vn-ocr-wikisource')
          records = [json.loads(line) for line in (root / 'corpus.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(records) == 2, records
          assert {r['source_id'] for r in records} == {'nam_hai_di_nhan', 'viet_nam_phong_tuc'}
          assert all(r['page_quality'] >= 3 for r in records)
          assert all(len(r['expected']) >= 100 for r in records)
          assert all((root / r['file']).read_bytes()[:8] == b'\x89PNG\r\n\x1a\n' for r in records)
          attribution = json.loads((root / 'ATTRIBUTION.json').read_text(encoding='utf-8'))
          assert attribution['transcription_license'] == 'CC BY-SA 4.0'
          assert len(attribution['sources']) == 2
          print('samples=', len(records))
          print('expected_lengths=', [len(r['expected']) for r in records])
          print('source_ids=', [r['source_id'] for r in records])
          PY
