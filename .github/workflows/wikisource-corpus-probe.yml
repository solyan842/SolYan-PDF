name: Wikisource OCR corpus probe

on:
  push:
    branches:
      - benchmark/vietnamese-real-ocr-60-wikisource
    paths:
      - '.github/workflows/wikisource-corpus-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory proofread Wikisource pages and Commons scan
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = 'https://vi.wikisource.org/w/api.php'
          PREFIX = 'Trang:Nam Hai di nhan liet truyen.pdf/'
          pages = []
          for start in (5, 35):
              nums = list(range(start, min(start + 30, 65)))
              titles = '|'.join(f'{PREFIX}{n}' for n in nums)
              query = urllib.parse.urlencode({
                  'action': 'query',
                  'format': 'json',
                  'formatversion': '2',
                  'prop': 'revisions',
                  'rvprop': 'ids|timestamp|content',
                  'rvslots': 'main',
                  'titles': titles,
              })
              request = urllib.request.Request(f'{API}?{query}', headers={'User-Agent': 'SolYan-PDF OCR benchmark/0.1.2'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              for page in payload['query']['pages']:
                  revision = page['revisions'][0]
                  content = revision['slots']['main']['content']
                  number = int(page['title'].rsplit('/', 1)[1])
                  quality = re.search(r'<pagequality\s+level="(\d+)"', content)
                  pages.append({
                      'page': number,
                      'title': page['title'],
                      'revid': revision['revid'],
                      'timestamp': revision['timestamp'],
                      'quality': int(quality.group(1)) if quality else 0,
                      'content_chars': len(content),
                  })

          pages.sort(key=lambda item: item['page'])
          assert [item['page'] for item in pages] == list(range(5, 65)), pages
          assert all(item['quality'] >= 3 for item in pages), [item for item in pages if item['quality'] < 3]
          assert all(item['content_chars'] >= 150 for item in pages), [item for item in pages if item['content_chars'] < 150]
          manifest = {
              'schema_version': 1,
              'source': 'Vietnamese Wikisource ProofreadPage + Wikimedia Commons',
              'work': 'Nam Hải dị nhân liệt truyện',
              'file': 'Nam Hai di nhan liet truyen.pdf',
              'commons_url': 'https://commons.wikimedia.org/wiki/File:Nam_Hai_di_nhan_liet_truyen.pdf',
              'wikisource_index': 'Mục lục:Nam Hai di nhan liet truyen.pdf',
              'scan_license': 'Public Domain',
              'transcription_license': 'CC BY-SA (Vietnamese Wikisource site content)',
              'pages': pages,
          }
          Path('/tmp/wikisource-pages.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('PAGES', len(pages))
          print('QUALITY_COUNTS', {q: sum(item['quality'] == q for item in pages) for q in sorted({item['quality'] for item in pages})})
          print('REVISION_RANGE', pages[0]['revid'], pages[-1]['revid'])
          print(json.dumps(pages[:2] + pages[-2:], ensure_ascii=False, indent=2))
          PY

          curl --fail --location --silent --show-error \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Nam_Hai_di_nhan_liet_truyen.pdf' \
            -o /tmp/source.pdf
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/source.pdf')
          assert p.read_bytes()[:5] == b'%PDF-'
          assert p.stat().st_size > 1_000_000
          print('PDF_BYTES', p.stat().st_size)
          PY

      - name: Upload locked page inventory
        uses: actions/upload-artifact@v4
        with:
          name: wikisource-real-ocr-page-inventory
          path: /tmp/wikisource-pages.json
          retention-days: 7
