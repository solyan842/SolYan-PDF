name: PDF Permissions CI

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'frontend/app/protect/**'
      - '.github/workflows/pdf-permissions-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/main.py'
      - 'frontend/app/protect/**'
      - '.github/workflows/pdf-permissions-ci.yml'

jobs:
  permissions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install qpdf 11-compatible engine
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          qpdf --version
          qpdf --help=--print
          qpdf --help=--modify
          qpdf --help=--extract

      - name: Install hash-verified backend dependencies
        run: |
          python -m pip install --require-hashes -r requirements.hashed.lock
          python -m pip install --no-deps -r requirements.txt
          python -m pip check

      - name: Compile backend
        run: python -m compileall app

      - name: Verify AES-256 permissions and backward compatibility
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)

          def encryption_info(path: Path, password: str) -> str:
              result = subprocess.run(
                  ['qpdf', f'--password={password}', '--show-encryption', str(path)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout

          with tempfile.TemporaryDirectory(prefix='solyan-permissions-ci-') as temp_dir:
              temp = Path(temp_dir)
              base = temp / 'base.pdf'
              subprocess.run(['qpdf', '--empty', str(base)], check=True)
              source = base.read_bytes()

              restricted = client.post(
                  '/pdf/protect',
                  files={'file': ('base.pdf', source, 'application/pdf')},
                  data={
                      'password': 'open-pass',
                      'print_mode': 'none',
                      'modify_mode': 'none',
                      'allow_extract': 'false',
                  },
              )
              assert restricted.status_code == 200, restricted.text
              restricted_path = temp / 'restricted.pdf'
              restricted_path.write_bytes(restricted.content)
              subprocess.run(['qpdf', '--password=open-pass', '--check', str(restricted_path)], check=True)
              info = encryption_info(restricted_path, 'open-pass')
              assert 'Supplied password is user password' in info, info
              assert 'Supplied password is owner password' not in info, info
              assert 'stream encryption method: AESv3' in info, info
              assert 'extract for any purpose: not allowed' in info, info
              assert 'print low resolution: not allowed' in info, info
              assert 'print high resolution: not allowed' in info, info
              assert 'modify document assembly: not allowed' in info, info
              assert 'modify forms: not allowed' in info, info
              assert 'modify annotations: not allowed' in info, info
              assert 'modify other: not allowed' in info, info
              assert 'modify anything: not allowed' in info, info

              # User password must still decrypt even when the owner password was
              # generated randomly by the backend.
              unlocked = client.post(
                  '/pdf/unlock',
                  files={'file': ('restricted.pdf', restricted.content, 'application/pdf')},
                  data={'password': 'open-pass'},
              )
              assert unlocked.status_code == 200, unlocked.text
              unlocked_path = temp / 'unlocked.pdf'
              unlocked_path.write_bytes(unlocked.content)
              subprocess.run(['qpdf', '--check', str(unlocked_path)], check=True)
              assert 'File is not encrypted' in encryption_info(unlocked_path, ''), encryption_info(unlocked_path, '')

              # Existing clients that only send password retain permissive defaults.
              legacy = client.post(
                  '/pdf/protect',
                  files={'file': ('base.pdf', source, 'application/pdf')},
                  data={'password': 'legacy-pass'},
              )
              assert legacy.status_code == 200, legacy.text
              legacy_path = temp / 'legacy.pdf'
              legacy_path.write_bytes(legacy.content)
              legacy_info = encryption_info(legacy_path, 'legacy-pass')
              assert 'Supplied password is user password' in legacy_info, legacy_info
              assert 'extract for any purpose: allowed' in legacy_info, legacy_info
              assert 'print high resolution: allowed' in legacy_info, legacy_info
              assert 'modify anything: allowed' in legacy_info, legacy_info

              intermediate = client.post(
                  '/pdf/protect',
                  files={'file': ('base.pdf', source, 'application/pdf')},
                  data={
                      'password': 'reader-pass',
                      'owner_password': 'owner-pass',
                      'print_mode': 'low',
                      'modify_mode': 'form',
                      'allow_extract': 'true',
                  },
              )
              assert intermediate.status_code == 200, intermediate.text
              intermediate_path = temp / 'intermediate.pdf'
              intermediate_path.write_bytes(intermediate.content)
              intermediate_info = encryption_info(intermediate_path, 'reader-pass')
              assert 'print low resolution: allowed' in intermediate_info, intermediate_info
              assert 'print high resolution: not allowed' in intermediate_info, intermediate_info
              assert 'extract for any purpose: allowed' in intermediate_info, intermediate_info
              assert 'modify document assembly: allowed' in intermediate_info, intermediate_info
              assert 'modify forms: allowed' in intermediate_info, intermediate_info
              assert 'modify annotations: not allowed' in intermediate_info, intermediate_info
              assert 'modify other: not allowed' in intermediate_info, intermediate_info
              assert 'modify anything: not allowed' in intermediate_info, intermediate_info

              owner_info = encryption_info(intermediate_path, 'owner-pass')
              assert 'Supplied password is owner password' in owner_info, owner_info

              bad_print = client.post(
                  '/pdf/protect',
                  files={'file': ('base.pdf', source, 'application/pdf')},
                  data={'password': 'x', 'print_mode': 'weird'},
              )
              assert bad_print.status_code == 422, bad_print.text

              bad_modify = client.post(
                  '/pdf/protect',
                  files={'file': ('base.pdf', source, 'application/pdf')},
                  data={'password': 'x', 'modify_mode': 'weird'},
              )
              assert bad_modify.status_code == 422, bad_modify.text

          print('qpdf AES-256 permissions and random-owner behavior ok')
          PY
