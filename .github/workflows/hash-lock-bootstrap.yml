name: Hash Lock Bootstrap

on:
  push:
    branches:
      - build/hash-python-locks
    paths:
      - 'scripts/hash-python-locks.sh'
      - '.github/workflows/hash-lock-bootstrap.yml'
      - 'backend/requirements.lock'
      - 'engines/office-service/requirements.lock'
      - 'engines/sign-service/requirements.lock'
      - 'engines/archive-service/requirements.lock'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Generate hash locks
        run: bash ./scripts/hash-python-locks.sh

      - name: Commit generated hash locks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/requirements.hashed.lock \
            engines/office-service/requirements.hashed.lock \
            engines/sign-service/requirements.hashed.lock \
            engines/archive-service/requirements.hashed.lock
          if git diff --cached --quiet; then
            echo 'Hash locks already match generated output.'
          else
            git commit -m 'build: add hash-verified Python locks'
            git push origin HEAD:build/hash-python-locks
          fi

      - name: Bundle hash locks
        run: |
          tar -czf /tmp/python-hash-locks.tar.gz \
            backend/requirements.hashed.lock \
            engines/office-service/requirements.hashed.lock \
            engines/sign-service/requirements.hashed.lock \
            engines/archive-service/requirements.hashed.lock

      - name: Upload hash locks
        uses: actions/upload-artifact@v4
        with:
          name: python-hash-locks
          path: /tmp/python-hash-locks.tar.gz
          retention-days: 7
          if-no-files-found: error
