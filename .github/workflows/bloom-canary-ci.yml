name: Bloom PDF-to-Office Canary CI

on:
  pull_request:
    paths:
      - 'backend/app/bloom_proxy.py'
      - 'backend/app/office_proxy.py'
      - 'backend/Dockerfile'
      - 'engines/office-service/**'
      - 'benchmarks/**'
      - 'docs/PDF-TO-OFFICE-EXPERIMENTAL.md'
      - '.github/workflows/bloom-canary-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/bloom_proxy.py'
      - 'backend/app/office_proxy.py'
      - 'backend/Dockerfile'
      - 'engines/office-service/**'
      - 'benchmarks/**'
      - 'docs/PDF-TO-OFFICE-EXPERIMENTAL.md'
      - '.github/workflows/bloom-canary-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BLOOM_REPO: https://github.com/stemlen/bloom-pdf-editor.git
  BLOOM_COMMIT: 9ed16c43e356cffd4bd3b004b0dab19e582a59d5

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install benchmark dependencies
        run: pip install -r benchmarks/requirements.txt

      - name: Fetch pinned Bloom source
        run: |
          git clone --filter=blob:none --no-checkout "$BLOOM_REPO" /tmp/bloom
          git -C /tmp/bloom fetch --depth=1 origin "$BLOOM_COMMIT"
          git -C /tmp/bloom checkout --detach "$BLOOM_COMMIT"
          test "$(git -C /tmp/bloom rev-parse HEAD)" = "$BLOOM_COMMIT"
          grep -q 'Apache License' /tmp/bloom/LICENSE
          grep -q 'BLOOM_STORAGE_ROOT' /tmp/bloom/server/src/utils/config.ts

      - name: Build Bloom, Office and backend images
        run: |
          docker build -t solyan-bloom-canary /tmp/bloom/server
          docker build -t solyan-office-canary engines/office-service
          docker build -t solyan-backend-canary backend

      - name: Start isolated canary stack
        run: |
          docker network create solyan-bloom-canary
          docker run -d --name bloom --network solyan-bloom-canary \
            -e BLOOM_STORAGE_ROOT=/tmp/bloom-storage \
            solyan-bloom-canary
          docker run -d --name office --network solyan-bloom-canary solyan-office-canary
          docker run -d --name backend --network solyan-bloom-canary -p 8000:8000 \
            -e BLOOM_SERVICE_URL=http://bloom:8787 \
            -e OFFICE_SERVICE_URL=http://office:8020 \
            solyan-backend-canary

      - name: Wait for backend, Office and Bloom health
        run: |
          python - <<'PY'
          import time
          import urllib.request

          urls = [
              'http://127.0.0.1:8000/health',
              'http://127.0.0.1:8000/experimental/bloom/health',
          ]
          deadline = time.monotonic() + 180
          pending = set(urls)
          while pending and time.monotonic() < deadline:
              for url in list(pending):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if 200 <= response.status < 300:
                              print(url, response.read().decode('utf-8', 'replace'))
                              pending.remove(url)
                  except Exception as exc:
                      print('waiting', url, type(exc).__name__, exc)
              if pending:
                  time.sleep(3)
          if pending:
              raise SystemExit(f'Health checks timed out: {sorted(pending)}')
          PY

      - name: Generate controlled corpus and canary manifest
        run: |
          python benchmarks/generate_pdf_to_office_corpus.py \
            --manifest benchmarks/corpora/pdf_to_office_synthetic_v1.json \
            --output-dir /tmp/pdf-to-office-corpus
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('benchmarks/corpora/pdf_to_office_synthetic_v1.json').read_text())
          wanted = {'docx-table', 'xlsx-financial', 'pptx-chart'}
          cases = [case for case in source['cases'] if case['id'] in wanted]
          assert {case['id'] for case in cases} == wanted
          payload = {
              'version': source['version'] + '-canary',
              'description': 'One deterministic canary case per PDF-to-Office target.',
              'limitations': source['limitations'],
              'cases': cases,
          }
          Path('/tmp/pdf-to-office-canary.json').write_text(json.dumps(payload, indent=2))
          PY

      - name: Run end-to-end PDF-to-Office canary
        run: |
          PYTHONPATH=benchmarks python benchmarks/run_pdf_to_office_corpus.py \
            --manifest /tmp/pdf-to-office-canary.json \
            --corpus-dir /tmp/pdf-to-office-corpus \
            --api http://127.0.0.1:8000 \
            --output /tmp/pdf-to-office-canary-report.json

      - name: Validate canary report structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/pdf-to-office-canary-report.json').read_text())
          assert report['summary']['cases'] == 3
          assert set(report['summary']['targets']) == {'docx', 'xlsx', 'pptx'}
          assert not report['failures']
          for item in report['results']:
              assert item['office_bytes'] > 0, item
              assert item['roundtrip_pdf_bytes'] > 0, item
              assert item['source_pages'] >= 1, item
              assert item['roundtrip_pages'] >= 1, item
          print(json.dumps(report['summary'], indent=2))
          PY

      - name: Upload canary benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-office-bloom-canary
          path: /tmp/pdf-to-office-canary-report.json
          retention-days: 30

      - name: Collect container logs on failure
        if: failure()
        run: |
          for name in bloom office backend; do
            echo "===== $name ====="
            docker logs "$name" || true
          done

      - name: Stop canary stack
        if: always()
        run: |
          docker rm -f backend office bloom 2>/dev/null || true
          docker network rm solyan-bloom-canary 2>/dev/null || true
