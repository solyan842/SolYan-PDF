name: OCR Service CI

on:
  pull_request:
    paths:
      - 'engines/ocr-service/**'
      - 'benchmarks/fetch_vietnamese_ocr_real.py'
      - '.github/workflows/ocr-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'engines/ocr-service/**'
      - 'benchmarks/fetch_vietnamese_ocr_real.py'
      - '.github/workflows/ocr-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/ocr-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Tesseract system fallback
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng fonts-dejavu-core

      - name: Install lightweight API and fallback dependencies
        run: pip install fastapi==0.119.0 uvicorn==0.37.0 python-multipart==0.0.20 httpx==0.28.1 pytesseract==0.3.13 pypdfium2==5.14.0 Pillow openpyxl==3.1.5

      - name: Compile service and benchmark harness
        run: python -m compileall app benchmark.py ../../benchmarks/fetch_vietnamese_ocr_real.py

      - name: Guard cross-workbook XLSX merge and source-page print layout
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Alignment, Font, PatternFill

          from app.main import _merge_xlsx_files

          with TemporaryDirectory(prefix='solyan-xlsx-style-regression-') as tmp:
              root = Path(tmp)
              source = root / 'source.xlsx'
              source_two = root / 'source-two.xlsx'

              wb = Workbook()
              ws = wb.active
              ws.title = 'Styled source'
              alignments = ['left', 'right', 'center', 'justify', 'fill']
              for row, horizontal in enumerate(alignments, start=1):
                  cell = ws.cell(row=row, column=1, value=f'value-{row}')
                  cell.font = Font(name=f'SolYanFont{row}', bold=(row % 2 == 0), size=10 + row)
                  cell.fill = PatternFill(fill_type='solid', fgColor=f'{row:02X}{row:02X}{row:02X}')
                  cell.alignment = Alignment(horizontal=horizontal)
                  cell.number_format = '0.00'
              ws.column_dimensions['A'].width = 24
              ws.row_dimensions[3].height = 31
              wb.save(source)
              wb.close()

              wb = Workbook()
              ws = wb.active
              ws.title = 'Second table'
              ws['A1'] = 'second-table'
              ws['B2'] = 'merged-value'
              ws.merge_cells('B2:D2')
              ws.column_dimensions['A'].width = 31
              wb.save(source_two)
              wb.close()

              merged_bytes = _merge_xlsx_files(
                  [(1, source), (1, source_two)],
                  page_sizes={1: (1400.0, 1000.0)},
              )
              merged = root / 'merged.xlsx'
              merged.write_bytes(merged_bytes)

              check = load_workbook(merged, data_only=False)
              try:
                  assert len(check.worksheets) == 1
                  out = check.worksheets[0]
                  assert out.title == 'Page 1'
                  assert out['A5'].value == 'value-5'
                  assert out['A5'].alignment.horizontal == 'fill'
                  assert out['A4'].font.bold is True
                  assert out['A1'].number_format == '0.00'
                  assert out.column_dimensions['A'].width == 31
                  assert out.row_dimensions[3].height == 31
                  assert out['A8'].value == 'second-table'
                  assert out['B9'].value == 'merged-value'
                  assert 'B9:D9' in {str(item) for item in out.merged_cells.ranges}
                  assert out.page_setup.orientation == 'landscape'
                  assert out.page_setup.fitToWidth == 1
                  assert out.page_setup.fitToHeight == 1
                  assert out.sheet_properties.pageSetUpPr.fitToPage is True
                  assert out.page_setup.paperWidth == '14.0000in'
                  assert out.page_setup.paperHeight == '10.0000in'
                  assert str(out.print_area) == "'Page 1'!$A$1:$D$9"
              finally:
                  check.close()

          print('cross-workbook XLSX grouping/style/print-layout regression: PASS')
          PY

      - name: Verify health without loading Paddle models
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          response = client.get('/health')
          assert response.status_code == 200
          body = response.json()
          assert body['status'] == 'ok'
          assert body['models_loaded'] == {'ocr': False, 'structure': False}
          assert body['fallback']['enabled'] is True
          assert body['fallback']['binary_available'] is True
          print(body)
          PY

      - name: Smoke test Vietnamese Tesseract fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from app.main import _tesseract_text

          image = Image.new('RGB', (900, 180), 'white')
          draw = ImageDraw.Draw(image)
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 52)
          draw.text((30, 50), 'Xin chào Việt Nam 2026', font=font, fill='black')
          path = Path('fallback-test.png')
          image.save(path)
          text, pages = _tesseract_text(path, '.png')
          assert pages and text.strip(), (text, pages)
          print(text)
          PY

      - name: Fetch pinned public-domain Vietnamese real-scan corpus
        run: python ../../benchmarks/fetch_vietnamese_ocr_real.py --output /tmp/vn-ocr-real

      - name: Benchmark real Vietnamese scans with fallback path
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fastapi.testclient import TestClient
          from app.main import app
          from benchmark import score

          root = Path('/tmp/vn-ocr-real')
          records = [json.loads(line) for line in (root / 'corpus.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(records) == 9, f'Expected 9 pinned real samples, got {len(records)}'

          client = TestClient(app)
          results = []
          for record in records:
              path = root / record['file']
              with path.open('rb') as handle:
                  response = client.post('/ocr/text', files={'file': (path.name, handle, 'image/png')})
              assert response.status_code == 200, (record['doc_id'], response.text)
              payload = response.json()
              assert payload.get('engine') == 'Tesseract'
              assert payload.get('fallback_used') is True
              cer, wer = score(record['expected'], payload.get('text', ''))
              results.append({'doc_id': record['doc_id'], 'cer': cer, 'wer': wer})
              print(record['doc_id'], 'CER=', round(cer, 4), 'WER=', round(wer, 4))

          avg_cer = sum(item['cer'] for item in results) / len(results)
          avg_wer = sum(item['wer'] for item in results) / len(results)
          summary = {'samples': len(results), 'average_cer': avg_cer, 'average_wer': avg_wer, 'results': results}
          Path('/tmp/vn-ocr-real-baseline.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          assert avg_cer < 0.40, avg_cer
          assert avg_wer < 0.70, avg_wer
          PY

      - name: Validate locked production dependency graph
        run: |
          test -s requirements.lock
          test -s requirements.hashed.lock
          test -s paddle-requirements.lock
          grep -q '^paddlepaddle==3.2.0$' paddle-requirements.lock
          grep -q '^--index-url https://www.paddlepaddle.org.cn/packages/stable/cpu/$' paddle-requirements.lock
          grep -q '^paddleocr==3.7.0$' requirements.lock
          grep -q '^pypdfium2==5.14.0$' requirements.lock
          grep -q -- '--hash=sha256:' requirements.hashed.lock
          grep -q 'pip==26.2.1' Dockerfile
          grep -q 'paddle-requirements.lock' Dockerfile
          grep -q -- '--require-hashes --no-deps -r requirements.hashed.lock' Dockerfile
          grep -q 'pip check' Dockerfile
          grep -q 'tesseract-ocr-vie' Dockerfile
