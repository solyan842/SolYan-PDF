name: Prepare v0.1.9 Lockfile

on:
  push:
    branches:
      - release/v0.1.9-20261016
    paths:
      - '.github/workflows/prepare-v0.1.9-lock.yml'

permissions:
  contents: write

jobs:
  normalize-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.9-20261016

      - name: Normalize package-lock JSON without dependency resolution
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'frontend/package-lock.json';
          const parsed = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (parsed.version !== '0.1.9' || parsed.packages?.['']?.version !== '0.1.9') {
            throw new Error('Expected both root lockfile versions to be 0.1.9');
          }
          fs.writeFileSync(path, JSON.stringify(parsed, null, 2) + '\n');
          NODE

      - name: Commit normalized lockfile if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'Lockfile already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'release: normalize v0.1.9 frontend lockfile'
          git push origin HEAD:release/v0.1.9-20261016
