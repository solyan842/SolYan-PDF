name: Generate frontend npm lockfile

on:
  push:
    branches:
      - chore/npm-lockfile
    paths:
      - '.github/workflows/generate-npm-lock.yml'
      - 'frontend/package.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/npm-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Generate package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package lock when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'build: lock frontend npm dependency graph'
          git push origin HEAD:chore/npm-lockfile
