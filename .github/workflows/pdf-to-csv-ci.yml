name: PDF to CSV CI

on:
  pull_request:
    paths:
      - 'backend/app/pdf_to_csv.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-csv/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-csv-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/pdf_to_csv.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-csv/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-csv-ci.yml'

jobs:
  pdf-to-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r backend/requirements.hashed.lock
          python -m pip install --no-deps -r backend/requirements.txt
          python -m pip check

      - name: Compile backend CSV adapter
        run: python -m compileall backend/app

      - name: Gate XLSX to CSV conversion semantics
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/solyan-pdf-to-csv
          python <<'PY' 2>&1 | tee /tmp/solyan-pdf-to-csv/gate.log
          import csv
          import io
          import zipfile

          from app.pdf_to_csv import _xlsx_to_csv_outputs

          CONTENT_TYPES = '''<?xml version="1.0" encoding="UTF-8"?>
          <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
            <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
            <Default Extension="xml" ContentType="application/xml"/>
            <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
            <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
            <Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
            <Override PartName="/xl/worksheets/sheet3.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
            <Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>
          </Types>'''
          WORKBOOK = '''<?xml version="1.0" encoding="UTF-8"?>
          <workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
            <sheets>
              <sheet name="Page 1" sheetId="1" r:id="rId1"/>
              <sheet name="Raster Only" sheetId="2" r:id="rId2"/>
              <sheet name="Page 3" sheetId="3" r:id="rId3"/>
            </sheets>
          </workbook>'''
          RELS = '''<?xml version="1.0" encoding="UTF-8"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
            <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
            <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>
            <Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet3.xml"/>
          </Relationships>'''
          SHARED = '''<?xml version="1.0" encoding="UTF-8"?>
          <sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="6" uniqueCount="6">
            <si><t>Tên</t></si><si><t>Giá</t></si><si><t>Cáp đồng</t></si>
            <si><t>=2+2</t></si><si><t>Hà Nội</t></si><si><t>@cmd</t></si>
          </sst>'''
          SHEET1 = '''<?xml version="1.0" encoding="UTF-8"?>
          <worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>
            <row r="1"><c r="A1" t="s"><v>0</v></c><c r="B1" t="s"><v>1</v></c></row>
            <row r="2"><c r="A2" t="s"><v>2</v></c><c r="B2"><v>-123</v></c></row>
            <row r="3"><c r="A3" t="s"><v>3</v></c><c r="B3"><v>42.5</v></c></row>
          </sheetData></worksheet>'''
          SHEET2 = '''<?xml version="1.0" encoding="UTF-8"?>
          <worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData><row r="1"/></sheetData></worksheet>'''
          SHEET3 = '''<?xml version="1.0" encoding="UTF-8"?>
          <worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>
            <row r="1"><c r="A1" t="s"><v>4</v></c><c r="B1" t="s"><v>5</v></c></row>
          </sheetData></worksheet>'''

          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, 'w', zipfile.ZIP_DEFLATED) as zf:
              zf.writestr('[Content_Types].xml', CONTENT_TYPES)
              zf.writestr('xl/workbook.xml', WORKBOOK)
              zf.writestr('xl/_rels/workbook.xml.rels', RELS)
              zf.writestr('xl/sharedStrings.xml', SHARED)
              zf.writestr('xl/worksheets/sheet1.xml', SHEET1)
              zf.writestr('xl/worksheets/sheet2.xml', SHEET2)
              zf.writestr('xl/worksheets/sheet3.xml', SHEET3)
          workbook = buffer.getvalue()
          open('/tmp/solyan-pdf-to-csv/fixture.xlsx', 'wb').write(workbook)

          outputs = _xlsx_to_csv_outputs(workbook, 'bao-cao')
          assert [name for name, _ in outputs] == ['bao-cao_Page-1.csv', 'bao-cao_Page-3.csv'], outputs
          assert all(content.startswith(b'\xef\xbb\xbf') for _, content in outputs)

          first = outputs[0][1].decode('utf-8-sig')
          rows = list(csv.reader(io.StringIO(first)))
          assert rows[0] == ['Tên', 'Giá'], rows
          assert rows[1] == ['Cáp đồng', '-123'], rows
          assert rows[2] == ["'=2+2", '42.5'], rows
          assert '"-123"' in first, first

          third = outputs[1][1].decode('utf-8-sig')
          rows3 = list(csv.reader(io.StringIO(third)))
          assert rows3 == [['Hà Nội', "'@cmd"]], rows3
          print('XLSX -> CSV semantic gate: PASS')
          PY

      - name: Gate public CSV route and ZIP behavior
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python <<'PY' 2>&1 | tee -a /tmp/solyan-pdf-to-csv/gate.log
          import io
          import zipfile
          from unittest.mock import patch

          import httpx
          from fastapi.testclient import TestClient
          from app.main import app

          fixture = open('/tmp/solyan-pdf-to-csv/fixture.xlsx', 'rb').read()

          class FakeClient:
              def __init__(self, *args, **kwargs):
                  pass
              def __enter__(self):
                  return self
              def __exit__(self, *args):
                  return False
              def post(self, url, files=None, data=None):
                  assert url.endswith('/ocr/xlsx'), url
                  assert files['file'][1].startswith(b'%PDF-')
                  return httpx.Response(200, content=fixture, headers={'x-solyan-ocr-engine': 'PP-StructureV3'})

          client = TestClient(app)
          with patch('app.pdf_to_csv.httpx.Client', FakeClient):
              response = client.post('/pdf/to-csv', files={'file': ('Báo cáo 2026.pdf', b'%PDF-1.7\nfixture', 'application/pdf')})
          assert response.status_code == 200, response.text
          assert response.headers['content-type'].startswith('application/zip'), response.headers
          assert response.headers['x-solyan-csv-engine'] == 'PP-StructureV3'
          assert response.headers['x-solyan-csv-files'] == '2'
          with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
              names = archive.namelist()
              assert names == ['B-o-c-o-2026_Page-1.csv', 'B-o-c-o-2026_Page-3.csv'], names
              assert archive.read(names[0]).startswith(b'\xef\xbb\xbf')

          bad = client.post('/pdf/to-csv', files={'file': ('x.txt', b'hello', 'text/plain')})
          assert bad.status_code == 400, bad.text
          print('public PDF -> CSV ZIP adapter: PASS')
          PY

      - name: Gate single CSV and upstream error propagation
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python <<'PY' 2>&1 | tee -a /tmp/solyan-pdf-to-csv/gate.log
          import io
          import zipfile
          from unittest.mock import patch

          import httpx
          from fastapi.testclient import TestClient
          from app.main import app

          full = open('/tmp/solyan-pdf-to-csv/fixture.xlsx', 'rb').read()
          src = zipfile.ZipFile(io.BytesIO(full))
          workbook_xml = src.read('xl/workbook.xml').decode().replace(
              '<sheet name="Raster Only" sheetId="2" r:id="rId2"/>\n              <sheet name="Page 3" sheetId="3" r:id="rId3"/>', ''
          )
          single_buffer = io.BytesIO()
          with zipfile.ZipFile(single_buffer, 'w', zipfile.ZIP_DEFLATED) as dst:
              for info in src.infolist():
                  if info.filename == 'xl/workbook.xml':
                      dst.writestr(info.filename, workbook_xml)
                  else:
                      dst.writestr(info, src.read(info.filename))
          src.close()
          single = single_buffer.getvalue()

          class SingleClient:
              def __init__(self, *args, **kwargs): pass
              def __enter__(self): return self
              def __exit__(self, *args): return False
              def post(self, *args, **kwargs):
                  return httpx.Response(200, content=single, headers={'x-solyan-ocr-engine': 'PP-StructureV3'})

          class EmptyClient:
              def __init__(self, *args, **kwargs): pass
              def __enter__(self): return self
              def __exit__(self, *args): return False
              def post(self, *args, **kwargs):
                  return httpx.Response(422, json={'detail': 'PP-StructureV3 found no exportable tables'})

          client = TestClient(app)
          with patch('app.pdf_to_csv.httpx.Client', SingleClient):
              response = client.post('/pdf/to-csv', files={'file': ('one.pdf', b'%PDF-1.7\nfixture', 'application/pdf')})
          assert response.status_code == 200, response.text
          assert response.headers['content-type'].startswith('text/csv')
          assert response.headers['x-solyan-csv-files'] == '1'
          assert response.content.startswith(b'\xef\xbb\xbf')

          with patch('app.pdf_to_csv.httpx.Client', EmptyClient):
              empty = client.post('/pdf/to-csv', files={'file': ('empty.pdf', b'%PDF-1.7\nfixture', 'application/pdf')})
          assert empty.status_code == 422, empty.text
          assert 'no exportable tables' in empty.json()['detail']
          print('single CSV + upstream 422 propagation: PASS')
          PY

      - name: Gate product wiring and documented boundaries
        run: |
          set -euo pipefail
          grep -q 'from .pdf_to_csv import router as pdf_to_csv_router' backend/app/main.py
          grep -q 'app.include_router(pdf_to_csv_router)' backend/app/main.py
          grep -q 'X-SolYan-CSV-Engine' backend/app/main.py
          grep -q '/pdf/to-csv' frontend/app/pdf-to-csv/page.tsx
          grep -q "href: '/pdf-to-csv'" frontend/app/page.tsx
          grep -q 'cùng một trang được xếp nối tiếp' frontend/app/pdf-to-csv/page.tsx
          grep -q 'formula injection' frontend/app/pdf-to-csv/page.tsx
          echo 'CSV route/UI/safety boundary wiring: PASS' | tee -a /tmp/solyan-pdf-to-csv/gate.log

      - name: Upload PDF to CSV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-csv-evidence
          path: |
            /tmp/solyan-pdf-to-csv/gate.log
            /tmp/solyan-pdf-to-csv/fixture.xlsx
          if-no-files-found: warn
          retention-days: 14
