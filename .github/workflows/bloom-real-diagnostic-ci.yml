name: Bloom Real-World PDF-to-Office Diagnostic

on:
  push:
    branches:
      - benchmark/pdf-office-real-diagnostic-v1
      - fix/bloom-inherited-page-geometry
    paths:
      - 'backend/app/bloom_proxy.py'
      - 'backend/app/xlsx_print.py'
      - 'engines/office-service/**'
      - 'benchmarks/**'
      - 'patches/bloom/**'
      - '.github/workflows/bloom-real-diagnostic-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 0'

permissions:
  contents: read

env:
  BLOOM_REPO: https://github.com/stemlen/bloom-pdf-editor.git
  BLOOM_COMMIT: 9ed16c43e356cffd4bd3b004b0dab19e582a59d5
  BLOOM_PATCH: patches/bloom/table-cluster-group-bottom.patch
  BLOOM_REGRESSION_TEST: patches/bloom/solyan-table-cluster-regression.test.ts
  REAL_MANIFEST: benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json

jobs:
  materialize-corpus:
    name: corpus / ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case_id:
          - docx-google-doc
          - docx-multicolumn
          - docx-libreoffice-images
          - xlsx-table-material
          - xlsx-unidentified-table
          - xlsx-transport-table
          - pptx-commons-copyright
          - pptx-what-is-cc
          - pptx-copyright-laws
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install corpus verification dependencies
        run: pip install pypdf==6.1.1 cryptography==46.0.3

      - name: Fetch, verify and materialize one pinned document
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/real-case-stage"
          mkdir -p "$stage/corpus" "$stage/inventory"
          python benchmarks/fetch_pdf_to_office_real_corpus.py \
            --manifest "$REAL_MANIFEST" \
            --case-id "${{ matrix.case_id }}" \
            --output-dir "$stage/corpus" \
            --output-inventory "$stage/inventory/${{ matrix.case_id }}.json"

      - name: Upload verified document artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-office-real-case-${{ matrix.case_id }}
          path: ${{ runner.temp }}/real-case-stage/
          if-no-files-found: error
          retention-days: 7

  diagnostic:
    name: Bloom real-world diagnostic
    needs: materialize-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install benchmark dependencies
        run: pip install -r benchmarks/requirements.txt

      - name: Download verified corpus artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-to-office-real-case-*
          path: /tmp/pdf-to-office-real-stage
          merge-multiple: true

      - name: Assemble and verify corpus artifact set
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from pypdf import PdfReader

          root = Path('/tmp/pdf-to-office-real-stage')
          corpus_dir = root / 'corpus'
          inventory_dir = root / 'inventory'
          manifest = json.loads(Path('benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json').read_text())
          expected_ids = [case['id'] for case in manifest['cases']]
          expected_filenames = {case['id']: case['filename'] for case in manifest['cases']}

          inventories = []
          for path in sorted(inventory_dir.glob('*.json')):
              payload = json.loads(path.read_text())
              assert payload['manifest_version'] == manifest['version'], payload
              assert payload['corpus_kind'] == manifest['corpus_kind'], payload
              assert len(payload['cases']) == 1, payload
              inventories.append(payload['cases'][0])

          assert len(inventories) == 9, [item['id'] for item in inventories]
          by_id = {item['id']: item for item in inventories}
          assert set(by_id) == set(expected_ids), (sorted(by_id), sorted(expected_ids))
          assert len(by_id) == len(inventories), 'duplicate corpus case id'
          assert sum(int(item['output_pages']) for item in inventories) == 50, inventories

          for case_id in expected_ids:
              item = by_id[case_id]
              pdf_path = corpus_dir / expected_filenames[case_id]
              assert pdf_path.is_file(), pdf_path
              data = pdf_path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == item['output_sha256'], item
              assert len(PdfReader(pdf_path).pages) == int(item['output_pages']), item

          combined = {
              'manifest_version': manifest['version'],
              'corpus_kind': manifest['corpus_kind'],
              'cases': [by_id[case_id] for case_id in expected_ids],
          }
          Path('/tmp/pdf-to-office-real-inventory.json').write_text(
              json.dumps(combined, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'cases': len(inventories),
              'pages': sum(int(item['output_pages']) for item in inventories),
              'ids': expected_ids,
          }, indent=2))
          PY

      - name: Setup Node matching Bloom image
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned Bloom source and apply SolYan table patch
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$BLOOM_REPO" /tmp/bloom
          git -C /tmp/bloom fetch --depth=1 origin "$BLOOM_COMMIT"
          git -C /tmp/bloom checkout --detach "$BLOOM_COMMIT"
          test "$(git -C /tmp/bloom rev-parse HEAD)" = "$BLOOM_COMMIT"
          grep -q 'Apache License' /tmp/bloom/LICENSE
          git -C /tmp/bloom apply --check "$GITHUB_WORKSPACE/$BLOOM_PATCH"
          git -C /tmp/bloom apply "$GITHUB_WORKSPACE/$BLOOM_PATCH"
          cp "$GITHUB_WORKSPACE/$BLOOM_REGRESSION_TEST" /tmp/bloom/server/src/tests/solyan-table-cluster-regression.test.ts
          grep -q 'currentBottom' /tmp/bloom/server/src/engines/table/candidates.ts

      - name: Typecheck Bloom and run SolYan regression
        working-directory: /tmp/bloom/server
        run: |
          npm ci
          npm run typecheck
          npx vitest run src/tests/solyan-table-cluster-regression.test.ts

      - name: Build pinned patched Bloom, Office and backend images
        run: |
          docker build -t solyan-bloom-real /tmp/bloom/server
          docker build -t solyan-office-real engines/office-service
          docker build -t solyan-backend-real backend

      - name: Start isolated diagnostic stack
        run: |
          docker network create solyan-bloom-real
          docker run -d --name bloom-real --network solyan-bloom-real \
            -e BLOOM_STORAGE_ROOT=/tmp/bloom-storage \
            solyan-bloom-real
          docker run -d --name office-real --network solyan-bloom-real solyan-office-real
          docker run -d --name backend-real --network solyan-bloom-real -p 8000:8000 \
            -e BLOOM_SERVICE_URL=http://bloom-real:8787 \
            -e OFFICE_SERVICE_URL=http://office-real:8020 \
            solyan-backend-real

      - name: Wait for backend and Bloom health
        run: |
          python - <<'PY'
          import time
          import urllib.request

          urls = {
              'backend': 'http://127.0.0.1:8000/health',
              'bloom': 'http://127.0.0.1:8000/experimental/bloom/health',
          }
          deadline = time.monotonic() + 180
          pending = dict(urls)
          while pending and time.monotonic() < deadline:
              for name, url in list(pending.items()):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if 200 <= response.status < 300:
                              print(name, response.read().decode('utf-8', 'replace'))
                              pending.pop(name)
                  except Exception as exc:
                      print('waiting', name, type(exc).__name__, exc)
              if pending:
                  time.sleep(3)
          if pending:
              raise SystemExit(f'Health checks timed out: {sorted(pending)}')
          PY

      - name: Run real-world diagnostic benchmark with preserved log
        run: |
          set +e
          set -o pipefail
          PYTHONPATH=benchmarks python benchmarks/run_pdf_to_office_corpus.py \
            --manifest "$REAL_MANIFEST" \
            --corpus-dir /tmp/pdf-to-office-real-stage/corpus \
            --api http://127.0.0.1:8000 \
            --output /tmp/pdf-to-office-real-report.json \
            2>&1 | tee /tmp/pdf-to-office-real-benchmark.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/pdf-to-office-real-benchmark.exit
          echo "benchmark_exit_code=$status"
          exit 0

      - name: Upload benchmark execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-office-real-benchmark-execution
          path: |
            /tmp/pdf-to-office-real-benchmark.log
            /tmp/pdf-to-office-real-benchmark.exit
            /tmp/pdf-to-office-real-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce benchmark process result
        run: |
          set -euo pipefail
          status="$(cat /tmp/pdf-to-office-real-benchmark.exit)"
          if [ "$status" -ne 0 ]; then
            echo "Benchmark process failed with exit code $status"
            echo "===== benchmark tail ====="
            tail -n 200 /tmp/pdf-to-office-real-benchmark.log || true
            exit "$status"
          fi

      - name: Validate diagnostic report shape
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          inventory = json.loads(Path('/tmp/pdf-to-office-real-inventory.json').read_text())
          report = json.loads(Path('/tmp/pdf-to-office-real-report.json').read_text())
          results = report['results']
          summary = report['summary']

          assert inventory['corpus_kind'] == 'public-real-world-diagnostic', inventory
          assert report['corpus_kind'] == 'public-real-world-diagnostic', report
          assert report['release_gate'] is False, report
          assert report['thresholds'] == {}, report
          assert report['failures'] == [], report
          assert summary['cases'] == 9, summary
          assert Counter(item['target'] for item in results) == {'docx': 3, 'xlsx': 3, 'pptx': 3}
          assert len({item['id'] for item in results}) == 9
          assert sum(item['output_pages'] for item in inventory['cases']) == 50

          for item in results:
              assert item['office_bytes'] > 0, item
              assert item['roundtrip_pdf_bytes'] > 0, item
              assert item['source_pages'] >= 1, item
              assert item['roundtrip_pages'] >= 1, item
              assert 0.0 <= item['average_similarity'] <= 100.0, item

          # Deliberately do not assert similarity, page-count or geometry thresholds here.
          # This workflow establishes a measured real-world baseline; release gates remain
          # a separate product decision after the corpus is representative enough.
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload real-world diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-office-real-diagnostic-v1
          path: |
            /tmp/pdf-to-office-real-inventory.json
            /tmp/pdf-to-office-real-report.json
          retention-days: 30

      - name: Collect container logs on failure
        if: failure()
        run: |
          for name in bloom-real office-real backend-real; do
            echo "===== $name ====="
            docker logs "$name" || true
          done

      - name: Stop diagnostic stack
        if: always()
        run: |
          docker rm -f backend-real office-real bloom-real 2>/dev/null || true
          docker network rm solyan-bloom-real 2>/dev/null || true
