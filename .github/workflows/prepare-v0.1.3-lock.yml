name: Prepare v0.1.3 lock metadata

on:
  push:
    branches:
      - release/v0.1.3
    paths:
      - '.github/workflows/prepare-v0.1.3-lock.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.3

      - name: Synchronize npm release metadata
        working-directory: frontend
        run: npm version 0.1.3 --no-git-tag-version --allow-same-version

      - name: Commit synchronized package lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Version metadata already synchronized."
            exit 0
          fi
          git commit -m "release: synchronize v0.1.3 package lock"
          git push origin HEAD:release/v0.1.3
