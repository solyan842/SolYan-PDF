name: PDF to RTF CI

on:
  pull_request:
    paths:
      - 'engines/office-service/app/main.py'
      - 'backend/app/pdf_to_rtf.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-rtf/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-rtf-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'engines/office-service/app/main.py'
      - 'backend/app/pdf_to_rtf.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-rtf/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-rtf-ci.yml'

jobs:
  pdf-to-rtf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install LibreOffice and Python dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu-core fonts-liberation
          libreoffice --version | tee /tmp/libreoffice-version.log
          python -m pip install --require-hashes -r engines/office-service/requirements.hashed.lock
          python -m pip install --no-deps -r engines/office-service/requirements.txt
          python -m pip install --no-deps -r backend/requirements.txt
          python -m pip install httpx==0.28.1 python-docx==1.2.0
          python -m pip check

      - name: Compile service and backend
        run: python -m compileall engines/office-service/app backend/app

      - name: Gate real LibreOffice PDF to RTF and text recovery
        working-directory: engines/office-service
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/solyan-pdf-to-rtf
          python <<'PY' 2>&1 | tee /tmp/solyan-pdf-to-rtf/gate.log
          import io
          from pathlib import Path

          from docx import Document
          from fastapi.testclient import TestClient
          from app.main import app

          root = Path('/tmp/solyan-pdf-to-rtf')
          docx = io.BytesIO()
          document = Document()
          document.add_heading('SolYan RTF CI', 1)
          document.add_paragraph('Editable PDF import through LibreOffice Writer.')
          document.save(docx)

          client = TestClient(app)
          pdf = client.post(
              '/convert/to-pdf',
              files={'file': ('source.docx', docx.getvalue(), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document')},
          )
          assert pdf.status_code == 200, pdf.text
          assert pdf.content.startswith(b'%PDF-')
          root.joinpath('source.pdf').write_bytes(pdf.content)

          rtf = client.post(
              '/convert/pdf-to-office',
              files={'file': ('source.pdf', pdf.content, 'application/pdf')},
              data={'target': 'rtf'},
          )
          assert rtf.status_code == 200, rtf.text
          assert rtf.headers['content-type'].startswith('application/rtf'), rtf.headers
          assert rtf.headers['x-solyan-conversion-engine'] == 'LibreOffice-PDF-import'
          assert rtf.content.lstrip().startswith(b'{\\rtf'), rtf.content[:32]
          assert len(rtf.content) > 100
          root.joinpath('source.rtf').write_bytes(rtf.content)
          print('real LibreOffice PDF -> RTF: PASS', len(rtf.content))
          PY

          mkdir -p /tmp/solyan-pdf-to-rtf/txt /tmp/solyan-pdf-to-rtf/profile
          libreoffice --headless --nologo --nodefault --nofirststartwizard \
            -env:UserInstallation=file:///tmp/solyan-pdf-to-rtf/profile \
            --convert-to 'txt:Text' \
            --outdir /tmp/solyan-pdf-to-rtf/txt \
            /tmp/solyan-pdf-to-rtf/source.rtf \
            2>&1 | tee -a /tmp/solyan-pdf-to-rtf/gate.log
          test -s /tmp/solyan-pdf-to-rtf/txt/source.txt
          grep -q 'SolYan RTF CI' /tmp/solyan-pdf-to-rtf/txt/source.txt
          grep -q 'Editable PDF import' /tmp/solyan-pdf-to-rtf/txt/source.txt
          echo 'RTF round-trip text recovery: PASS' | tee -a /tmp/solyan-pdf-to-rtf/gate.log

      - name: Gate production backend RTF adapter
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python <<'PY' 2>&1 | tee -a /tmp/solyan-pdf-to-rtf/gate.log
          from unittest.mock import patch

          import httpx
          from fastapi.testclient import TestClient
          from app.main import app

          class FakeClient:
              def __init__(self, *args, **kwargs):
                  pass
              def __enter__(self):
                  return self
              def __exit__(self, *args):
                  return False
              def post(self, url, files=None, data=None):
                  assert url.endswith('/convert/pdf-to-office'), url
                  assert data == {'target': 'rtf'}, data
                  assert files['file'][1].startswith(b'%PDF-')
                  return httpx.Response(
                      200,
                      content=b'{\\rtf1\\ansi SolYan proxy}',
                      headers={'x-solyan-conversion-engine': 'LibreOffice-PDF-import'},
                  )

          client = TestClient(app)
          with patch('app.pdf_to_rtf.httpx.Client', FakeClient):
              response = client.post(
                  '/pdf/to-rtf',
                  files={'file': ('source.pdf', b'%PDF-1.7\n%fixture', 'application/pdf')},
              )
          assert response.status_code == 200, response.text
          assert response.content.startswith(b'{\\rtf1')
          assert response.headers['content-type'].startswith('application/rtf')
          assert response.headers['content-disposition'] == 'attachment; filename="solyan-pdf.rtf"'
          assert response.headers['x-solyan-rtf-engine'] == 'LibreOffice-PDF-import'

          non_pdf = client.post('/pdf/to-rtf', files={'file': ('x.txt', b'hello', 'text/plain')})
          assert non_pdf.status_code == 400, non_pdf.text
          print('production backend RTF adapter: PASS')
          PY

      - name: Gate product wiring and semantic boundary
        run: |
          set -euo pipefail
          grep -q 'PDF_IMPORT_TARGETS = {"docx", "pptx", "rtf"}' engines/office-service/app/main.py
          grep -q 'infilter="writer_pdf_import"' engines/office-service/app/main.py
          grep -q 'rtf:Rich Text Format' engines/office-service/app/main.py
          grep -q 'from .pdf_to_rtf import router as pdf_to_rtf_router' backend/app/main.py
          grep -q 'app.include_router(pdf_to_rtf_router)' backend/app/main.py
          grep -q '/pdf/to-rtf' frontend/app/pdf-to-rtf/page.tsx
          grep -q "href: '/pdf-to-rtf'" frontend/app/page.tsx
          grep -q 'có thể không được bảo toàn hoàn toàn' frontend/app/pdf-to-rtf/page.tsx
          echo 'RTF reuse/UI/semantic boundary wiring: PASS' | tee -a /tmp/solyan-pdf-to-rtf/gate.log

      - name: Upload PDF to RTF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-rtf-evidence
          path: |
            /tmp/solyan-pdf-to-rtf/gate.log
            /tmp/solyan-pdf-to-rtf/source.pdf
            /tmp/solyan-pdf-to-rtf/source.rtf
            /tmp/solyan-pdf-to-rtf/txt/source.txt
            /tmp/libreoffice-version.log
          if-no-files-found: warn
          retention-days: 14
