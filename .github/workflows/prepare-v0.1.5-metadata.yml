name: Prepare v0.1.5 release metadata

on:
  push:
    branches:
      - release/v0.1.5-20261014
    paths:
      - '.github/workflows/prepare-v0.1.5-metadata.yml'

permissions:
  contents: write

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.5-20261014

      - name: Synchronize release metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          backend = Path('backend/app/main.py')
          text = backend.read_text()
          old = 'FastAPI(title="SolYan PDF API", version="0.1.4")'
          new = 'FastAPI(title="SolYan PDF API", version="0.1.5")'
          if old in text:
              backend.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('unexpected backend version state')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '## [Unreleased]\n\n### V1.2 self-contained parity expansion'
          replacement = '## [Unreleased]\n\n## [0.1.5] - 2026-10-14\n\nPatch release completing the **V1.2 self-contained parity expansion and security hardening** roadmap.\n\n### V1.2 self-contained parity expansion'
          if marker in text:
              changelog.write_text(text.replace(marker, replacement, 1))
          elif '## [0.1.5] - 2026-10-14' not in text:
              raise SystemExit('unexpected changelog state')

          manifest = Path('docs/RELEASE-MANIFEST.md')
          text = manifest.read_text()
          if '# SolYan PDF v0.1.4 — Release Dependency Manifest' in text:
              text = text.replace('# SolYan PDF v0.1.4 — Release Dependency Manifest', '# SolYan PDF v0.1.5 — Release Dependency Manifest', 1)
          elif '# SolYan PDF v0.1.5 — Release Dependency Manifest' not in text:
              raise SystemExit('unexpected manifest version state')
          if 'Release date: 2026-10-13' in text:
              text = text.replace('Release date: 2026-10-13', 'Release date: 2026-10-14', 1)
          elif 'Release date: 2026-10-14' not in text:
              raise SystemExit('unexpected manifest date state')
          manifest.write_text(text)
          PY

      - name: Commit synchronized release metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py CHANGELOG.md docs/RELEASE-MANIFEST.md
          if git diff --cached --quiet; then
            echo "Release metadata already synchronized."
            exit 0
          fi
          git commit -m "release: synchronize v0.1.5 metadata"
          git push origin HEAD:release/v0.1.5-20261014
