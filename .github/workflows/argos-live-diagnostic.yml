name: Argos Live Translation Diagnostic

on:
  push:
    branches:
      - test/v1.6-argos-live-diagnostic-20261016
    paths:
      - 'scripts/generate_translation_fixture.py'
      - '.github/workflows/argos-live-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PDF2ZH_UPSTREAM_COMMIT: d16604dabb5c3f4c6d4daf37197b218b0dbd4df2
  ARGOS_MODEL_URL: https://data.argosopentech.com/argospm/v1/translate-en_vi-1_9.argosmodel
  ARGOS_MODEL_SHA256: DISCOVER

jobs:
  argos-live-en-vi:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout SolYan diagnostic branch
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Fetch pinned PDFMathTranslate upstream
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/PDFMathTranslate/PDFMathTranslate.git /tmp/pdf2zh-upstream
          git -C /tmp/pdf2zh-upstream checkout --detach "$PDF2ZH_UPSTREAM_COMMIT"
          test "$(git -C /tmp/pdf2zh-upstream rev-parse HEAD)" = "$PDF2ZH_UPSTREAM_COMMIT"

      - name: Install pinned upstream with Argos extra
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install '/tmp/pdf2zh-upstream[argostranslate]'
          python -m pip check
          pdf2zh --version

      - name: Download EN to VI Argos model and record checksum
        run: |
          set -euo pipefail
          mkdir -p /tmp/solyan-argos-live
          curl --fail --location --retry 3 --retry-delay 2 \
            "$ARGOS_MODEL_URL" \
            --output /tmp/solyan-argos-live/translate-en_vi-1_9.argosmodel
          actual="$(sha256sum /tmp/solyan-argos-live/translate-en_vi-1_9.argosmodel | awk '{print $1}')"
          echo "ARGOS_MODEL_ACTUAL_SHA256=$actual" | tee /tmp/solyan-argos-live/model-sha256.txt
          if [ "$ARGOS_MODEL_SHA256" = 'DISCOVER' ]; then
            echo 'Checksum discovery run: translation is intentionally skipped until the observed hash is pinned.'
            exit 0
          fi
          test "$actual" = "$ARGOS_MODEL_SHA256"

      - name: Install pinned Argos model
        if: env.ARGOS_MODEL_SHA256 != 'DISCOVER'
        run: |
          set -euo pipefail
          python - <<'PY'
          import argostranslate.package
          path = '/tmp/solyan-argos-live/translate-en_vi-1_9.argosmodel'
          argostranslate.package.install_from_path(path)
          packages = argostranslate.package.get_installed_packages()
          assert any(p.from_code == 'en' and p.to_code == 'vi' for p in packages), packages
          print('Argos EN->VI model install: PASS')
          PY

      - name: Generate deterministic English PDF fixture
        if: env.ARGOS_MODEL_SHA256 != 'DISCOVER'
        run: |
          set -euo pipefail
          python scripts/generate_translation_fixture.py /tmp/solyan-argos-live/source.pdf
          pdfinfo /tmp/solyan-argos-live/source.pdf | tee /tmp/solyan-argos-live/source-pdfinfo.txt
          pdftotext -layout /tmp/solyan-argos-live/source.pdf /tmp/solyan-argos-live/source.txt
          grep -q 'Privacy and local processing are important.' /tmp/solyan-argos-live/source.txt

      - name: Translate English PDF to Vietnamese with real Argos
        if: env.ARGOS_MODEL_SHA256 != 'DISCOVER'
        run: |
          set -euo pipefail
          mkdir -p /tmp/solyan-argos-live/output
          pdf2zh \
            --ultrafast \
            --lang-in en \
            --lang-out vi \
            --service argos \
            --thread 2 \
            --output /tmp/solyan-argos-live/output \
            /tmp/solyan-argos-live/source.pdf \
            2>&1 | tee /tmp/solyan-argos-live/translation.log
          find /tmp/solyan-argos-live/output -maxdepth 1 -type f -printf '%f\n' | sort | tee /tmp/solyan-argos-live/output-files.txt

      - name: Validate translated and bilingual PDF outputs
        if: env.ARGOS_MODEL_SHA256 != 'DISCOVER'
        run: |
          set -euo pipefail
          mono="$(find /tmp/solyan-argos-live/output -maxdepth 1 -type f -name '*-mono.pdf' -print -quit)"
          dual="$(find /tmp/solyan-argos-live/output -maxdepth 1 -type f -name '*-dual.pdf' -print -quit)"
          test -n "$mono"
          test -n "$dual"
          pdfinfo "$mono" | tee /tmp/solyan-argos-live/mono-pdfinfo.txt
          pdfinfo "$dual" | tee /tmp/solyan-argos-live/dual-pdfinfo.txt
          pdftotext -layout "$mono" /tmp/solyan-argos-live/mono.txt
          pdftotext -layout "$dual" /tmp/solyan-argos-live/dual.txt
          python - <<'PY'
          from pathlib import Path
          import unicodedata

          mono = unicodedata.normalize('NFC', Path('/tmp/solyan-argos-live/mono.txt').read_text('utf-8', errors='replace')).lower()
          dual = unicodedata.normalize('NFC', Path('/tmp/solyan-argos-live/dual.txt').read_text('utf-8', errors='replace')).lower()
          source_sentence = 'privacy and local processing are important.'
          vietnamese_markers = ('dịch', 'tiếng việt', 'tài liệu', 'quyền riêng tư', 'xử lý', 'trang', 'bố cục')
          hits = sorted({marker for marker in vietnamese_markers if marker in mono})
          if len(hits) < 2:
              raise SystemExit(f'Expected at least two Vietnamese markers, got {hits!r}. Text: {mono[:2000]!r}')
          if source_sentence in mono:
              raise SystemExit('Mono output still contains the exact English privacy sentence')
          if source_sentence not in dual:
              raise SystemExit('Dual output does not retain the original English source sentence')
          print('Argos live EN->VI PDF validation: PASS')
          print('Vietnamese markers:', ', '.join(hits))
          PY

      - name: Write diagnostic summary
        if: env.ARGOS_MODEL_SHA256 != 'DISCOVER'
        run: |
          set -euo pipefail
          {
            echo "upstream_commit=$PDF2ZH_UPSTREAM_COMMIT"
            echo "model_url=$ARGOS_MODEL_URL"
            echo "model_sha256=$ARGOS_MODEL_SHA256"
            echo 'pair=en->vi'
            echo 'provider=argos'
            echo 'mode=ultrafast'
            echo 'result=PASS'
          } | tee /tmp/solyan-argos-live/summary.txt

      - name: Upload live diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argos-live-en-vi-evidence
          path: /tmp/solyan-argos-live
          if-no-files-found: warn
          retention-days: 14
