name: V1.7 Roadmap Checkpoint

on:
  push:
    branches:
      - feat/v1.7-cloud-storage
    paths:
      - '.github/workflows/v1.7-roadmap-checkpoint.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1.7-cloud-storage

      - name: Record V1.7 implementation checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roadmap_path = Path('docs/ROADMAP.md')
          roadmap = roadmap_path.read_text()

          old = '- [ ] Cloud-storage connectors — requires provider/credential decision'
          new = '- [x] Cloud-storage connectors — Google Drive + OneDrive V1.7 provider-neutral lane implemented; operator OAuth credentials remain optional deployment configuration'
          assert old in roadmap
          roadmap = roadmap.replace(old, new, 1)

          marker = '''V1.6 translation is complete and released as v0.1.9 for the validated free/local English -> Vietnamese lane. Cloud providers remain optional operator configuration, not V1.6 release prerequisites. Detailed architecture, licensing/privacy boundaries and live evidence are in `docs/V1.6-PDF-TRANSLATION.md` and `docs/V1.6-CLOSEOUT.md`.

## Tiện ích Việt Nam — V1'''
          replacement = '''V1.6 translation is complete and released as v0.1.9 for the validated free/local English -> Vietnamese lane. Cloud providers remain optional operator configuration, not V1.6 release prerequisites. Detailed architecture, licensing/privacy boundaries and live evidence are in `docs/V1.6-PDF-TRANSLATION.md` and `docs/V1.6-CLOSEOUT.md`.

## V1.7 — Cloud Storage Connectors

- [x] Add provider-neutral cloud storage contract without coupling providers to PDF engines
- [x] Add Google Drive OAuth with PKCE, server-side token storage and least-privilege `drive.file` scope
- [x] Add OneDrive OAuth with PKCE, Microsoft Graph `Files.ReadWrite` + `offline_access`
- [x] Add bounded PDF-only browse/download/upload/explicit-replace operations
- [x] Add Google resumable upload and OneDrive `createUploadSession` support
- [x] Keep refresh tokens/client secrets out of browser storage and sanitize provider error bodies
- [x] Add Cloud Storage workspace with provider status, folder navigation, download, upload, replace confirmation and logout
- [x] Add optional Google Picker token hook without widening the default Drive permission scope
- [x] Pass deterministic no-real-credential Google Drive + OneDrive contract/frontend CI gate
- [x] Preserve S3-compatible/WebDAV as later adapters behind the same provider contract

V1.7 Cloud Storage implementation is feature-complete for the Google Drive + OneDrive connector lane on PR #130. The current server-side token vault is intentionally restart-ephemeral for the repository's single-worker backend; multi-replica deployment requires a shared encrypted session store. Real provider OAuth credentials remain operator-owned deployment inputs, not build/CI prerequisites. Detailed architecture and boundaries are in `docs/V1.7-CLOUD-STORAGE.md`.

## Tiện ích Việt Nam — V1'''
          assert marker in roadmap
          roadmap = roadmap.replace(marker, replacement, 1)

          old_gate = '- [x] Full-stack translation service integration gate with isolated runtimes and real bilingual PDF validation'
          new_gate = old_gate + '\n- [x] Cloud Storage provider contract/privacy/frontend gate with deterministic Google Drive + OneDrive mock OAuth and file-flow validation'
          assert old_gate in roadmap
          roadmap = roadmap.replace(old_gate, new_gate, 1)

          old_decision = '- [ ] Choose cloud-storage providers and provide credentials if connectors are wanted'
          new_decision = '- [x] Choose cloud-storage providers: Google Drive + OneDrive first; operator OAuth app credentials are only required to enable live provider access in deployment'
          assert old_decision in roadmap
          roadmap = roadmap.replace(old_decision, new_decision, 1)

          roadmap_path.write_text(roadmap)

          architecture_path = Path('docs/V1.7-CLOUD-STORAGE.md')
          architecture = architecture_path.read_text()
          old_status = 'Status: architecture lock before implementation.'
          new_status = 'Status: implementation complete on PR #130; awaiting merge.'
          assert old_status in architecture
          architecture_path.write_text(architecture.replace(old_status, new_status, 1))
          PY

      - name: Remove one-shot checkpoint workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/v1.7-roadmap-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/V1.7-CLOUD-STORAGE.md .github/workflows/v1.7-roadmap-checkpoint.yml
          git diff --cached --check
          git commit -m 'docs: record V1.7 cloud storage checkpoint'
          git push origin HEAD:feat/v1.7-cloud-storage
