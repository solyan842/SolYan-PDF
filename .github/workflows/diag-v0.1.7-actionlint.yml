name: Diagnose v0.1.7 workflow

on:
  push:
    branches:
      - release/v0.1.7-20261015
    paths:
      - '.github/workflows/diag-v0.1.7-actionlint.yml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.7-20261015

      - name: Lint prepare workflow
        id: lint
        shell: bash
        run: |
          set +e
          set -o pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/prepare-v0.1.7-20261015.yml 2>&1 | tee actionlint.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.1.7-actionlint-log
          path: actionlint.log
          if-no-files-found: error

      - name: Preserve lint result
        if: always()
        shell: bash
        run: |
          test "${{ steps.lint.outputs.exit_code }}" = "0"
