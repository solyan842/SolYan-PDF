name: Overlay and Single Page CI

on:
  pull_request:
    paths:
      - 'frontend/lib/n-up.ts'
      - 'frontend/lib/overlay.ts'
      - 'frontend/lib/single-page.ts'
      - 'frontend/app/overlay/**'
      - 'frontend/app/single-page/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/overlay-single-page-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/lib/n-up.ts'
      - 'frontend/lib/overlay.ts'
      - 'frontend/lib/single-page.ts'
      - 'frontend/app/overlay/**'
      - 'frontend/app/single-page/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/overlay-single-page-ci.yml'

jobs:
  overlay-single-page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          qpdf --version
          pdfinfo -v

      - name: Compile overlay and single-page helpers
        run: |
          rm -rf .tmp-v12-layout
          npx tsc lib/n-up.ts lib/overlay.ts lib/single-page.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --noEmit false \
            --outDir .tmp-v12-layout

      - name: Verify real overlay and single-page PDFs
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { PDFDocument, StandardFonts, degrees } = require('pdf-lib');
          const { createOverlayPdf } = require('./.tmp-v12-layout/overlay.js');
          const { createSinglePagePdf, planSinglePage } = require('./.tmp-v12-layout/single-page.js');

          const oversizedPlan = planSinglePage(
            Array.from({ length: 40 }, () => ({ width: 1000, height: 1000, rotation: 0 })),
            { gap: 12, margin: 20 },
          );
          assert.ok(oversizedPlan.scale < 1, 'very tall source must scale down');
          assert.ok(oversizedPlan.width <= 14400.01);
          assert.ok(oversizedPlan.height <= 14400.01);
          assert.equal(oversizedPlan.placements.length, 40);

          (async () => {
            const base = await PDFDocument.create();
            const baseFont = await base.embedFont(StandardFonts.Helvetica);
            for (let i = 0; i < 3; i += 1) {
              const page = base.addPage([300, 200]);
              page.drawText(`BASE PAGE ${i + 1}`, { x: 20, y: 30, size: 14, font: baseFont });
            }

            const overlay = await PDFDocument.create();
            const overlayFont = await overlay.embedFont(StandardFonts.HelveticaBold);
            const overlay1 = overlay.addPage([180, 80]);
            overlay1.setRotation(degrees(90));
            overlay1.drawText('OVERLAY ONE', { x: 12, y: 25, size: 12, font: overlayFont });
            const overlay2 = overlay.addPage([160, 100]);
            overlay2.drawText('OVERLAY TWO', { x: 12, y: 30, size: 12, font: overlayFont });

            const baseBytes = await base.save();
            const overlayBytes = await overlay.save();
            const repeatBytes = await createOverlayPdf(baseBytes, overlayBytes, { mode: 'repeat-first', opacity: 0.75, margin: 10 });
            fs.writeFileSync('/tmp/solyan-overlay-repeat.pdf', Buffer.from(repeatBytes));
            const repeat = await PDFDocument.load(repeatBytes);
            assert.equal(repeat.getPageCount(), 3);
            repeat.getPages().forEach((page) => {
              const size = page.getSize();
              assert.equal(size.width, 300);
              assert.equal(size.height, 200);
            });

            const matchBytes = await createOverlayPdf(baseBytes, overlayBytes, { mode: 'match-pages', opacity: 1, margin: 0 });
            fs.writeFileSync('/tmp/solyan-overlay-match.pdf', Buffer.from(matchBytes));
            assert.equal((await PDFDocument.load(matchBytes)).getPageCount(), 3);

            const vertical = await PDFDocument.create();
            const verticalFont = await vertical.embedFont(StandardFonts.Helvetica);
            const sizes = [[240, 120], [180, 300], [200, 140]];
            for (let i = 0; i < sizes.length; i += 1) {
              const page = vertical.addPage(sizes[i]);
              if (i === 1) page.setRotation(degrees(90));
              page.drawText(`LONG PAGE ${i + 1}`, { x: 15, y: 35, size: 12, font: verticalFont });
            }
            const singleBytes = await createSinglePagePdf(await vertical.save(), { gap: 8, margin: 12 });
            fs.writeFileSync('/tmp/solyan-single-page.pdf', Buffer.from(singleBytes));
            const single = await PDFDocument.load(singleBytes);
            assert.equal(single.getPageCount(), 1);
            const singleSize = single.getPage(0).getSize();
            assert.ok(singleSize.width > 0 && singleSize.width <= 14400);
            assert.ok(singleSize.height > 0 && singleSize.height <= 14400);
            assert.ok(singleSize.height > singleSize.width, 'three pages should form a vertical strip');
            console.log('overlay and single-page generation ok');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

          qpdf --check /tmp/solyan-overlay-repeat.pdf
          qpdf --check /tmp/solyan-overlay-match.pdf
          qpdf --check /tmp/solyan-single-page.pdf
          test "$(pdfinfo /tmp/solyan-overlay-repeat.pdf | awk '/^Pages:/ {print $2}')" = "3"
          test "$(pdfinfo /tmp/solyan-single-page.pdf | awk '/^Pages:/ {print $2}')" = "1"

          for page in 1 2 3; do
            pdftotext -f "$page" -l "$page" /tmp/solyan-overlay-repeat.pdf "/tmp/repeat-${page}.txt"
            grep -q "BASE PAGE ${page}" "/tmp/repeat-${page}.txt"
            grep -q 'OVERLAY ONE' "/tmp/repeat-${page}.txt"
          done

          pdftotext -f 1 -l 1 /tmp/solyan-overlay-match.pdf /tmp/match-1.txt
          pdftotext -f 2 -l 2 /tmp/solyan-overlay-match.pdf /tmp/match-2.txt
          pdftotext -f 3 -l 3 /tmp/solyan-overlay-match.pdf /tmp/match-3.txt
          grep -q 'OVERLAY ONE' /tmp/match-1.txt
          grep -q 'OVERLAY TWO' /tmp/match-2.txt
          ! grep -q 'OVERLAY' /tmp/match-3.txt

          pdftotext /tmp/solyan-single-page.pdf /tmp/single-page.txt
          for page in 1 2 3; do grep -q "LONG PAGE ${page}" /tmp/single-page.txt; done

      - name: Remove temporary compiled helpers
        if: always()
        run: rm -rf .tmp-v12-layout
