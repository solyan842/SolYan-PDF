name: Remove Images CI

on:
  pull_request:
    paths:
      - 'backend/app/remove_images.py'
      - 'backend/app/main.py'
      - 'frontend/app/remove-images/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/remove-images-ci.yml'
      - 'README.md'
      - 'docs/ROADMAP.md'
  push:
    branches:
      - main
    paths:
      - 'backend/app/remove_images.py'
      - 'backend/app/main.py'
      - 'frontend/app/remove-images/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/remove-images-ci.yml'
      - 'README.md'
      - 'docs/ROADMAP.md'

jobs:
  remove-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install qpdf and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          qpdf --version
          qpdf --help=--json-output >/dev/null
          qpdf --help=--update-from-json >/dev/null
          pdfimages -v 2>&1 | head -n 1

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Build text + direct image + nested form-image fixture
        run: |
          cat >/tmp/remove-images.json <<'JSON'
          {
            "qpdf": [
              {"jsonversion": 2, "pdfversion": "1.7"},
              {
                "obj:1 0 R": {"value": {"/Type": "/Catalog", "/Pages": "2 0 R"}},
                "obj:2 0 R": {"value": {"/Type": "/Pages", "/Count": 1, "/Kids": ["3 0 R"], "/Resources": "4 0 R"}},
                "obj:3 0 R": {"value": {"/Type": "/Page", "/Parent": "2 0 R", "/MediaBox": [0, 0, 612, 792], "/Contents": "5 0 R"}},
                "obj:4 0 R": {"value": {"/Font": {"/F1": "6 0 R"}, "/XObject": "10 0 R"}},
                "obj:5 0 R": {"stream": {"dict": {}, "data": "QlQgL0YxIDE4IFRmIDcyIDcwMCBUZCAoS0VFUCBURVhUKSBUaiBFVApxIDEwMCAwIDAgMTAwIDcyIDUwMCBjbSAvSW0wIERvIFEKcSAxIDAgMCAxIDI1MCA1MDAgY20gL0ZtMCBEbyBRCg=="}},
                "obj:6 0 R": {"value": {"/Type": "/Font", "/Subtype": "/Type1", "/BaseFont": "/Helvetica"}},
                "obj:7 0 R": {"stream": {"dict": {"/Type": "/XObject", "/Subtype": "/Image", "/Width": 1, "/Height": 1, "/ColorSpace": "/DeviceRGB", "/BitsPerComponent": 8}, "data": "/wAA"}},
                "obj:8 0 R": {"stream": {"dict": {"/Type": "/XObject", "/Subtype": "/Form", "/BBox": [0, 0, 100, 100], "/Resources": {"/XObject": {"/Nested": "9 0 R"}}}, "data": "cSA1MCAwIDAgNTAgMCAwIGNtIC9OZXN0ZWQgRG8gUQo="}},
                "obj:9 0 R": {"stream": {"dict": {"/Type": "/XObject", "/Subtype": "/Image", "/Width": 1, "/Height": 1, "/ColorSpace": "/DeviceRGB", "/BitsPerComponent": 8}, "data": "AAD/"}},
                "obj:10 0 R": {"value": {"/Im0": "7 0 R", "/Fm0": "8 0 R"}},
                "trailer": {"value": {"/Root": "1 0 R", "/Size": 11}}
              }
            ]
          }
          JSON
          qpdf --json-input /tmp/remove-images.json /tmp/input.pdf
          qpdf --check /tmp/input.pdf
          test "$(pdfimages -list /tmp/input.pdf 2>/dev/null | awk 'NR>2 {count++} END {print count+0}')" -eq 2
          pdftotext /tmp/input.pdf /tmp/input.txt
          grep -q 'KEEP TEXT' /tmp/input.txt

      - name: Verify planner removes only Image XObject resource entries
        env:
          PYTHONPATH: backend
        run: |
          python <<'PY'
          from pathlib import Path
          from app.remove_images import _build_remove_images_update
          from app.sanitize import _qpdf_json

          data = _qpdf_json(Path('/tmp/input.pdf'), Path('/tmp/source.json'))
          update, removed = _build_remove_images_update(data)
          assert removed == 2, removed
          updates = update['qpdf'][1]

          root_xobjects = updates['obj:10 0 R']['value']
          assert '/Im0' not in root_xobjects, root_xobjects
          assert root_xobjects['/Fm0'] == '8 0 R', root_xobjects

          form_dict = updates['obj:8 0 R']['stream']['dict']
          assert form_dict['/Resources']['/XObject'] == {}, form_dict

          assert 'obj:5 0 R' not in updates, 'page content stream must remain byte-for-byte untouched'
          assert 'obj:6 0 R' not in updates, 'font resource must remain untouched'
          print('planner removed', removed, 'image resource entries')
          PY

      - name: Remove images and preserve text/vector content
        env:
          PYTHONPATH: backend
        run: |
          python <<'PY'
          from pathlib import Path
          from app.remove_images import _remove_images_pdf

          removed = _remove_images_pdf(Path('/tmp/input.pdf'), Path('/tmp/output.pdf'))
          assert removed == 2, removed
          removed_again = _remove_images_pdf(Path('/tmp/output.pdf'), Path('/tmp/output-second.pdf'))
          assert removed_again == 0, removed_again
          print('remove-images gate count:', removed, 'idempotent:', removed_again)
          PY

          qpdf --check /tmp/output.pdf
          qpdf --check /tmp/output-second.pdf
          test "$(pdfimages -list /tmp/output.pdf 2>/dev/null | awk 'NR>2 {count++} END {print count+0}')" -eq 0
          pdftotext /tmp/output.pdf /tmp/output.txt
          grep -q 'KEEP TEXT' /tmp/output.txt
          pdftoppm -f 1 -singlefile -png -r 36 /tmp/output.pdf /tmp/rendered >/tmp/render.log 2>&1
          test -s /tmp/rendered.png

      - name: Verify route registration
        env:
          PYTHONPATH: backend
        run: |
          python <<'PY'
          from app.main import app

          paths = {route.path for route in app.routes}
          assert '/pdf/remove-images' in paths
          print('remove-images route registered')
          PY
