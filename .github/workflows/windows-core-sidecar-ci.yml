name: Windows Core Sidecar CI

on:
  pull_request:
    paths:
      - "desktop/backend/**"
      - "desktop/vendor/qpdf-windows-x64.json"
      - "backend/app/**"
      - ".github/workflows/windows-core-sidecar-ci.yml"
  push:
    branches:
      - "feat/windows-desktop-v1"
    paths:
      - "desktop/backend/**"
      - "desktop/vendor/qpdf-windows-x64.json"
      - "backend/app/**"
      - ".github/workflows/windows-core-sidecar-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-core-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/backend/requirements-windows.txt

      - name: Prepare diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath artifacts/pip-bootstrap.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r desktop/backend/requirements-windows.txt 2>&1 | Tee-Object -FilePath artifacts/pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download pinned upstream qpdf
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content desktop/vendor/qpdf-windows-x64.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $manifest.url -OutFile qpdf.zip
          $actual = (Get-FileHash qpdf.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.sha256.ToLowerInvariant()) {
            throw "qpdf SHA256 mismatch: expected $($manifest.sha256), got $actual"
          }
          Expand-Archive qpdf.zip -DestinationPath desktop/vendor/qpdf-runtime -Force
          $qpdf = Get-ChildItem desktop/vendor/qpdf-runtime -Filter qpdf.exe -Recurse | Select-Object -First 1
          if (-not $qpdf) { throw "qpdf.exe not found in pinned upstream archive" }
          $qpdf.Directory.FullName | Set-Content artifacts/qpdf-bin-dir.txt
          & $qpdf.FullName --version 2>&1 | Tee-Object -FilePath artifacts/qpdf-version.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package existing FastAPI backend as Windows sidecar
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name solyan-core --paths . --collect-submodules backend.app desktop/backend/runner.py 2>&1 | Tee-Object -FilePath artifacts/pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/solyan-core.exe)) { throw "solyan-core.exe was not produced" }

      - name: Smoke token and qpdf-backed local API
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $qpdfDir = (Get-Content artifacts/qpdf-bin-dir.txt -Raw).Trim()
          $env:PATH = "$qpdfDir;$env:PATH"
          $port = 18742
          $token = "desktop-smoke-token-0123456789abcdef0123456789abcdef"
          $proc = Start-Process -FilePath "$PWD/dist/solyan-core.exe" -ArgumentList "--port", "$port", "--token", "$token" -PassThru -NoNewWindow -RedirectStandardOutput artifacts/sidecar-stdout.log -RedirectStandardError artifacts/sidecar-stderr.log
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health" -Headers @{"X-SolYan-Desktop-Token"=$token} -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.engine -eq "qpdf") { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "Desktop sidecar did not reach qpdf-backed health" }

            $unauthorized = $false
            try { Invoke-WebRequest -Uri "http://127.0.0.1:$port/health" -TimeoutSec 2 | Out-Null } catch { if ($_.Exception.Response.StatusCode.value__ -eq 401) { $unauthorized = $true } }
            if (-not $unauthorized) { throw "Desktop sidecar accepted a request without the per-launch token" }

            & (Join-Path $qpdfDir "qpdf.exe") --empty smoke-input.pdf
            if ($LASTEXITCODE -ne 0) { throw "qpdf could not create smoke input" }
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/pdf/repair" -Method Post -Headers @{"X-SolYan-Desktop-Token"=$token} -Form @{file=Get-Item smoke-input.pdf} -OutFile smoke-output.pdf -PassThru
            if ($response.StatusCode -ne 200 -or -not (Test-Path smoke-output.pdf)) { throw "qpdf-backed repair smoke failed" }
            & (Join-Path $qpdfDir "qpdf.exe") --check smoke-output.pdf 2>&1 | Tee-Object -FilePath artifacts/qpdf-repair-smoke.log
            if ($LASTEXITCODE -notin @(0,3)) { exit $LASTEXITCODE }
            "sidecar smoke OK" | Set-Content artifacts/sidecar-smoke.log
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Upload sidecar diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-sidecar-diagnostics
          path: artifacts/
          if-no-files-found: warn

      - name: Upload core sidecar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SolYan-Core-Windows-x64
          path: dist/solyan-core.exe
          if-no-files-found: error
