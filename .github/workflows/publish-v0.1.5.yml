name: Publish v0.1.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.5.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release content
        uses: actions/checkout@v4

      - name: Verify release metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('frontend/package.json').read_text())
          lock = json.loads(Path('frontend/package-lock.json').read_text())
          backend = Path('backend/app/main.py').read_text()
          changelog = Path('CHANGELOG.md').read_text()
          manifest = Path('docs/RELEASE-MANIFEST.md').read_text()
          roadmap = Path('docs/ROADMAP.md').read_text()
          audit = Path('docs/V1.2-PARITY-AUDIT.md')
          notes = Path('docs/RELEASE-NOTES-v0.1.5.md')

          assert package['version'] == '0.1.5', package['version']
          assert lock['version'] == '0.1.5', lock['version']
          assert lock['packages']['']['version'] == '0.1.5', lock['packages']['']['version']
          assert 'version="0.1.5"' in backend
          assert '## [0.1.5] - 2026-10-14' in changelog
          assert '# SolYan PDF v0.1.5 — Release Dependency Manifest' in manifest
          assert '| opencv-contrib-python | 4.10.0.84 |' in manifest
          assert 'V1.2 self-contained parity expansion is feature-complete.' in roadmap
          assert '- [x] Add QR-divider Auto Split' in roadmap
          assert '- [x] Harden Editor redaction from visual masking to security-first raster page replacement' in roadmap
          assert audit.is_file()
          assert notes.is_file()
          assert not list(Path('.github/workflows').glob('prepare-v0.1.5-*.yml'))
          PY

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.5 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.1.5 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.1.5 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "SolYan PDF v0.1.5" \
            --notes-file docs/RELEASE-NOTES-v0.1.5.md
