name: Office Service CI

on:
  pull_request:
    paths:
      - 'engines/office-service/**'
      - '.github/workflows/office-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'engines/office-service/**'
      - '.github/workflows/office-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/office-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu-core fonts-liberation
          libreoffice --version

      - name: Install hash-verified service dependencies
        run: |
          python -m pip install --require-hashes -r requirements.hashed.lock
          python -m pip install --no-deps -r requirements.txt
          python -m pip check

      - name: Install test-only dependencies
        run: |
          python -m pip install httpx==0.28.1 python-docx==1.2.0
          python -m pip check

      - name: Compile service
        run: python -m compileall app

      - name: Convert Office and exercise target-specific PDF import filters
        run: |
          python - <<'PY'
          import io
          import zipfile
          from docx import Document
          from fastapi.testclient import TestClient
          from app.main import app

          buffer = io.BytesIO()
          document = Document()
          document.add_heading('SolYan PDF Office CI', 1)
          document.add_paragraph('LibreOffice conversion smoke test with target-specific PDF import filters.')
          document.save(buffer)

          client = TestClient(app)
          health = client.get('/health')
          assert health.status_code == 200, health.text

          pdf_response = client.post(
              '/convert/to-pdf',
              files={'file': ('test.docx', buffer.getvalue(), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document')},
          )
          assert pdf_response.status_code == 200, pdf_response.text
          assert pdf_response.content.startswith(b'%PDF-')
          assert len(pdf_response.content) > 500

          for target, required in (
              ('docx', 'word/document.xml'),
              ('pptx', 'ppt/presentation.xml'),
          ):
              response = client.post(
                  '/convert/pdf-to-office',
                  files={'file': ('source.pdf', pdf_response.content, 'application/pdf')},
                  data={'target': target},
              )
              assert response.status_code == 200, (target, response.text)
              assert response.headers['x-solyan-conversion-engine'] == 'LibreOffice-PDF-import'
              with zipfile.ZipFile(io.BytesIO(response.content), 'r') as archive:
                  names = set(archive.namelist())
                  assert '[Content_Types].xml' in names, target
                  assert required in names, target
                  if target == 'pptx':
                      assert any(name.startswith('ppt/slides/slide') and name.endswith('.xml') for name in names), names
              print('pdf import ok', target, len(response.content))
          PY
