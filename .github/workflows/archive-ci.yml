name: PDF/A Service CI

on:
  pull_request:
    paths:
      - 'engines/archive-service/**'
      - '.github/workflows/archive-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'engines/archive-service/**'
      - '.github/workflows/archive-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/archive-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf tesseract-ocr tesseract-ocr-vie

      - name: Install hash-verified production dependencies
        run: pip install --require-hashes -r requirements.hashes

      - name: Install test-only dependencies
        run: |
          pip install httpx==0.28.1 pypdf==6.1.1
          pip check

      - name: Compile service
        run: python -m compileall app

      - name: Test health and PDF/A conversion
        run: |
          python - <<'PY'
          import io
          from pypdf import PdfWriter
          from fastapi.testclient import TestClient
          from app.main import app

          buf = io.BytesIO()
          writer = PdfWriter()
          writer.add_blank_page(width=595, height=842)
          writer.write(buf)

          client = TestClient(app)
          health = client.get('/health')
          assert health.status_code == 200, health.text
          response = client.post('/pdfa/internal', files={'file': ('test.pdf', buf.getvalue(), 'application/pdf')})
          assert response.status_code == 200, response.text
          assert response.content.startswith(b'%PDF-')
          print('PDF/A internal conversion ok', len(response.content))
          PY
