name: Sync v0.1.2 package lock

on:
  push:
    branches:
      - release/v0.1.2-pdf-office
    paths:
      - '.github/workflows/sync-v0.1.2-lock.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Update lock root version only
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '0.1.2';
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package is missing');
          lock.packages[''].version = '0.1.2';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          node -e "const p=require('./frontend/package.json'); const l=require('./frontend/package-lock.json'); if(p.version!=='0.1.2'||l.version!=='0.1.2'||l.packages[''].version!=='0.1.2') process.exit(1)"

      - name: Commit synchronized lock metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock already synchronized.'
            exit 0
          fi
          git commit -m 'release: sync v0.1.2 package lock'
          git push origin HEAD:release/v0.1.2-pdf-office
