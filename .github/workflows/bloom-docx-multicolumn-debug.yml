name: Bloom DOCX Multicolumn Debug

on:
  push:
    branches:
      - benchmark/pdf-office-real-diagnostic-v1
    paths:
      - '.github/workflows/bloom-docx-multicolumn-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BLOOM_REPO: https://github.com/stemlen/bloom-pdf-editor.git
  BLOOM_COMMIT: 9ed16c43e356cffd4bd3b004b0dab19e582a59d5
  BLOOM_PATCH: patches/bloom/table-cluster-group-bottom.patch
  BLOOM_REGRESSION_TEST: patches/bloom/solyan-table-cluster-regression.test.ts
  REAL_MANIFEST: benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json

jobs:
  debug-docx:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install debug dependencies
        run: pip install httpx==0.28.1 pypdf==6.1.1 cryptography==46.0.3

      - name: Materialize pinned multicolumn PDF
        run: |
          set -euo pipefail
          mkdir -p /tmp/multicolumn-corpus
          python benchmarks/fetch_pdf_to_office_real_corpus.py \
            --manifest "$REAL_MANIFEST" \
            --case-id docx-multicolumn \
            --output-dir /tmp/multicolumn-corpus \
            --output-inventory /tmp/multicolumn-inventory.json

      - name: Setup Node matching Bloom image
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned Bloom and apply SolYan patch
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$BLOOM_REPO" /tmp/bloom
          git -C /tmp/bloom fetch --depth=1 origin "$BLOOM_COMMIT"
          git -C /tmp/bloom checkout --detach "$BLOOM_COMMIT"
          test "$(git -C /tmp/bloom rev-parse HEAD)" = "$BLOOM_COMMIT"
          git -C /tmp/bloom apply --check "$GITHUB_WORKSPACE/$BLOOM_PATCH"
          git -C /tmp/bloom apply "$GITHUB_WORKSPACE/$BLOOM_PATCH"
          cp "$GITHUB_WORKSPACE/$BLOOM_REGRESSION_TEST" /tmp/bloom/server/src/tests/solyan-table-cluster-regression.test.ts

      - name: Typecheck Bloom and run SolYan regression
        working-directory: /tmp/bloom/server
        run: |
          npm ci
          npm run typecheck
          npx vitest run src/tests/solyan-table-cluster-regression.test.ts

      - name: Build debug images
        run: |
          docker build -t solyan-bloom-debug /tmp/bloom/server
          docker build -t solyan-office-debug engines/office-service
          docker build -t solyan-backend-debug backend

      - name: Start isolated debug stack
        run: |
          docker network create solyan-bloom-debug
          docker run -d --name bloom-debug --network solyan-bloom-debug \
            -e BLOOM_STORAGE_ROOT=/tmp/bloom-storage \
            solyan-bloom-debug
          docker run -d --name office-debug --network solyan-bloom-debug solyan-office-debug
          docker run -d --name backend-debug --network solyan-bloom-debug -p 8000:8000 \
            -e BLOOM_SERVICE_URL=http://bloom-debug:8787 \
            -e OFFICE_SERVICE_URL=http://office-debug:8020 \
            solyan-backend-debug

      - name: Wait for health
        run: |
          python - <<'PY'
          import time
          import urllib.request
          urls = [
              'http://127.0.0.1:8000/health',
              'http://127.0.0.1:8000/experimental/bloom/health',
          ]
          deadline = time.monotonic() + 180
          for url in urls:
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if 200 <= response.status < 300:
                              print(url, response.read().decode('utf-8', 'replace'))
                              break
                  except Exception as exc:
                      if time.monotonic() >= deadline:
                          raise SystemExit(f'health timeout for {url}: {exc}')
                      time.sleep(3)
          PY

      - name: Capture and inspect Bloom DOCX
        run: |
          set -euo pipefail
          mkdir -p /tmp/multicolumn-debug
          python - <<'PY'
          import io
          import json
          import posixpath
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import httpx

          pdf_path = Path('/tmp/multicolumn-corpus/docx-multicolumn.pdf')
          source = pdf_path.read_bytes()
          output_dir = Path('/tmp/multicolumn-debug')
          docx_path = output_dir / 'docx-multicolumn-bloom.docx'
          diag_path = output_dir / 'diagnostics.json'
          roundtrip_path = output_dir / 'roundtrip.pdf'

          with httpx.Client(timeout=360.0) as client:
              converted = client.post(
                  'http://127.0.0.1:8000/experimental/pdf-to-office',
                  files={'file': (pdf_path.name, source, 'application/pdf')},
                  data={'target': 'docx'},
              )
              converted.raise_for_status()
              docx = converted.content
              docx_path.write_bytes(docx)

              diagnostics = {
                  'pdf_bytes': len(source),
                  'docx_bytes': len(docx),
                  'zip_valid': False,
                  'zip_test_error': None,
                  'entry_count': 0,
                  'missing_required_entries': [],
                  'xml_parse_errors': [],
                  'missing_relationship_targets': [],
                  'office_status': None,
                  'office_body': None,
                  'roundtrip_pdf_bytes': 0,
              }

              required = {'[Content_Types].xml', '_rels/.rels', 'word/document.xml'}
              try:
                  with zipfile.ZipFile(io.BytesIO(docx), 'r') as archive:
                      names = set(archive.namelist())
                      diagnostics['zip_valid'] = True
                      diagnostics['entry_count'] = len(names)
                      diagnostics['zip_test_error'] = archive.testzip()
                      diagnostics['missing_required_entries'] = sorted(required - names)

                      for name in sorted(names):
                          if not (name.endswith('.xml') or name.endswith('.rels')):
                              continue
                          try:
                              ET.fromstring(archive.read(name))
                          except Exception as exc:
                              diagnostics['xml_parse_errors'].append({'entry': name, 'error': str(exc)})

                      rel_ns = {'r': 'http://schemas.openxmlformats.org/package/2006/relationships'}
                      for rel_name in sorted(name for name in names if name.endswith('.rels')):
                          try:
                              root = ET.fromstring(archive.read(rel_name))
                          except Exception:
                              continue

                          if rel_name == '_rels/.rels':
                              base_dir = ''
                          elif '/_rels/' in rel_name:
                              prefix, tail = rel_name.rsplit('/_rels/', 1)
                              source_name = tail[:-5] if tail.endswith('.rels') else tail
                              base_dir = posixpath.dirname(posixpath.join(prefix, source_name))
                          else:
                              base_dir = posixpath.dirname(rel_name)

                          for rel in root.findall('r:Relationship', rel_ns):
                              if rel.attrib.get('TargetMode') == 'External':
                                  continue
                              target = rel.attrib.get('Target', '')
                              if not target:
                                  continue
                              normalized = posixpath.normpath(posixpath.join(base_dir, target)).lstrip('/')
                              if normalized not in names:
                                  diagnostics['missing_relationship_targets'].append({
                                      'rels': rel_name,
                                      'id': rel.attrib.get('Id'),
                                      'target': target,
                                      'resolved': normalized,
                                  })
              except Exception as exc:
                  diagnostics['zip_error'] = str(exc)

              office = client.post(
                  'http://127.0.0.1:8000/office/to-pdf',
                  files={'file': ('roundtrip.docx', docx, 'application/octet-stream')},
              )
              diagnostics['office_status'] = office.status_code
              diagnostics['office_body'] = office.text[:4000] if office.status_code >= 400 else None
              if office.status_code < 400:
                  diagnostics['roundtrip_pdf_bytes'] = len(office.content)
                  roundtrip_path.write_bytes(office.content)

          diag_path.write_text(json.dumps(diagnostics, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(diagnostics, ensure_ascii=False, indent=2))
          PY

      - name: Capture container logs
        if: always()
        run: |
          mkdir -p /tmp/multicolumn-debug
          for name in bloom-debug office-debug backend-debug; do
            docker logs "$name" > "/tmp/multicolumn-debug/${name}.log" 2>&1 || true
          done

      - name: Upload multicolumn debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloom-docx-multicolumn-debug
          path: /tmp/multicolumn-debug/
          if-no-files-found: error
          retention-days: 7

      - name: Stop debug stack
        if: always()
        run: |
          docker rm -f backend-debug office-debug bloom-debug 2>/dev/null || true
          docker network rm solyan-bloom-debug 2>/dev/null || true
