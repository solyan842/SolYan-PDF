name: Bootstrap v0.1.1 package lock

on:
  push:
    branches:
      - release/v0.1.1
    paths:
      - 'frontend/package.json'
      - '.github/workflows/bootstrap-v0.1.1-lock.yml'

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.1

      - name: Update root lock metadata only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/package-lock.json')
          text = path.read_text(encoding='utf-8')
          old = '"version": "0.1.0"'
          assert text.count(old) >= 2
          text = text.replace(old, '"version": "0.1.1"', 2)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit package-lock metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'release: sync package-lock version to 0.1.1'
          git push origin HEAD:release/v0.1.1
