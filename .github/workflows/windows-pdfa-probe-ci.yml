name: Windows PDF-A Native Runtime Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/backend/requirements-pdfa-windows.txt"
      - "desktop/backend/tests/pdfa_windows_probe.py"
      - "desktop/backend/tests/pdfa_frozen_smoke.py"
      - "desktop/backend/archive_runner.py"
      - ".github/workflows/windows-pdfa-probe-ci.yml"
      - "engines/archive-service/**"
  push:
    branches:
      - "feat/windows-desktop-d5-pdfa-probe"
    paths:
      - "desktop/backend/requirements-pdfa-windows.txt"
      - "desktop/backend/tests/pdfa_windows_probe.py"
      - "desktop/backend/tests/pdfa_frozen_smoke.py"
      - "desktop/backend/archive_runner.py"
      - ".github/workflows/windows-pdfa-probe-ci.yml"
      - "engines/archive-service/**"

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/backend/requirements-pdfa-windows.txt
      - name: Make diagnostic artifact folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null
      - name: Install Windows-safe archive dependencies
        shell: pwsh
        run: |
          python -m pip install -r desktop/backend/requirements-pdfa-windows.txt 2>&1 | Tee-Object artifacts/pdfa-pip.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check 2>&1 | Tee-Object artifacts/pdfa-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage existing checksum-pinned D4 Tesseract for OCRmyPDF preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tesseractRoot = Join-Path $env:RUNNER_TEMP "solyan-pdfa-tesseract"
          & ./desktop/backend/stage-ocr-runtime.ps1 -Destination $tesseractRoot 2>&1 | Tee-Object artifacts/pdfa-tesseract-stage.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tesseractExe = Join-Path $tesseractRoot "tesseract.exe"
          $tessdata = Join-Path $tesseractRoot "tessdata"
          if (-not (Test-Path $tesseractExe -PathType Leaf) -or -not (Test-Path $tessdata -PathType Container)) {
            throw "Pinned Tesseract runtime failed to stage"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $tesseractRoot -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "TESSDATA_PREFIX=$tessdata" -Encoding utf8
      - name: Prove native offline PDF-A conversion via existing service
        shell: pwsh
        run: |
          python desktop/backend/tests/pdfa_windows_probe.py 2>&1 | Tee-Object artifacts/pdfa-probe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freeze local archive service with upstream OCRmyPDF PyInstaller hook
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name solyan-archive --paths . --paths engines/archive-service --collect-submodules app desktop/backend/archive_runner.py 2>&1 | Tee-Object artifacts/pdfa-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/solyan-archive.exe)) { throw "Frozen archive sidecar missing" }
      - name: Prove authenticated frozen archive converts PDF-A offline
        shell: pwsh
        run: |
          python desktop/backend/tests/pdfa_frozen_smoke.py --exe dist/solyan-archive.exe --output artifacts 2>&1 | Tee-Object artifacts/pdfa-frozen-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve real failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pdfa-native-diagnostics
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
