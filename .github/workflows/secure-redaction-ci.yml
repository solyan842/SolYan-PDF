name: Secure Redaction CI

on:
  pull_request:
    paths:
      - 'frontend/lib/secure-redaction.ts'
      - 'frontend/app/editor/**'
      - '.github/workflows/secure-redaction-ci.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/ROADMAP.md'
  push:
    branches:
      - main
    paths:
      - 'frontend/lib/secure-redaction.ts'
      - 'frontend/app/editor/**'
      - '.github/workflows/secure-redaction-ci.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/ROADMAP.md'

jobs:
  secure-redaction:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install qpdf and Poppler verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Compile secure redaction helper for regression
        run: |
          rm -rf .tmp-secure-redaction-ci
          npx tsc lib/secure-redaction.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir .tmp-secure-redaction-ci

      - name: Gate page rebuild removes original redacted content
        run: |
          set -euo pipefail
          node <<'NODE' 2>&1 | tee /tmp/secure-redaction-ci.log
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { PDFDocument, StandardFonts } = require('pdf-lib');
          const {
            normalizeRedactionBox,
            rebuildPdfWithRasterizedPage,
          } = require('./.tmp-secure-redaction-ci/secure-redaction.js');

          (async () => {
            assert.deepEqual(
              normalizeRedactionBox({ x: -10, y: 20, width: 50, height: 30 }, 100, 100),
              { x: 0, y: 20, width: 40, height: 30 },
            );
            assert.throws(
              () => normalizeRedactionBox({ x: 200, y: 20, width: 10, height: 10 }, 100, 100),
              /outside/,
            );

            const source = await PDFDocument.create();
            const font = await source.embedFont(StandardFonts.Helvetica);
            const first = source.addPage([612, 792]);
            first.drawText('SECRET_REMOVE_ME_842', { x: 72, y: 700, size: 24, font });
            const second = source.addPage([612, 792]);
            second.drawText('PUBLIC_KEEP_ME_842', { x: 72, y: 700, size: 24, font });
            const sourceBytes = await source.save({ useObjectStreams: true });
            fs.writeFileSync('/tmp/secure-redaction-source.pdf', Buffer.from(sourceBytes));

            const blackPng = Buffer.from(
              'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAC0lEQVR4nGNgQAYAAA4AAamRc7EAAAAASUVORK5CYII=',
              'base64',
            );
            const redactedBytes = await rebuildPdfWithRasterizedPage(
              sourceBytes,
              0,
              blackPng,
              612,
              792,
            );
            fs.writeFileSync('/tmp/secure-redaction-output.pdf', Buffer.from(redactedBytes));

            const reloaded = await PDFDocument.load(redactedBytes);
            assert.equal(reloaded.getPageCount(), 2);
            assert.equal(Math.round(reloaded.getPage(0).getWidth()), 612);
            assert.equal(Math.round(reloaded.getPage(0).getHeight()), 792);
            console.log('secure page-tree rebuild semantics: PASS');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          qpdf --check /tmp/secure-redaction-output.pdf 2>&1 | tee -a /tmp/secure-redaction-ci.log
          test "$(qpdf --show-npages /tmp/secure-redaction-output.pdf)" = "2"
          pdftotext /tmp/secure-redaction-output.pdf /tmp/secure-redaction.txt
          cat /tmp/secure-redaction.txt | tee -a /tmp/secure-redaction-ci.log
          grep -q 'PUBLIC_KEEP_ME_842' /tmp/secure-redaction.txt
          if grep -q 'SECRET_REMOVE_ME_842' /tmp/secure-redaction.txt; then
            echo 'redacted source text remains extractable' | tee -a /tmp/secure-redaction-ci.log
            exit 1
          fi
          qpdf --qdf --object-streams=disable /tmp/secure-redaction-output.pdf /tmp/secure-redaction-expanded.pdf
          if grep -a -q 'SECRET_REMOVE_ME_842' /tmp/secure-redaction-expanded.pdf; then
            echo 'redacted source text remains in reachable serialized PDF objects' | tee -a /tmp/secure-redaction-ci.log
            exit 1
          fi
          echo 'secret absent + untouched page text retained: PASS' | tee -a /tmp/secure-redaction-ci.log

      - name: Gate production editor uses raster replacement for redact
        run: |
          set -euo pipefail
          grep -q "SECURE_REDACTION_DPI = 150" app/editor/page.tsx
          grep -q "rebuildPdfWithRasterizedPage" app/editor/page.tsx
          grep -q "renderedPage.render({ canvas, canvasContext: context, viewport, background: '#ffffff' })" app/editor/page.tsx
          grep -q "Redact an toàn · raster trang" app/editor/page.tsx
          grep -q "không copy content stream gốc" app/editor/page.tsx
          grep -q "MAX_REDACTION_PIXELS = 25_000_000" app/editor/page.tsx
          echo 'production secure-redaction wiring + explicit boundary: PASS' | tee -a /tmp/secure-redaction-ci.log

      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Upload Secure Redaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-redaction-ci-evidence
          path: /tmp/secure-redaction-ci.log
          if-no-files-found: warn
          retention-days: 14
