name: Publish v0.1.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.4.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release content
        uses: actions/checkout@v4

      - name: Verify release metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('frontend/package.json').read_text())
          lock = json.loads(Path('frontend/package-lock.json').read_text())
          backend = Path('backend/app/main.py').read_text()
          changelog = Path('CHANGELOG.md').read_text()
          manifest = Path('docs/RELEASE-MANIFEST.md').read_text()
          roadmap = Path('docs/ROADMAP.md').read_text()
          notes = Path('docs/RELEASE-NOTES-v0.1.4.md')

          assert package['version'] == '0.1.4', package['version']
          assert lock['version'] == '0.1.4', lock['version']
          assert lock['packages']['']['version'] == '0.1.4', lock['packages']['']['version']
          assert 'version="0.1.4"' in backend
          assert '## [0.1.4] - 2026-10-13' in changelog
          assert '# SolYan PDF v0.1.4 — Release Dependency Manifest' in manifest
          assert '| Poppler utilities |' in manifest
          assert '- [x] Add booklet / imposition layout' in roadmap
          assert '- [x] Add crop / resize-page utilities with deterministic page geometry' in roadmap
          assert 'V1.1 self-hosted utility parity is complete.' in roadmap
          assert notes.is_file()
          PY

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.4 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.1.4 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.1.4 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "SolYan PDF v0.1.4" \
            --notes-file docs/RELEASE-NOTES-v0.1.4.md
