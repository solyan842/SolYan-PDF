name: Finish v0.1.5 cleanup

on:
  push:
    branches:
      - chore/cleanup-v0.1.5-publisher
    paths:
      - '.github/workflows/finish-v0.1.5-cleanup.yml'

permissions:
  contents: write

jobs:
  finish-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/cleanup-v0.1.5-publisher

      - name: Mark v0.1.5 release complete
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          old = '- [ ] Publish V1.2 self-contained parity/hardening patch release'
          new = '- [x] Publish V1.2 self-contained parity/hardening patch release `v0.1.5`\n- [x] Remove completed `v0.1.5` one-shot publisher after successful publication'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('unexpected V1.2 release checklist state')
          path.write_text(text)
          PY
          git rm .github/workflows/finish-v0.1.5-cleanup.yml

      - name: Commit cleanup metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "release: mark v0.1.5 publication complete"
          git push origin HEAD:chore/cleanup-v0.1.5-publisher
