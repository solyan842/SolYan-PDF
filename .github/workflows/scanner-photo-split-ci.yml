name: Scanner Photo Split CI

on:
  pull_request:
    paths:
      - 'engines/ocr-service/app/scanner_split.py'
      - 'engines/ocr-service/app/auto_rotate_api.py'
      - 'backend/app/ocr_proxy.py'
      - 'frontend/app/scanner-photo-split/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/scanner-photo-split-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'engines/ocr-service/app/scanner_split.py'
      - 'engines/ocr-service/app/auto_rotate_api.py'
      - 'backend/app/ocr_proxy.py'
      - 'frontend/app/scanner-photo-split/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/scanner-photo-split-ci.yml'

jobs:
  scanner-photo-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install scanner split test engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi==0.119.0 \
            python-multipart==0.0.20 \
            httpx==0.28.1 \
            opencv-contrib-python==4.10.0.84 \
            pypdfium2==5.14.0 \
            Pillow
          python -m pip check

      - name: Compile scanner split paths
        run: python -m compileall engines/ocr-service/app backend/app

      - name: Gate deterministic detection and deskew
        env:
          PYTHONPATH: engines/ocr-service:backend
        run: |
          set -euo pipefail
          mkdir -p /tmp/solyan-scanner-split
          python <<'PY' 2>&1 | tee /tmp/solyan-scanner-split/gate.log
          from __future__ import annotations

          import cv2
          import numpy as np
          from pathlib import Path

          from app.scanner_split import (
              _normalized_rect_angle,
              detect_photo_regions,
              estimate_background_color,
              foreground_mask,
              split_image,
          )

          root = Path('/tmp/solyan-scanner-split')
          background = (238, 238, 238)
          canvas = np.full((1200, 1600, 3), background, dtype=np.uint8)

          cv2.rectangle(canvas, (90, 90), (590, 430), (30, 80, 200), thickness=-1)
          cv2.rectangle(canvas, (900, 110), (1490, 470), (170, 70, 35), thickness=-1)
          rotated = cv2.boxPoints(((800, 860), (560, 320), 12.0)).astype(np.int32)
          cv2.fillConvexPoly(canvas, rotated, (60, 170, 55))
          cv2.imwrite(str(root / 'scan.png'), canvas)

          regions, _mask, bg = detect_photo_regions(
              canvas,
              tolerance=30,
              min_area=40_000,
              min_contour_area=20_000,
          )
          print('regions:', regions)
          print('background:', bg.tolist())
          assert len(regions) == 3, regions
          assert regions[0][1] < 150 and regions[0][0] < 200, regions
          assert regions[1][1] < 170 and regions[1][0] > 800, regions
          assert regions[2][1] > 500, regions
          assert max(abs(float(channel) - 238.0) for channel in bg) <= 1.0, bg

          photos = split_image(
              canvas,
              page=1,
              angle_threshold=5.0,
              tolerance=30,
              min_area=40_000,
              min_contour_area=20_000,
              border_size=4,
          )
          assert len(photos) == 3, photos
          assert [(item.page, item.index) for item in photos] == [(1, 1), (1, 2), (1, 3)]
          deskewed = [item for item in photos if abs(item.rotation) >= 8.0]
          assert len(deskewed) == 1, [item.rotation for item in photos]
          assert 10.0 <= abs(deskewed[0].rotation) <= 14.0, deskewed[0].rotation

          decoded = cv2.imdecode(np.frombuffer(deskewed[0].png, dtype=np.uint8), cv2.IMREAD_COLOR)
          assert decoded is not None and decoded.size > 0
          decoded_bg = estimate_background_color(decoded)
          decoded_mask = foreground_mask(decoded, decoded_bg, 30)
          contours, _ = cv2.findContours(decoded_mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)
          assert contours
          residual = _normalized_rect_angle(max(contours, key=cv2.contourArea))
          print('deskew correction:', deskewed[0].rotation, 'residual:', residual)
          assert abs(residual) <= 1.5, residual
          print('detector/deskew gate: PASS')
          PY

      - name: Gate image and PDF production API
        env:
          PYTHONPATH: engines/ocr-service:backend
        run: |
          set -euo pipefail
          python <<'PY' 2>&1 | tee -a /tmp/solyan-scanner-split/gate.log
          from __future__ import annotations

          import io
          import zipfile
          from pathlib import Path

          import cv2
          import numpy as np
          from PIL import Image
          from fastapi.testclient import TestClient

          from app.auto_rotate_api import app

          root = Path('/tmp/solyan-scanner-split')
          scan = root.joinpath('scan.png').read_bytes()
          client = TestClient(app)
          form = {
              'angle_threshold': '5',
              'tolerance': '30',
              'min_area': '40000',
              'min_contour_area': '20000',
              'border_size': '4',
          }

          image_response = client.post(
              '/ocr/scanner-photo-split',
              files={'file': ('scan.png', scan, 'image/png')},
              data=form,
          )
          assert image_response.status_code == 200, image_response.text
          assert image_response.headers['content-type'].startswith('application/zip')
          assert int(image_response.headers['X-SolYan-Scanner-Photos']) == 3
          assert int(image_response.headers['X-SolYan-Scanner-Pages']) == 1
          assert int(image_response.headers['X-SolYan-Scanner-Deskewed']) == 1
          with zipfile.ZipFile(io.BytesIO(image_response.content), 'r') as archive:
              names = archive.namelist()
              assert names == [
                  'page-001-photo-001.png',
                  'page-001-photo-002.png',
                  'page-001-photo-003.png',
              ], names
              for name in names:
                  decoded = cv2.imdecode(np.frombuffer(archive.read(name), dtype=np.uint8), cv2.IMREAD_COLOR)
                  assert decoded is not None and decoded.size > 0, name
          root.joinpath('image-output.zip').write_bytes(image_response.content)

          image = Image.open(io.BytesIO(scan)).convert('RGB')
          pdf_path = root / 'scan-two-pages.pdf'
          image.save(pdf_path, 'PDF', resolution=150.0, save_all=True, append_images=[image.copy()])
          image.close()
          pdf_data = pdf_path.read_bytes()
          pdf_response = client.post(
              '/ocr/scanner-photo-split',
              files={'file': ('scan.pdf', pdf_data, 'application/pdf')},
              data=form,
          )
          assert pdf_response.status_code == 200, pdf_response.text
          assert int(pdf_response.headers['X-SolYan-Scanner-Photos']) == 6, pdf_response.headers
          assert int(pdf_response.headers['X-SolYan-Scanner-Pages']) == 2, pdf_response.headers
          with zipfile.ZipFile(io.BytesIO(pdf_response.content), 'r') as archive:
              names = archive.namelist()
              assert len(names) == 6, names
              assert names[0] == 'page-001-photo-001.png', names
              assert names[-1] == 'page-002-photo-003.png', names
          root.joinpath('pdf-output.zip').write_bytes(pdf_response.content)

          blank = np.full((800, 1200, 3), 238, dtype=np.uint8)
          ok, blank_png = cv2.imencode('.png', blank)
          assert ok
          blank_response = client.post(
              '/ocr/scanner-photo-split',
              files={'file': ('blank.png', blank_png.tobytes(), 'image/png')},
              data=form,
          )
          assert blank_response.status_code == 422, (blank_response.status_code, blank_response.text)
          assert 'No photo regions' in blank_response.text, blank_response.text
          print('image/PDF API and no-photo refusal: PASS')
          PY

      - name: Gate backend proxy and product wiring
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python <<'PY' 2>&1 | tee -a /tmp/solyan-scanner-split/gate.log
          from app.ocr_proxy import _scanner_split_form

          form = _scanner_split_form(10.0, 30, 10000, 500.0, 1)
          assert form == {
              'angle_threshold': '10',
              'tolerance': '30',
              'min_area': '10000',
              'min_contour_area': '500',
              'border_size': '1',
          }, form
          try:
              _scanner_split_form(46.0, 30, 10000, 500.0, 1)
          except Exception as exc:
              assert getattr(exc, 'status_code', None) == 422, exc
          else:
              raise AssertionError('invalid deskew threshold must be rejected')
          print('backend form validation: PASS')
          PY
          grep -q '@router.post("/scanner-photo-split")' backend/app/ocr_proxy.py
          grep -q '/ocr/scanner-photo-split' frontend/app/scanner-photo-split/page.tsx
          grep -q "href: '/scanner-photo-split'" frontend/app/page.tsx
          grep -Fxq 'opencv-contrib-python==4.10.0.84' engines/ocr-service/requirements.txt
          grep -Fxq 'pypdfium2==5.14.0' engines/ocr-service/requirements.txt
          echo 'route/UI/existing dependency wiring: PASS' | tee -a /tmp/solyan-scanner-split/gate.log

      - name: Upload scanner split evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-photo-split-evidence
          path: |
            /tmp/solyan-scanner-split/gate.log
            /tmp/solyan-scanner-split/scan.png
            /tmp/solyan-scanner-split/scan-two-pages.pdf
            /tmp/solyan-scanner-split/image-output.zip
            /tmp/solyan-scanner-split/pdf-output.zip
          if-no-files-found: warn
          retention-days: 14
