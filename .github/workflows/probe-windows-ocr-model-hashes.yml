name: Probe Windows OCR Model Hashes

on:
  push:
    branches:
      - probe/windows-ocr-model-hashes
    paths:
      - '.github/workflows/probe-windows-ocr-model-hashes.yml'

permissions:
  contents: read

jobs:
  hash-official-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and hash pinned PP-StructureV3 inference models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/models
          base='https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0'
          models=(
            PP-DocLayout_plus-L
            PP-DocBlockLayout
            PP-OCRv5_server_det
            PP-OCRv5_server_rec
            PP-LCNet_x1_0_table_cls
            SLANeXt_wired
            SLANet_plus
            RT-DETR-L_wired_table_cell_det
            RT-DETR-L_wireless_table_cell_det
            PP-FormulaNet_plus-L
          )
          : > artifacts/structure-model-hashes.txt
          for model in "${models[@]}"; do
            file="artifacts/models/${model}_infer.tar"
            url="$base/${model}_infer.tar"
            echo "Downloading $url"
            curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 1800 "$url" -o "$file"
            tar -tf "$file" >/dev/null
            sha="$(sha256sum "$file" | awk '{print $1}')"
            bytes="$(stat -c '%s' "$file")"
            printf '%s\t%s\t%s\t%s\n' "$model" "$sha" "$bytes" "$url" | tee -a artifacts/structure-model-hashes.txt
          done

      - name: Emit JSON manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for line in Path('artifacts/structure-model-hashes.txt').read_text().splitlines():
              name, sha256, size, url = line.split('\t')
              rows.append({
                  'name': name,
                  'sha256': sha256,
                  'size_bytes': int(size),
                  'url': url,
              })
          payload = {
              'scope': 'pp-structurev3-extra-models',
              'paddleocr_version': '3.7.0',
              'paddlex_version': '3.7.2',
              'paddlex_commit': 'ffb64904d23708863ff5b8da312a5cbd52a7f462',
              'models': rows,
              'total_size_bytes': sum(row['size_bytes'] for row in rows),
          }
          Path('artifacts/structure-model-hashes.json').write_text(json.dumps(payload, indent=2) + '\n')
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-ppstructure-model-hash-probe
          path: |
            artifacts/structure-model-hashes.txt
            artifacts/structure-model-hashes.json
          if-no-files-found: error
          retention-days: 7
