name: Poster PDF CI

on:
  pull_request:
    paths:
      - 'frontend/lib/poster.ts'
      - 'frontend/lib/n-up.ts'
      - 'frontend/app/poster/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/poster-ci.yml'
      - 'docs/ROADMAP.md'
  push:
    branches:
      - main
    paths:
      - 'frontend/lib/poster.ts'
      - 'frontend/lib/n-up.ts'
      - 'frontend/app/poster/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/poster-ci.yml'
      - 'docs/ROADMAP.md'

jobs:
  poster:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          qpdf --version

      - name: Compile poster helper
        run: |
          rm -rf .tmp-poster
          npx tsc lib/n-up.ts lib/poster.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --noEmit false \
            --outDir .tmp-poster

      - name: Verify poster plan, RTL, CropBox and rotation
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { PDFDocument, StandardFonts, degrees } = require('pdf-lib');
          const { planPosterTiles, createPosterPdf, POSTER_PAGE_SIZES } = require('./.tmp-poster/poster.js');

          (async () => {
            const plan = planPosterTiles([{ width: 400, height: 200 }], {
              xFactor: 2, yFactor: 2, pageSize: 'A4', rightToLeft: true,
            });
            assert.equal(plan.length, 4);
            assert.deepEqual(plan.map((tile) => [tile.row, tile.column, tile.cropX, tile.cropY]), [
              [0, 1, 200, 100],
              [0, 0, 0, 100],
              [1, 1, 200, 0],
              [1, 0, 0, 0],
            ]);

            const source = await PDFDocument.create();
            const font = await source.embedFont(StandardFonts.Helvetica);
            const page = source.addPage([400, 200]);
            page.drawText('LEFT', { x: 35, y: 95, size: 20, font });
            page.drawText('RIGHT', { x: 265, y: 95, size: 20, font });
            const bytes = await source.save();

            const ltr = await createPosterPdf(bytes, { xFactor: 2, yFactor: 1, pageSize: 'A4', rightToLeft: false });
            const rtl = await createPosterPdf(bytes, { xFactor: 2, yFactor: 1, pageSize: 'A4', rightToLeft: true });
            fs.writeFileSync('/tmp/poster-ltr.pdf', Buffer.from(ltr));
            fs.writeFileSync('/tmp/poster-rtl.pdf', Buffer.from(rtl));

            for (const outputBytes of [ltr, rtl]) {
              const doc = await PDFDocument.load(outputBytes);
              assert.equal(doc.getPageCount(), 2);
              for (const outPage of doc.getPages()) {
                const size = outPage.getSize();
                assert.ok(Math.abs(size.width - POSTER_PAGE_SIZES.A4.width) < 0.1);
                assert.ok(Math.abs(size.height - POSTER_PAGE_SIZES.A4.height) < 0.1);
              }
            }

            const rotatedSource = await PDFDocument.create();
            const rotatedFont = await rotatedSource.embedFont(StandardFonts.Helvetica);
            const rotatedPage = rotatedSource.addPage([400, 300]);
            rotatedPage.setCropBox(50, 25, 250, 200);
            rotatedPage.setRotation(degrees(90));
            rotatedPage.drawText('ROTATED-CROP', { x: 110, y: 110, size: 18, font: rotatedFont });
            const rotatedBytes = await rotatedSource.save();
            const rotatedOut = await createPosterPdf(rotatedBytes, { xFactor: 1, yFactor: 1, pageSize: 'A5', rightToLeft: false });
            fs.writeFileSync('/tmp/poster-rotated.pdf', Buffer.from(rotatedOut));
            const rotatedDoc = await PDFDocument.load(rotatedOut);
            assert.equal(rotatedDoc.getPageCount(), 1);
            const size = rotatedDoc.getPage(0).getSize();
            assert.ok(Math.abs(size.width - POSTER_PAGE_SIZES.A5.width) < 0.1);
            assert.ok(Math.abs(size.height - POSTER_PAGE_SIZES.A5.height) < 0.1);

            console.log('poster planner and PDF generation ok');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

          qpdf --check /tmp/poster-ltr.pdf
          qpdf --check /tmp/poster-rtl.pdf
          qpdf --check /tmp/poster-rotated.pdf

          pdftotext -f 1 -l 1 /tmp/poster-ltr.pdf - | grep -q 'LEFT'
          pdftotext -f 2 -l 2 /tmp/poster-ltr.pdf - | grep -q 'RIGHT'
          pdftotext -f 1 -l 1 /tmp/poster-rtl.pdf - | grep -q 'RIGHT'
          pdftotext -f 2 -l 2 /tmp/poster-rtl.pdf - | grep -q 'LEFT'
          pdftotext /tmp/poster-rotated.pdf - | grep -q 'ROTATED-CROP'

      - name: Remove temporary compiled helper
        if: always()
        run: rm -rf .tmp-poster
