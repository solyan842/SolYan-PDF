name: N-up Layout CI

on:
  pull_request:
    paths:
      - 'frontend/lib/n-up.ts'
      - 'frontend/app/n-up/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/n-up-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/lib/n-up.ts'
      - 'frontend/app/n-up/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/n-up-ci.yml'

jobs:
  n-up:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          qpdf --version
          pdfinfo -v

      - name: Compile N-up helper for deterministic test
        run: |
          rm -rf .tmp-nup
          npx tsc lib/n-up.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --noEmit false \
            --outDir .tmp-nup

      - name: Verify layout plan and real N-up PDF
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { PDFDocument, StandardFonts, degrees } = require('pdf-lib');
          const { A4_PORTRAIT, createNUpPdf, planNUpSheets } = require('./.tmp-nup/n-up.js');

          const options = {
            rows: 2,
            columns: 2,
            orientation: 'landscape',
            arrangement: 'rows',
            direction: 'ltr',
            outerMargin: 18,
            innerMargin: 6,
            border: true,
          };

          const plan = planNUpSheets([
            { width: 200, height: 100, rotation: 0 },
            { width: 200, height: 100, rotation: 90 },
            { width: 100, height: 200, rotation: 180 },
            { width: 100, height: 200, rotation: 270 },
            { width: 200, height: 200, rotation: 0 },
          ], options);
          assert.equal(plan.length, 2);
          assert.equal(plan[0].placements.length, 4);
          assert.equal(plan[1].placements.length, 1);
          assert.ok(Math.abs(plan[0].pageWidth - A4_PORTRAIT.height) < 0.01);
          assert.ok(Math.abs(plan[0].pageHeight - A4_PORTRAIT.width) < 0.01);
          assert.equal(plan[0].placements[1].rotation, 90);
          assert.ok(plan[0].placements[1].height > plan[0].placements[1].width, 'rotated landscape source must display portrait');
          for (const sheet of plan) {
            for (const p of sheet.placements) {
              assert.ok(p.x >= 0 && p.y >= 0);
              assert.ok(p.x + p.width <= sheet.pageWidth + 0.01);
              assert.ok(p.y + p.height <= sheet.pageHeight + 0.01);
              assert.ok(p.scale > 0);
            }
          }

          const rtl = planNUpSheets(
            [{ width: 100, height: 100, rotation: 0 }, { width: 100, height: 100, rotation: 0 }],
            { ...options, rows: 1, columns: 2, direction: 'rtl' },
          );
          assert.equal(rtl[0].placements[0].column, 1);
          assert.equal(rtl[0].placements[1].column, 0);

          const byColumns = planNUpSheets(
            Array.from({ length: 4 }, () => ({ width: 100, height: 100, rotation: 0 })),
            { ...options, arrangement: 'columns' },
          );
          assert.deepEqual(byColumns[0].placements.map((p) => [p.row, p.column]), [[0,0],[1,0],[0,1],[1,1]]);

          assert.throws(() => planNUpSheets([{ width: 100, height: 100, rotation: 0 }], { ...options, rows: 9 }), /Số hàng/);
          assert.throws(() => planNUpSheets([{ width: 100, height: 100, rotation: 0 }], { ...options, outerMargin: 140, innerMargin: 70, rows: 8, columns: 8 }), /Lề quá lớn/);

          (async () => {
            const source = await PDFDocument.create();
            const font = await source.embedFont(StandardFonts.Helvetica);
            for (let i = 0; i < 5; i += 1) {
              const page = source.addPage(i === 1 ? [200, 100] : [200, 260]);
              if (i === 1) page.setRotation(degrees(90));
              page.drawText(`SOLYAN PAGE ${i + 1}`, { x: 20, y: 40, size: 14, font });
              page.drawRectangle({ x: 15 + i * 3, y: 75, width: 30, height: 20 });
            }
            const bytes = await createNUpPdf(await source.save(), options);
            fs.writeFileSync('/tmp/solyan-n-up.pdf', Buffer.from(bytes));

            const output = await PDFDocument.load(bytes);
            assert.equal(output.getPageCount(), 2);
            for (const page of output.getPages()) {
              const size = page.getSize();
              assert.ok(Math.abs(size.width - A4_PORTRAIT.height) < 0.05, size.width);
              assert.ok(Math.abs(size.height - A4_PORTRAIT.width) < 0.05, size.height);
            }
            console.log('N-up plan and real PDF generation ok');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

          qpdf --check /tmp/solyan-n-up.pdf
          test "$(pdfinfo /tmp/solyan-n-up.pdf | awk '/^Pages:/ {print $2}')" = "2"
          pdftotext /tmp/solyan-n-up.pdf /tmp/solyan-n-up.txt
          for page in 1 2 3 4 5; do grep -q "SOLYAN PAGE ${page}" /tmp/solyan-n-up.txt; done

      - name: Remove temporary compiled helper
        if: always()
        run: rm -rf .tmp-nup
