name: Benchmark Tooling CI

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'engines/ocr-service/benchmark.py'
      - '.github/workflows/benchmark-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'benchmarks/**'
      - 'engines/ocr-service/benchmark.py'
      - '.github/workflows/benchmark-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install benchmark dependencies
        run: pip install -r benchmarks/requirements.txt

      - name: Compile benchmark tools
        run: python -m compileall benchmarks engines/ocr-service/benchmark.py

      - name: Generate controlled PDF-to-Office corpus
        run: |
          python benchmarks/generate_pdf_to_office_corpus.py \
            --manifest benchmarks/corpora/pdf_to_office_synthetic_v1.json \
            --output-dir /tmp/pdf-to-office-corpus

      - name: Validate controlled corpus coverage
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from pypdf import PdfReader

          manifest = json.loads(Path('benchmarks/corpora/pdf_to_office_synthetic_v1.json').read_text())
          cases = manifest['cases']
          assert len(cases) == 18, len(cases)
          assert Counter(case['target'] for case in cases) == {'docx': 6, 'xlsx': 6, 'pptx': 6}
          assert len({case['id'] for case in cases}) == len(cases)
          assert len({case['filename'] for case in cases}) == len(cases)
          for case in cases:
              path = Path('/tmp/pdf-to-office-corpus') / case['filename']
              data = path.read_bytes()
              assert data.startswith(b'%PDF-'), path
              assert len(data) > 1000, (path, len(data))
              assert len(PdfReader(path).pages) >= 1, path
          print({'version': manifest['version'], 'cases': len(cases)})
          PY

      - name: Smoke test corpus aggregation
        run: |
          PYTHONPATH=benchmarks python - <<'PY'
          from run_pdf_to_office_corpus import _summary
          sample = [
              {'target': 'docx', 'average_similarity': 90, 'source_pages': 1, 'roundtrip_pages': 1, 'page_count_match': True, 'unmatched_pages': 0, 'geometry_normalized_pages': 1, 'geometry_mismatches': 0, 'convert_seconds': 1, 'roundtrip_seconds': 1},
              {'target': 'docx', 'average_similarity': 80, 'source_pages': 1, 'roundtrip_pages': 1, 'page_count_match': True, 'unmatched_pages': 0, 'geometry_normalized_pages': 0, 'geometry_mismatches': 0, 'convert_seconds': 1, 'roundtrip_seconds': 1},
              {'target': 'pptx', 'average_similarity': 70, 'source_pages': 1, 'roundtrip_pages': 2, 'page_count_match': False, 'unmatched_pages': 1, 'geometry_normalized_pages': 0, 'geometry_mismatches': 1, 'convert_seconds': 1, 'roundtrip_seconds': 1},
          ]
          result = _summary(sample)
          assert result['cases'] == 3
          assert result['targets']['docx']['average_similarity'] == 85
          assert result['minimum_similarity'] == 70
          assert result['page_count_mismatches'] == 1
          assert result['unmatched_pages'] == 1
          assert result['geometry_normalized_pages'] == 1
          assert result['geometry_mismatches'] == 1
          assert result['targets']['docx']['geometry_normalized_pages'] == 1
          assert result['targets']['pptx']['geometry_mismatches'] == 1
          print(result)
          PY

      - name: Smoke test visual similarity on identical PDF
        run: |
          python - <<'PY'
          import io
          import importlib.util
          from pypdf import PdfWriter

          spec = importlib.util.spec_from_file_location('bench', 'benchmarks/pdf_to_office.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          buffer = io.BytesIO()
          writer = PdfWriter()
          writer.add_blank_page(width=595, height=842)
          writer.write(buffer)
          pdf = buffer.getvalue()
          result = module.visual_similarity(pdf, pdf)
          assert result['average_similarity'] == 100.0, result
          assert result['source_pages'] == result['roundtrip_pages'] == 1
          assert result['page_count_match'] is True
          assert result['unmatched_pages'] == 0
          assert result['geometry_normalized_pages'] == 0
          assert result['geometry_mismatches'] == 0
          print(result)
          PY

      - name: Smoke test visual similarity penalizes extra pages
        run: |
          python - <<'PY'
          import io
          import importlib.util
          from pypdf import PdfWriter

          spec = importlib.util.spec_from_file_location('bench', 'benchmarks/pdf_to_office.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def make_pdf(pages: int) -> bytes:
              buffer = io.BytesIO()
              writer = PdfWriter()
              for _ in range(pages):
                  writer.add_blank_page(width=595, height=842)
              writer.write(buffer)
              return buffer.getvalue()

          result = module.visual_similarity(make_pdf(1), make_pdf(2))
          assert result['source_pages'] == 1
          assert result['roundtrip_pages'] == 2
          assert result['compared_pages'] == 1
          assert result['unmatched_pages'] == 1
          assert result['page_count_match'] is False
          assert result['page_similarity'] == [100.0, 0.0], result
          assert result['average_similarity'] == 50.0, result
          print(result)
          PY

      - name: Smoke test visual similarity tolerates raster rounding only
        run: |
          python - <<'PY'
          import io
          import importlib.util
          from pypdf import PdfWriter

          spec = importlib.util.spec_from_file_location('bench', 'benchmarks/pdf_to_office.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def make_pdf(width: float, height: float) -> bytes:
              buffer = io.BytesIO()
              writer = PdfWriter()
              writer.add_blank_page(width=width, height=height)
              writer.write(buffer)
              return buffer.getvalue()

          rounded = module.visual_similarity(make_pdf(595, 842), make_pdf(596, 842))
          assert rounded['geometry_normalized_pages'] == 1, rounded
          assert rounded['geometry_mismatches'] == 0, rounded
          assert rounded['average_similarity'] == 100.0, rounded

          rotated = module.visual_similarity(make_pdf(595, 842), make_pdf(842, 595))
          assert rotated['geometry_normalized_pages'] == 0, rotated
          assert rotated['geometry_mismatches'] == 1, rotated
          assert rotated['average_similarity'] == 0.0, rotated
          print({'rounded': rounded, 'rotated': rotated})
          PY
