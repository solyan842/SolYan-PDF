name: Remove Annotations CI

on:
  pull_request:
    paths:
      - 'backend/app/remove_annotations.py'
      - 'backend/app/sanitize.py'
      - 'backend/app/main.py'
      - 'frontend/app/remove-annotations/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/remove-annotations-ci.yml'
      - 'docs/ROADMAP.md'
  push:
    branches: [main]
    paths:
      - 'backend/app/remove_annotations.py'
      - 'backend/app/sanitize.py'
      - 'backend/app/main.py'
      - 'frontend/app/remove-annotations/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/remove-annotations-ci.yml'
      - 'docs/ROADMAP.md'

jobs:
  remove-annotations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qpdf
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Build mixed annotation fixture
        run: |
          cat >/tmp/annotations.json <<'JSON'
          {
            "qpdf": [
              {"jsonversion":2,"pdfversion":"1.7"},
              {
                "obj:1 0 R":{"value":{"/Type":"/Catalog","/Pages":"2 0 R","/AcroForm":{"/Fields":["9 0 R"]}}},
                "obj:2 0 R":{"value":{"/Type":"/Pages","/Count":1,"/Kids":["3 0 R"]}},
                "obj:3 0 R":{"value":{"/Type":"/Page","/Parent":"2 0 R","/MediaBox":[0,0,612,792],"/Annots":["4 0 R","5 0 R","6 0 R","7 0 R","8 0 R","9 0 R"]}},
                "obj:4 0 R":{"value":{"/Type":"/Annot","/Subtype":"/Text","/Rect":[10,10,30,30],"/Contents":"u:note"}},
                "obj:5 0 R":{"value":{"/Type":"/Annot","/Subtype":"/Highlight","/Rect":[40,40,140,60],"/QuadPoints":[40,60,140,60,40,40,140,40]}},
                "obj:6 0 R":{"value":{"/Type":"/Annot","/Subtype":"/Popup","/Rect":[150,40,250,140],"/Parent":"4 0 R"}},
                "obj:7 0 R":{"value":{"/Type":"/Annot","/Subtype":"/Link","/Rect":[10,100,200,120],"/A":{"/S":"/URI","/URI":"u:https://example.com/"}}},
                "obj:8 0 R":{"value":{"/Type":"/Annot","/Subtype":"/FileAttachment","/Rect":[10,140,30,160],"/FS":"10 0 R"}},
                "obj:9 0 R":{"value":{"/Type":"/Annot","/Subtype":"/Widget","/FT":"/Tx","/T":"u:Name","/Rect":[10,200,220,225],"/P":"3 0 R"}},
                "obj:10 0 R":{"value":{"/Type":"/Filespec","/F":"u:sample.txt"}},
                "trailer":{"value":{"/Root":"1 0 R","/Size":11}}
              }
            ]
          }
          JSON
          qpdf --json-input /tmp/annotations.json /tmp/annotations.pdf
          qpdf --check /tmp/annotations.pdf

      - name: Verify safe comment mode preserves forms and non-comment annotations
        env:
          PYTHONPATH: backend
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          from app.remove_annotations import _remove_annotations
          stats = _remove_annotations(Path('/tmp/annotations.pdf'), Path('/tmp/safe.pdf'), False)
          assert stats.comments_removed == 3, stats
          assert stats.other_annotations_removed == 0, stats
          assert stats.widgets_preserved == 1, stats
          PY
          qpdf --check /tmp/safe.pdf
          qpdf --json-output /tmp/safe.pdf /tmp/safe.json
          python <<'PY'
          import json
          data=json.load(open('/tmp/safe.json'))
          objs=data['qpdf'][1]
          page=next(v['value'] for k,v in objs.items() if k.startswith('obj:') and isinstance(v,dict) and isinstance(v.get('value'),dict) and v['value'].get('/Type')=='/Page')
          def subtype(ref): return objs[f'obj:{ref}']['value'].get('/Subtype')
          subtypes=[subtype(ref) for ref in page['/Annots']]
          assert subtypes == ['/Link','/FileAttachment','/Widget'], subtypes
          trailer=objs['trailer']['value']; root=objs[f"obj:{trailer['/Root']}"]['value']
          fields=root['/AcroForm']['/Fields']
          assert len(fields)==1 and subtype(fields[0])=='/Widget'
          print('safe mode preserves Link, FileAttachment and Widget/AcroForm')
          PY

      - name: Verify all-non-widget mode keeps form widget only
        env:
          PYTHONPATH: backend
        run: |
          python <<'PY'
          from pathlib import Path
          from app.remove_annotations import _remove_annotations
          stats = _remove_annotations(Path('/tmp/annotations.pdf'), Path('/tmp/all-non-widget.pdf'), True)
          assert stats.comments_removed == 3, stats
          assert stats.other_annotations_removed == 2, stats
          assert stats.widgets_preserved == 1, stats
          PY
          qpdf --check /tmp/all-non-widget.pdf
          qpdf --json-output /tmp/all-non-widget.pdf /tmp/all.json
          python <<'PY'
          import json
          data=json.load(open('/tmp/all.json'))
          objs=data['qpdf'][1]
          page=next(v['value'] for k,v in objs.items() if k.startswith('obj:') and isinstance(v,dict) and isinstance(v.get('value'),dict) and v['value'].get('/Type')=='/Page')
          annots=page.get('/Annots',[])
          assert len(annots)==1
          widget=objs[f"obj:{annots[0]}"]['value']
          assert widget.get('/Subtype')=='/Widget'
          trailer=objs['trailer']['value']; root=objs[f"obj:{trailer['/Root']}"]['value']
          assert root['/AcroForm']['/Fields']==annots
          print('all-non-widget mode preserves exactly the Widget/AcroForm field')
          PY
