name: Color Transform CI

on:
  pull_request:
    paths:
      - 'frontend/lib/color-transform.ts'
      - 'frontend/app/color-transform/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/color-transform-ci.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/ROADMAP.md'
  push:
    branches:
      - main
    paths:
      - 'frontend/lib/color-transform.ts'
      - 'frontend/app/color-transform/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/color-transform-ci.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/ROADMAP.md'

jobs:
  color-transform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Compile pure pixel transform for regression
        run: |
          rm -rf .tmp-color-transform-ci
          npx tsc lib/color-transform.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --skipLibCheck \
            --outDir .tmp-color-transform-ci

      - name: Gate exact RGBA transforms and alpha preservation
        run: |
          set -euo pipefail
          node <<'NODE' 2>&1 | tee /tmp/color-transform-ci.log
          const assert = require('node:assert/strict');
          const { transformRgba, luminance, parseRgbHex } = require('./.tmp-color-transform-ci/color-transform.js');

          const pixel = (...values) => new Uint8ClampedArray(values);
          const array = (value) => Array.from(value);

          assert.equal(luminance(255, 0, 0), 54);
          assert.deepEqual(parseRgbHex('#12abEF', { r: 0, g: 0, b: 0 }), { r: 18, g: 171, b: 239 });

          assert.deepEqual(
            array(transformRgba(pixel(10, 20, 30, 77), { mode: 'invert' })),
            [245, 235, 225, 77],
          );
          assert.deepEqual(
            array(transformRgba(pixel(255, 0, 0, 88), { mode: 'grayscale' })),
            [54, 54, 54, 88],
          );

          const darkLight = pixel(20, 20, 20, 255, 240, 240, 240, 128);
          assert.deepEqual(
            array(transformRgba(darkLight, { mode: 'white-on-black', threshold: 160 })),
            [255, 255, 255, 255, 0, 0, 0, 128],
          );
          assert.deepEqual(
            array(transformRgba(darkLight, { mode: 'black-on-white', threshold: 160 })),
            [0, 0, 0, 255, 255, 255, 255, 128],
          );
          assert.deepEqual(
            array(transformRgba(darkLight, { mode: 'yellow-on-black', threshold: 160 })),
            [255, 230, 0, 255, 0, 0, 0, 128],
          );
          assert.deepEqual(
            array(transformRgba(darkLight, {
              mode: 'custom',
              threshold: 160,
              textColor: '#123456',
              backgroundColor: '#abcdef',
            })),
            [18, 52, 86, 255, 171, 205, 239, 128],
          );

          console.log('RGBA transform semantics + alpha preservation: PASS');
          NODE

      - name: Gate explicit rasterized product boundary and bounded pipeline
        run: |
          set -euo pipefail
          grep -q 'CORE PDF · V1.2 · RASTERIZED' app/color-transform/page.tsx
          grep -q 'không giữ text/vector/form/annotation tương tác' app/color-transform/page.tsx
          grep -q 'MAX_PAGE_COUNT = 100' app/color-transform/page.tsx
          grep -q 'MAX_SINGLE_PAGE_PIXELS = 25_000_000' app/color-transform/page.tsx
          grep -q 'MAX_TOTAL_PIXELS = 250_000_000' app/color-transform/page.tsx
          grep -q "page.render({ canvas, canvasContext: context, viewport, background: '#ffffff' })" app/color-transform/page.tsx
          grep -q 'output.embedPng' app/color-transform/page.tsx
          grep -q "href: '/color-transform'" app/page.tsx
          echo 'rasterized boundary + bounded browser pipeline: PASS' | tee -a /tmp/color-transform-ci.log

      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Upload Color Transform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: color-transform-ci-evidence
          path: /tmp/color-transform-ci.log
          if-no-files-found: warn
          retention-days: 14
