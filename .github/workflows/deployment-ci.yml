name: Deployment CI

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - '.env.example'
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/Dockerfile'
      - 'backend/requirements.hashes'
      - 'engines/**/Dockerfile'
      - 'engines/**/requirements.hashes'
      - 'engines/**/requirements.lock'
      - 'engines/**/paddle-requirements.lock'
      - '.github/workflows/deployment-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
      - '.env.example'
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/Dockerfile'
      - 'backend/requirements.hashes'
      - 'engines/**/Dockerfile'
      - 'engines/**/requirements.hashes'
      - 'engines/**/requirements.lock'
      - 'engines/**/paddle-requirements.lock'
      - '.github/workflows/deployment-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Build complete default stack
        run: docker compose --env-file .env.example build
