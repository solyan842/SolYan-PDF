name: Deployment CI

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - '.env.example'
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/Dockerfile'
      - 'backend/requirements.hashed.lock'
      - 'engines/**/Dockerfile'
      - 'engines/**/requirements.hashed.lock'
      - 'engines/**/requirements.lock'
      - 'engines/**/paddle-requirements.lock'
      - '.github/workflows/deployment-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
      - '.env.example'
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/Dockerfile'
      - 'backend/requirements.hashed.lock'
      - 'engines/**/Dockerfile'
      - 'engines/**/requirements.hashed.lock'
      - 'engines/**/requirements.lock'
      - 'engines/**/paddle-requirements.lock'
      - '.github/workflows/deployment-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Build complete default stack
        run: docker compose --env-file .env.example build

      - name: Start stack and wait for health
        run: docker compose --env-file .env.example up -d --wait --wait-timeout 240

      - name: Smoke public endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          docker compose --env-file .env.example ps

      - name: Collect logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color --tail=300

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans
