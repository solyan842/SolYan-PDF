name: Extract Images CI

on:
  pull_request:
    paths:
      - 'backend/app/extract_images.py'
      - 'backend/app/main.py'
      - 'backend/Dockerfile'
      - 'frontend/app/extract-images/**'
      - 'frontend/components/ServerPdfTool.tsx'
      - 'frontend/app/page.tsx'
      - '.github/workflows/extract-images-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/extract_images.py'
      - 'backend/app/main.py'
      - 'backend/Dockerfile'
      - 'frontend/app/extract-images/**'
      - 'frontend/components/ServerPdfTool.tsx'
      - 'frontend/app/page.tsx'
      - '.github/workflows/extract-images-ci.yml'

jobs:
  extract-images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfimages -v

      - name: Install backend dependencies
        run: |
          python -m pip install --require-hashes -r requirements.hashed.lock
          python -m pip install --no-deps -r requirements.txt
          python -m pip check

      - name: Verify real embedded-image extraction
        run: |
          python - <<'PY'
          import io
          import zipfile

          from fastapi.testclient import TestClient

          from app.extract_images import _image_dimensions
          from app.main import app

          def pdf_with_raw_rgb_image() -> bytes:
              image = bytes([255, 0, 0])
              content = b'q\n20 0 0 20 10 10 cm\n/Im0 Do\nQ\n'
              objects = [
                  b'1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n',
                  b'2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n',
                  b'3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 40 40] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\nendobj\n',
                  b'4 0 obj\n<< /Length ' + str(len(content)).encode() + b' >>\nstream\n' + content + b'endstream\nendobj\n',
                  b'5 0 obj\n<< /Type /XObject /Subtype /Image /Width 1 /Height 1 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Length 3 >>\nstream\n' + image + b'\nendstream\nendobj\n',
              ]
              data = bytearray(b'%PDF-1.4\n%\xe2\xe3\xcf\xd3\n')
              offsets = [0]
              for obj in objects:
                  offsets.append(len(data))
                  data.extend(obj)
              xref = len(data)
              data.extend(f'xref\n0 {len(objects) + 1}\n'.encode())
              data.extend(b'0000000000 65535 f \n')
              for offset in offsets[1:]:
                  data.extend(f'{offset:010d} 00000 n \n'.encode())
              data.extend(f'trailer\n<< /Size {len(objects) + 1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
              return bytes(data)

          def empty_pdf() -> bytes:
              content = b''
              objects = [
                  b'1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n',
                  b'2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n',
                  b'3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 40 40] /Contents 4 0 R >>\nendobj\n',
                  b'4 0 obj\n<< /Length 0 >>\nstream\n\nendstream\nendobj\n',
              ]
              data = bytearray(b'%PDF-1.4\n')
              offsets = [0]
              for obj in objects:
                  offsets.append(len(data))
                  data.extend(obj)
              xref = len(data)
              data.extend(f'xref\n0 {len(objects) + 1}\n'.encode())
              data.extend(b'0000000000 65535 f \n')
              for offset in offsets[1:]:
                  data.extend(f'{offset:010d} 00000 n \n'.encode())
              data.extend(f'trailer\n<< /Size {len(objects) + 1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
              return bytes(data)

          assert _image_dimensions('page num type width height color comp bpc enc interp object ID x-ppi y-ppi size ratio\n1 0 image 10 20 rgb 3 8 image no 5 0 72 72 10B 1%') == [(10, 20)]

          client = TestClient(app)
          response = client.post(
              '/pdf/extract-images',
              files={'file': ('image.pdf', pdf_with_raw_rgb_image(), 'application/pdf')},
          )
          assert response.status_code == 200, response.text
          assert response.headers['content-type'].startswith('application/zip')
          assert int(response.headers['x-solyan-extracted-images']) >= 1
          with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
              names = archive.namelist()
              assert names, names
              pngs = [name for name in names if name.endswith('.png')]
              assert pngs, names
              assert archive.read(pngs[0]).startswith(b'\x89PNG\r\n\x1a\n')

          no_images = client.post(
              '/pdf/extract-images',
              files={'file': ('empty.pdf', empty_pdf(), 'application/pdf')},
          )
          assert no_images.status_code == 422, no_images.text

          invalid = client.post(
              '/pdf/extract-images',
              files={'file': ('bad.pdf', b'not-pdf', 'application/pdf')},
          )
          assert invalid.status_code == 400, invalid.text
          print('real Poppler embedded-image extraction ok')
          PY
