name: WebDAV Storage CI

on:
  pull_request:
    paths:
      - 'backend/app/webdav_storage.py'
      - 'backend/app/main.py'
      - 'scripts/webdav_storage_contract_smoke.py'
      - 'frontend/app/cloud-storage/**'
      - '.env.example'
      - 'docs/V1.8-WEBDAV-STORAGE.md'
      - '.github/workflows/webdav-storage-ci.yml'
  push:
    branches:
      - main
      - 'feat/v1.8-webdav-storage'
    paths:
      - 'backend/app/webdav_storage.py'
      - 'backend/app/main.py'
      - 'scripts/webdav_storage_contract_smoke.py'
      - 'frontend/app/cloud-storage/**'
      - '.env.example'
      - 'docs/V1.8-WEBDAV-STORAGE.md'
      - '.github/workflows/webdav-storage-ci.yml'
  workflow_dispatch:

jobs:
  webdav-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install hash-verified backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r backend/requirements.hashed.lock
          python -m pip install --no-deps -r backend/requirements.txt
          python -m pip check

      - name: Compile WebDAV adapter and contract gate
        run: |
          set -euo pipefail
          python -m compileall \
            backend/app/webdav_storage.py \
            backend/app/main.py \
            scripts/webdav_storage_contract_smoke.py

      - name: Run deterministic mock-WebDAV contract gate
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/solyan-webdav
          python scripts/webdav_storage_contract_smoke.py 2>&1 | tee /tmp/solyan-webdav/contract.log

      - name: Gate credential and route wiring
        run: |
          set -euo pipefail
          grep -q 'from .webdav_storage import router as webdav_storage_router' backend/app/main.py
          grep -q 'app.include_router(webdav_storage_router)' backend/app/main.py
          grep -q 'WEBDAV_BASE_URL=' .env.example
          grep -q 'WEBDAV_USERNAME=' .env.example
          grep -q 'WEBDAV_PASSWORD=' .env.example
          grep -q 'auth_mode.*server-configured' backend/app/webdav_storage.py
          grep -q 'If-None-Match' backend/app/webdav_storage.py
          grep -q "'google' | 'onedrive' | 'webdav'" frontend/app/cloud-storage/page.tsx
          if grep -Eiq '(WEBDAV_PASSWORD|WEBDAV_USERNAME).*(localStorage|sessionStorage)' frontend/app/cloud-storage/page.tsx; then
            echo 'Browser WebDAV UI appears to persist a provider credential' >&2
            exit 1
          fi
          echo 'WebDAV route/credential boundary: PASS' | tee -a /tmp/solyan-webdav/contract.log

      - name: Upload WebDAV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdav-storage-evidence
          path: /tmp/solyan-webdav/contract.log
          if-no-files-found: warn
          retention-days: 14

  webdav-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          set -euo pipefail
          npm ci
          npm run build
