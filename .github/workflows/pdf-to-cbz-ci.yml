name: PDF to CBZ CI

on:
  pull_request:
    paths:
      - 'backend/app/pdf_to_cbz.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-cbz/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-cbz-ci.yml'
      - 'docs/V1.3-PARITY-AUDIT.md'
  push:
    branches:
      - main
    paths:
      - 'backend/app/pdf_to_cbz.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-cbz/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-cbz-ci.yml'
      - 'docs/V1.3-PARITY-AUDIT.md'

jobs:
  pdf-to-cbz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install Poppler and backend test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
          pdftoppm -v 2>&1 | tee /tmp/pdftoppm-version.log
          pdfinfo -v 2>&1 | tee /tmp/pdfinfo-version.log
          python -m pip install --require-hashes -r backend/requirements.hashed.lock
          python -m pip install --no-deps -r backend/requirements.txt
          python -m pip install httpx==0.28.1 pypdf==6.1.1
          python -m pip check

      - name: Compile backend PDF to CBZ path
        run: python -m compileall backend/app

      - name: Gate CBZ page order, range and DPI
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/solyan-pdf-to-cbz
          python <<'PY' 2>&1 | tee /tmp/solyan-pdf-to-cbz/gate.log
          import io
          import struct
          import zipfile
          from pathlib import Path

          from fastapi.testclient import TestClient
          from pypdf import PdfWriter
          from pypdf.generic import DecodedStreamObject, DictionaryObject, NameObject

          from app.main import app

          root = Path('/tmp/solyan-pdf-to-cbz')
          fixture = root / 'fixture.pdf'
          writer = PdfWriter()

          for index in range(1, 13):
              page = writer.add_blank_page(width=300, height=300)
              font = DictionaryObject({
                  NameObject('/Type'): NameObject('/Font'),
                  NameObject('/Subtype'): NameObject('/Type1'),
                  NameObject('/BaseFont'): NameObject('/Helvetica'),
              })
              font_ref = writer._add_object(font)
              page[NameObject('/Resources')] = DictionaryObject({
                  NameObject('/Font'): DictionaryObject({NameObject('/F1'): font_ref}),
              })
              stream = DecodedStreamObject()
              stream.set_data(f'BT /F1 28 Tf 70 150 Td (PAGE-{index:02d}) Tj ET'.encode('ascii'))
              page[NameObject('/Contents')] = writer._add_object(stream)

          with fixture.open('wb') as handle:
              writer.write(handle)

          client = TestClient(app)
          source = fixture.read_bytes()

          response = client.post(
              '/pdf/to-cbz',
              files={'file': ('fixture.pdf', source, 'application/pdf')},
              data={'dpi': '150'},
          )
          assert response.status_code == 200, response.text
          assert response.headers['content-type'].startswith('application/vnd.comicbook+zip'), response.headers
          assert response.headers['x-solyan-cbz-pages'] == '12', response.headers
          assert response.headers['x-solyan-cbz-dpi'] == '150', response.headers
          root.joinpath('all.cbz').write_bytes(response.content)

          with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
              names = archive.namelist()
              assert names == [f'page_{index:03d}.png' for index in range(1, 13)], names
              first = archive.read(names[0])
              last = archive.read(names[-1])
              assert first.startswith(b'\x89PNG\r\n\x1a\n')
              assert last.startswith(b'\x89PNG\r\n\x1a\n')
              width, height = struct.unpack('>II', first[16:24])
              assert (width, height) == (625, 625), (width, height)

          ranged = client.post(
              '/pdf/to-cbz',
              files={'file': ('fixture.pdf', source, 'application/pdf')},
              data={'dpi': '96', 'first_page': '10', 'last_page': '12'},
          )
          assert ranged.status_code == 200, ranged.text
          assert ranged.headers['x-solyan-cbz-pages'] == '3', ranged.headers
          with zipfile.ZipFile(io.BytesIO(ranged.content)) as archive:
              assert archive.namelist() == ['page_001.png', 'page_002.png', 'page_003.png']
              png = archive.read('page_001.png')
              width, height = struct.unpack('>II', png[16:24])
              assert (width, height) == (400, 400), (width, height)
          root.joinpath('range.cbz').write_bytes(ranged.content)

          invalid = client.post(
              '/pdf/to-cbz',
              files={'file': ('fixture.pdf', source, 'application/pdf')},
              data={'first_page': '5', 'last_page': '3'},
          )
          assert invalid.status_code == 422, invalid.text
          print('CBZ page order/range/DPI gate: PASS')
          PY

      - name: Gate encrypted PDF password handling
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          qpdf --encrypt cbz-pass owner-pass 256 -- /tmp/solyan-pdf-to-cbz/fixture.pdf /tmp/solyan-pdf-to-cbz/encrypted.pdf
          python <<'PY' 2>&1 | tee -a /tmp/solyan-pdf-to-cbz/gate.log
          import io
          import zipfile
          from pathlib import Path
          from fastapi.testclient import TestClient
          from app.main import app

          root = Path('/tmp/solyan-pdf-to-cbz')
          encrypted = root.joinpath('encrypted.pdf').read_bytes()
          client = TestClient(app)

          ok = client.post(
              '/pdf/to-cbz',
              files={'file': ('encrypted.pdf', encrypted, 'application/pdf')},
              data={'password': 'cbz-pass', 'first_page': '1', 'last_page': '2', 'dpi': '96'},
          )
          assert ok.status_code == 200, ok.text
          with zipfile.ZipFile(io.BytesIO(ok.content)) as archive:
              assert archive.namelist() == ['page_001.png', 'page_002.png']

          bad = client.post(
              '/pdf/to-cbz',
              files={'file': ('encrypted.pdf', encrypted, 'application/pdf')},
              data={'password': 'wrong-pass', 'first_page': '1', 'last_page': '1'},
          )
          assert bad.status_code == 401, (bad.status_code, bad.text)
          print('encrypted password handling: PASS')
          PY

      - name: Gate product wiring and explicit raster boundary
        run: |
          set -euo pipefail
          grep -q 'from .pdf_to_cbz import router as pdf_to_cbz_router' backend/app/main.py
          grep -q 'app.include_router(pdf_to_cbz_router)' backend/app/main.py
          grep -q '/pdf/to-cbz' frontend/app/pdf-to-cbz/page.tsx
          grep -q "href: '/pdf-to-cbz'" frontend/app/page.tsx
          grep -q 'rasterize trang PDF' frontend/app/pdf-to-cbz/page.tsx
          grep -q 'poppler-utils' backend/Dockerfile
          echo 'route/UI/existing Poppler dependency/raster boundary wiring: PASS' | tee -a /tmp/solyan-pdf-to-cbz/gate.log

      - name: Upload PDF to CBZ evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-cbz-evidence
          path: |
            /tmp/solyan-pdf-to-cbz/gate.log
            /tmp/solyan-pdf-to-cbz/fixture.pdf
            /tmp/solyan-pdf-to-cbz/encrypted.pdf
            /tmp/solyan-pdf-to-cbz/all.cbz
            /tmp/solyan-pdf-to-cbz/range.cbz
            /tmp/pdftoppm-version.log
            /tmp/pdfinfo-version.log
          if-no-files-found: warn
          retention-days: 14
