name: Bookmarks Outline CI

on:
  pull_request:
    paths:
      - 'frontend/lib/bookmarks.ts'
      - 'frontend/app/bookmarks/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/bookmarks-outline-ci.yml'
      - 'docs/ROADMAP.md'
  push:
    branches:
      - main
    paths:
      - 'frontend/lib/bookmarks.ts'
      - 'frontend/app/bookmarks/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/bookmarks-outline-ci.yml'
      - 'docs/ROADMAP.md'

jobs:
  bookmarks-outline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          qpdf --version

      - name: Compile bookmark helper
        run: |
          rm -rf .tmp-bookmarks
          npx tsc lib/bookmarks.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --noEmit false \
            --outDir .tmp-bookmarks

      - name: Verify bookmark round-trip and removal
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { PDFDocument, StandardFonts } = require('pdf-lib');
          const { extractPdfBookmarks, setPdfBookmarks } = require('./.tmp-bookmarks/bookmarks.js');

          (async () => {
            const source = await PDFDocument.create();
            const font = await source.embedFont(StandardFonts.Helvetica);
            for (let i = 0; i < 3; i += 1) {
              const page = source.addPage([300, 200]);
              page.drawText(`PAGE ${i + 1}`, { x: 20, y: 100, size: 16, font });
            }
            const sourceBytes = await source.save();
            assert.deepEqual(await extractPdfBookmarks(sourceBytes), []);

            const requested = [
              {
                title: 'Mở đầu',
                pageNumber: 1,
                children: [
                  { title: 'Chương Hai – tiếng Việt', pageNumber: 2, children: [] },
                ],
              },
              { title: 'Kết thúc', pageNumber: 999, children: [] },
            ];
            const expected = [
              {
                title: 'Mở đầu',
                pageNumber: 1,
                children: [
                  { title: 'Chương Hai – tiếng Việt', pageNumber: 2, children: [] },
                ],
              },
              { title: 'Kết thúc', pageNumber: 3, children: [] },
            ];

            const withOutline = await setPdfBookmarks(sourceBytes, requested);
            fs.writeFileSync('/tmp/solyan-bookmarks.pdf', Buffer.from(withOutline));
            assert.deepEqual(await extractPdfBookmarks(withOutline), expected);

            const rewritten = await setPdfBookmarks(withOutline, [
              { title: 'Thay thế', pageNumber: -9, children: [] },
            ]);
            fs.writeFileSync('/tmp/solyan-bookmarks-replaced.pdf', Buffer.from(rewritten));
            assert.deepEqual(await extractPdfBookmarks(rewritten), [
              { title: 'Thay thế', pageNumber: 1, children: [] },
            ]);

            const cleared = await setPdfBookmarks(rewritten, []);
            fs.writeFileSync('/tmp/solyan-bookmarks-cleared.pdf', Buffer.from(cleared));
            assert.deepEqual(await extractPdfBookmarks(cleared), []);
            console.log('bookmark outline round-trip ok');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

          qpdf --check /tmp/solyan-bookmarks.pdf
          qpdf --check /tmp/solyan-bookmarks-replaced.pdf
          qpdf --check /tmp/solyan-bookmarks-cleared.pdf
          qpdf --json-output /tmp/solyan-bookmarks.pdf /tmp/bookmarks.json
          qpdf --json-output /tmp/solyan-bookmarks-cleared.pdf /tmp/cleared.json

          python <<'PY'
          import json
          full=json.load(open('/tmp/bookmarks.json'))['qpdf'][1]
          trailer=full['trailer']['value']
          root=full[f"obj:{trailer['/Root']}"]['value']
          assert '/Outlines' in root, root
          outline=full[f"obj:{root['/Outlines']}"]['value']
          assert outline['/Type']=='/Outlines'
          assert outline['/Count']==3, outline
          first=full[f"obj:{outline['/First']}"]['value']
          last=full[f"obj:{outline['/Last']}"]['value']
          assert first['/Next']==outline['/Last']
          assert last['/Prev']==outline['/First']
          assert '/First' in first and '/Last' in first and first['/Count']==1

          cleared=json.load(open('/tmp/cleared.json'))['qpdf'][1]
          trailer2=cleared['trailer']['value']
          root2=cleared[f"obj:{trailer2['/Root']}"]['value']
          assert '/Outlines' not in root2, root2
          print('qpdf outline object graph ok')
          PY

      - name: Remove temporary compiled helper
        if: always()
        run: rm -rf .tmp-bookmarks
