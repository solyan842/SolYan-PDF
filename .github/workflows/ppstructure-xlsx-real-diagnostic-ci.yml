name: PP-Structure Scanned XLSX Real-World Diagnostic

on:
  push:
    branches:
      - benchmark/ppstructure-xlsx-real-diagnostic-v1
    paths:
      - 'engines/ocr-service/**'
      - 'engines/office-service/**'
      - 'benchmarks/**'
      - '.github/workflows/ppstructure-xlsx-real-diagnostic-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

env:
  REAL_MANIFEST: benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json

jobs:
  materialize-corpus:
    name: corpus / ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case_id:
          - xlsx-table-material
          - xlsx-unidentified-table
          - xlsx-transport-table
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install corpus verification dependencies
        run: pip install pypdf==6.1.1 cryptography==46.0.3

      - name: Fetch, verify and materialize one pinned scan
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/scan-xlsx-case"
          mkdir -p "$stage/corpus" "$stage/inventory"
          python benchmarks/fetch_pdf_to_office_real_corpus.py \
            --manifest "$REAL_MANIFEST" \
            --case-id "${{ matrix.case_id }}" \
            --output-dir "$stage/corpus" \
            --output-inventory "$stage/inventory/${{ matrix.case_id }}.json"

      - name: Upload verified scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppstructure-xlsx-real-case-${{ matrix.case_id }}
          path: ${{ runner.temp }}/scan-xlsx-case/
          if-no-files-found: error
          retention-days: 7

  diagnostic:
    name: PP-Structure scanned XLSX diagnostic
    needs: materialize-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install diagnostic dependencies
        run: pip install -r benchmarks/requirements.txt openpyxl==3.1.5

      - name: Download verified scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ppstructure-xlsx-real-case-*
          path: /tmp/ppstructure-xlsx-real-stage
          merge-multiple: true

      - name: Assemble and verify three-case scan corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from pypdf import PdfReader

          root = Path('/tmp/ppstructure-xlsx-real-stage')
          corpus_dir = root / 'corpus'
          inventory_dir = root / 'inventory'
          manifest = json.loads(Path('benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json').read_text())
          wanted = ['xlsx-table-material', 'xlsx-unidentified-table', 'xlsx-transport-table']
          cases = {case['id']: case for case in manifest['cases'] if case['id'] in wanted}
          assert set(cases) == set(wanted), sorted(cases)

          inventories = []
          for path in sorted(inventory_dir.glob('*.json')):
              payload = json.loads(path.read_text())
              assert len(payload['cases']) == 1, payload
              inventories.append(payload['cases'][0])

          assert len(inventories) == 3, [item['id'] for item in inventories]
          by_id = {item['id']: item for item in inventories}
          assert set(by_id) == set(wanted), (sorted(by_id), wanted)
          assert sum(int(item['output_pages']) for item in inventories) == 9, inventories

          for case_id in wanted:
              item = by_id[case_id]
              pdf_path = corpus_dir / cases[case_id]['filename']
              assert pdf_path.is_file(), pdf_path
              data = pdf_path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == item['output_sha256'], item
              assert len(PdfReader(pdf_path).pages) == 3, item

          Path('/tmp/ppstructure-xlsx-real-inventory.json').write_text(
              json.dumps({'cases': [by_id[case_id] for case_id in wanted]}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'cases': 3, 'pages': 9, 'ids': wanted}, indent=2))
          PY

      - name: Build OCR and Office services
        run: |
          docker build -t solyan-ocr-xlsx-real engines/ocr-service
          docker build -t solyan-office-xlsx-real engines/office-service

      - name: Start isolated services
        run: |
          docker network create solyan-ppstructure-xlsx-real
          docker run -d --name ocr-xlsx-real --network solyan-ppstructure-xlsx-real -p 8010:8010 \
            -e OCR_LANG=en \
            -e PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True \
            solyan-ocr-xlsx-real
          docker run -d --name office-xlsx-real --network solyan-ppstructure-xlsx-real -p 8020:8020 \
            solyan-office-xlsx-real

      - name: Wait for services
        run: |
          python - <<'PY'
          import time
          import urllib.request

          urls = ['http://127.0.0.1:8010/health', 'http://127.0.0.1:8020/health']
          deadline = time.monotonic() + 180
          for url in urls:
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if 200 <= response.status < 300:
                              print(url, response.read().decode('utf-8', 'replace'))
                              break
                  except Exception as exc:
                      if time.monotonic() >= deadline:
                          raise SystemExit(f'health timeout {url}: {exc}')
                      time.sleep(3)
          PY

      - name: Run three-case scanned XLSX diagnostic with preserved log
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/ppstructure-xlsx-real/results /tmp/ppstructure-xlsx-real/logs
          set +e
          PYTHONPATH=benchmarks python - <<'PY' 2>&1 | tee /tmp/ppstructure-xlsx-real/logs/diagnostic.log
          import json
          import time
          from pathlib import Path

          import httpx
          from openpyxl import load_workbook

          from pdf_to_office import visual_similarity

          stage = Path('/tmp/ppstructure-xlsx-real-stage/corpus')
          out_root = Path('/tmp/ppstructure-xlsx-real/results')
          cases = [
              ('xlsx-table-material', 'xlsx-table-material.pdf'),
              ('xlsx-unidentified-table', 'xlsx-unidentified-table.pdf'),
              ('xlsx-transport-table', 'xlsx-transport-table.pdf'),
          ]

          results = []
          with httpx.Client(timeout=httpx.Timeout(2400.0, connect=15.0)) as client:
              for case_id, filename in cases:
                  source_path = stage / filename
                  source = source_path.read_bytes()
                  case_dir = out_root / case_id
                  case_dir.mkdir(parents=True, exist_ok=True)
                  item = {'id': case_id, 'source': filename, 'source_bytes': len(source)}
                  print(f'===== {case_id} =====', flush=True)

                  started = time.perf_counter()
                  try:
                      response = client.post(
                          'http://127.0.0.1:8010/ocr/xlsx',
                          files={'file': (filename, source, 'application/pdf')},
                      )
                  except Exception as exc:
                      item.update({'status': 'ocr_transport_error', 'error': f'{type(exc).__name__}: {exc}'})
                      results.append(item)
                      print(json.dumps(item, ensure_ascii=False), flush=True)
                      continue

                  item['ocr_seconds'] = time.perf_counter() - started
                  item['ocr_http_status'] = response.status_code
                  item['ocr_engine'] = response.headers.get('x-solyan-ocr-engine')
                  item['ocr_reported_pages'] = response.headers.get('x-solyan-ocr-pages')
                  item['ocr_table_workbooks'] = response.headers.get('x-solyan-ocr-table-workbooks')

                  if response.status_code >= 400:
                      item.update({'status': 'ocr_rejected', 'error': response.text[:4000]})
                      results.append(item)
                      print(json.dumps(item, ensure_ascii=False, indent=2), flush=True)
                      continue

                  xlsx_path = case_dir / 'recognized.xlsx'
                  xlsx_path.write_bytes(response.content)
                  item['xlsx_bytes'] = len(response.content)

                  try:
                      wb = load_workbook(xlsx_path, data_only=False)
                      sheets = []
                      nonempty_total = 0
                      try:
                          for ws in wb.worksheets:
                              nonempty = 0
                              preview = []
                              for row in ws.iter_rows():
                                  for cell in row:
                                      if cell.value is None or str(cell.value).strip() == '':
                                          continue
                                      nonempty += 1
                                      if len(preview) < 16:
                                          preview.append({'cell': cell.coordinate, 'value': str(cell.value)[:120]})
                              nonempty_total += nonempty
                              sheets.append({
                                  'title': ws.title,
                                  'max_row': ws.max_row,
                                  'max_column': ws.max_column,
                                  'nonempty_cells': nonempty,
                                  'preview': preview,
                              })
                      finally:
                          wb.close()
                  except Exception as exc:
                      item.update({'status': 'invalid_xlsx', 'error': f'{type(exc).__name__}: {exc}'})
                      results.append(item)
                      print(json.dumps(item, ensure_ascii=False, indent=2), flush=True)
                      continue

                  item['sheet_count'] = len(sheets)
                  item['nonempty_cells'] = nonempty_total
                  item['sheets'] = sheets
                  if not sheets or nonempty_total == 0:
                      item.update({'status': 'empty_xlsx'})
                      results.append(item)
                      print(json.dumps(item, ensure_ascii=False, indent=2), flush=True)
                      continue

                  roundtrip_started = time.perf_counter()
                  try:
                      rt = client.post(
                          'http://127.0.0.1:8020/convert/to-pdf',
                          files={
                              'file': (
                                  'recognized.xlsx',
                                  response.content,
                                  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                              )
                          },
                      )
                  except Exception as exc:
                      item.update({'status': 'roundtrip_transport_error', 'error': f'{type(exc).__name__}: {exc}'})
                      results.append(item)
                      print(json.dumps(item, ensure_ascii=False, indent=2), flush=True)
                      continue

                  item['roundtrip_seconds'] = time.perf_counter() - roundtrip_started
                  item['roundtrip_http_status'] = rt.status_code
                  if rt.status_code >= 400:
                      item.update({'status': 'roundtrip_rejected', 'error': rt.text[:4000]})
                      results.append(item)
                      print(json.dumps(item, ensure_ascii=False, indent=2), flush=True)
                      continue

                  roundtrip_path = case_dir / 'roundtrip.pdf'
                  roundtrip_path.write_bytes(rt.content)
                  item['roundtrip_pdf_bytes'] = len(rt.content)
                  item.update(visual_similarity(source, rt.content))
                  item['status'] = 'measured'
                  results.append(item)
                  print(json.dumps(item, ensure_ascii=False, indent=2), flush=True)

          measured = [item for item in results if item.get('status') == 'measured']
          summary = {
              'corpus_kind': 'public-real-world-diagnostic',
              'release_gate': False,
              'cases': len(results),
              'measured_cases': len(measured),
              'non_measured_cases': len(results) - len(measured),
              'average_similarity_measured': (
                  sum(float(item['average_similarity']) for item in measured) / len(measured)
                  if measured else None
              ),
              'statuses': {status: sum(item.get('status') == status for item in results) for status in sorted({item.get('status') for item in results})},
          }
          report = {'summary': summary, 'results': results}
          Path('/tmp/ppstructure-xlsx-real/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('===== SUMMARY =====', flush=True)
          print(json.dumps(summary, ensure_ascii=False, indent=2), flush=True)

          if len(results) != 3:
              raise SystemExit(f'expected 3 result records, got {len(results)}')
          PY
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > /tmp/ppstructure-xlsx-real/logs/diagnostic.exitcode
          exit "$status"

      - name: Collect service logs
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ppstructure-xlsx-real/logs
          docker logs ocr-xlsx-real > /tmp/ppstructure-xlsx-real/logs/ocr-service.log 2>&1 || true
          docker logs office-xlsx-real > /tmp/ppstructure-xlsx-real/logs/office-service.log 2>&1 || true

      - name: Validate diagnostic report shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/ppstructure-xlsx-real/report.json').read_text())
          summary = report['summary']
          results = report['results']
          assert summary['corpus_kind'] == 'public-real-world-diagnostic', summary
          assert summary['release_gate'] is False, summary
          assert summary['cases'] == 3, summary
          assert len(results) == 3, results
          assert {item['id'] for item in results} == {
              'xlsx-table-material',
              'xlsx-unidentified-table',
              'xlsx-transport-table',
          }
          # This workflow records the real baseline. Recognition/similarity thresholds
          # are deliberately not release-gated until the measured evidence is reviewed.
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppstructure-xlsx-real-diagnostic-v1
          path: |
            /tmp/ppstructure-xlsx-real-inventory.json
            /tmp/ppstructure-xlsx-real/report.json
            /tmp/ppstructure-xlsx-real/results/
            /tmp/ppstructure-xlsx-real/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop services
        if: always()
        run: |
          docker rm -f ocr-xlsx-real office-xlsx-real 2>/dev/null || true
          docker network rm solyan-ppstructure-xlsx-real 2>/dev/null || true
