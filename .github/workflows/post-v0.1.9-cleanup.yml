name: Post v0.1.9 Cleanup

on:
  push:
    branches:
      - chore/post-v0.1.9-cleanup-20261017
    paths:
      - '.github/workflows/post-v0.1.9-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/post-v0.1.9-cleanup-20261017

      - name: Record release and remove one-shot workflows
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text(encoding='utf-8')

          old = '- [x] Pass full service-integration gate with isolated SolYan and external translation runtimes: SolYan proxy -> PDFMathTranslate Flask/Celery/Redis -> local Argos bridge -> bilingual PDF\n\nV1.6 translation implementation is feature-complete for the validated free/local English -> Vietnamese lane. Cloud providers remain optional operator configuration, not V1.6 release prerequisites. Detailed architecture, licensing/privacy boundaries and live evidence are in `docs/V1.6-PDF-TRANSLATION.md`.'
          new = '- [x] Pass full service-integration gate with isolated SolYan and external translation runtimes: SolYan proxy -> PDFMathTranslate Flask/Celery/Redis -> local Argos bridge -> bilingual PDF\n- [x] Close and release V1.6 as SolYan PDF v0.1.9\n\nV1.6 translation is complete and released as v0.1.9 for the validated free/local English -> Vietnamese lane. Cloud providers remain optional operator configuration, not V1.6 release prerequisites. Detailed architecture, licensing/privacy boundaries and live evidence are in `docs/V1.6-PDF-TRANSLATION.md` and `docs/V1.6-CLOSEOUT.md`.'
          if old not in text:
              raise SystemExit('V1.6 roadmap marker not found')
          text = text.replace(old, new, 1)

          old = '- [x] Publish V1.5 OSS-first self-contained parity patch release `v0.1.8`\n- [x] Remove completed `v0.1.8` one-shot publisher after successful publication'
          new = old + '\n- [x] Publish V1.6 Hybrid/local-first PDF translation patch release `v0.1.9`\n- [x] Remove completed `v0.1.9` one-shot publisher after successful publication'
          if old not in text:
              raise SystemExit('release packaging marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/publish-v0.1.9.yml
          rm .github/workflows/post-v0.1.9-cleanup.yml

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md .github/workflows/publish-v0.1.9.yml .github/workflows/post-v0.1.9-cleanup.yml
          git commit -m 'chore: clean up v0.1.9 release publisher'
          git push origin HEAD:chore/post-v0.1.9-cleanup-20261017
