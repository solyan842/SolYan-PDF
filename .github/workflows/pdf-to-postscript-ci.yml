name: PDF to PostScript CI

on:
  pull_request:
    paths:
      - 'backend/app/pdf_to_postscript.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-postscript/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-postscript-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/pdf_to_postscript.py'
      - 'backend/app/main.py'
      - 'frontend/app/pdf-to-postscript/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/pdf-to-postscript-ci.yml'

jobs:
  pdf-to-postscript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install Poppler and hash-verified backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftops -v
          python -m pip install --require-hashes -r backend/requirements.hashed.lock
          python -m pip install --no-deps -r backend/requirements.txt
          python -m pip check

      - name: Compile backend
        run: python -m compileall backend/app

      - name: Gate real PS and EPS conversion through public route
        working-directory: backend
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee /tmp/pdf-to-postscript-ci.log
          from fastapi.testclient import TestClient
          from app.main import app

          def two_page_pdf() -> bytes:
              header = b'%PDF-1.4\n%\xe2\xe3\xcf\xd3\n'
              streams = [
                  b'BT /F1 24 Tf 72 700 Td (PAGE_ONE_842) Tj ET\n',
                  b'BT /F1 24 Tf 72 700 Td (PAGE_TWO_842) Tj ET\n',
              ]
              objects = [
                  b'1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n',
                  b'2 0 obj\n<< /Type /Pages /Kids [3 0 R 4 0 R] /Count 2 >>\nendobj\n',
                  b'3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 6 0 R >>\nendobj\n',
                  b'4 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 400 300] /Resources << /Font << /F1 5 0 R >> >> /Contents 7 0 R >>\nendobj\n',
                  b'5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n',
                  b'6 0 obj\n<< /Length ' + str(len(streams[0])).encode() + b' >>\nstream\n' + streams[0] + b'endstream\nendobj\n',
                  b'7 0 obj\n<< /Length ' + str(len(streams[1])).encode() + b' >>\nstream\n' + streams[1] + b'endstream\nendobj\n',
              ]
              data = bytearray(header)
              offsets = [0]
              for obj in objects:
                  offsets.append(len(data))
                  data.extend(obj)
              xref = len(data)
              data.extend(f'xref\n0 {len(objects) + 1}\n'.encode())
              data.extend(b'0000000000 65535 f \n')
              for offset in offsets[1:]:
                  data.extend(f'{offset:010d} 00000 n \n'.encode())
              data.extend(
                  f'trailer\n<< /Size {len(objects) + 1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode()
              )
              return bytes(data)

          client = TestClient(app)
          source = two_page_pdf()

          ps = client.post(
              '/pdf/to-postscript',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'output_format': 'ps', 'level': '3'},
          )
          assert ps.status_code == 200, ps.text
          assert ps.headers['content-type'].startswith('application/postscript')
          assert ps.headers['content-disposition'] == 'attachment; filename="solyan-pdf.ps"'
          assert ps.headers['x-solyan-postscript-format'] == 'ps'
          assert ps.headers['x-solyan-postscript-level'] == '3'
          assert ps.content.startswith(b'%!PS-Adobe-')
          assert ps.content.count(b'%%Page:') == 2, ps.content[:500]
          assert b'%%LanguageLevel: 3' in ps.content

          ranged = client.post(
              '/pdf/to-postscript',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'output_format': 'ps', 'level': '2', 'first_page': '2', 'last_page': '2'},
          )
          assert ranged.status_code == 200, ranged.text
          assert ranged.content.count(b'%%Page:') == 1
          assert b'%%LanguageLevel: 2' in ranged.content

          eps = client.post(
              '/pdf/to-postscript',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'output_format': 'eps', 'level': '2', 'first_page': '2', 'last_page': '2'},
          )
          assert eps.status_code == 200, eps.text
          assert eps.headers['content-disposition'] == 'attachment; filename="solyan-pdf.eps"'
          assert eps.headers['x-solyan-postscript-format'] == 'eps'
          assert eps.content.startswith(b'%!PS-Adobe-')
          assert b'EPSF' in eps.content[:128]
          assert b'%%BoundingBox:' in eps.content
          assert eps.content.count(b'%%Page:') <= 1

          bad_eps_range = client.post(
              '/pdf/to-postscript',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'output_format': 'eps', 'first_page': '1', 'last_page': '2'},
          )
          assert bad_eps_range.status_code == 422, bad_eps_range.text
          assert 'exactly one PDF page' in bad_eps_range.text

          bad_range = client.post(
              '/pdf/to-postscript',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'output_format': 'ps', 'first_page': '2', 'last_page': '1'},
          )
          assert bad_range.status_code == 422, bad_range.text

          bad_format = client.post(
              '/pdf/to-postscript',
              files={'file': ('source.pdf', source, 'application/pdf')},
              data={'output_format': 'xps'},
          )
          assert bad_format.status_code == 422, bad_format.text

          not_pdf = client.post(
              '/pdf/to-postscript',
              files={'file': ('bad.bin', b'not-a-pdf', 'application/octet-stream')},
              data={'output_format': 'ps'},
          )
          assert not_pdf.status_code == 400, not_pdf.text
          print('real pdftops PS/EPS route semantics: PASS')
          PY

      - name: Gate production wiring, bounds and safety copy
        run: |
          set -euo pipefail
          grep -q 'MAX_OUTPUT_BYTES = 250 \* 1024 \* 1024' backend/app/pdf_to_postscript.py
          grep -q 'COMMAND_TIMEOUT_SECONDS = 180' backend/app/pdf_to_postscript.py
          grep -q 'OUTPUT_FORMATS = {"ps", "eps"}' backend/app/pdf_to_postscript.py
          grep -q 'base_command.append("-origpagesizes")' backend/app/pdf_to_postscript.py
          grep -q 'base_command.append("-eps")' backend/app/pdf_to_postscript.py
          grep -q 'pdf_to_postscript_router' backend/app/main.py
          grep -q 'X-SolYan-PostScript-Format' backend/app/main.py
          grep -q 'CONVERT · V1.4' frontend/app/pdf-to-postscript/page.tsx
          grep -q 'PostScript là một ngôn ngữ mô tả trang có thể được interpreter thực thi' frontend/app/pdf-to-postscript/page.tsx
          grep -q 'không thêm Ghostscript/runtime mới' frontend/app/pdf-to-postscript/page.tsx
          grep -q "href: '/pdf-to-postscript'" frontend/app/page.tsx
          echo 'production wiring + hard bounds + PostScript safety boundary: PASS' | tee -a /tmp/pdf-to-postscript-ci.log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Upload PDF to PostScript evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-postscript-ci-evidence
          path: /tmp/pdf-to-postscript-ci.log
          if-no-files-found: warn
          retention-days: 14
