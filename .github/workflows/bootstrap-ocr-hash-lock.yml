name: Bootstrap OCR Hash Lock

on:
  push:
    branches:
      - build/hash-ocr-pypi
    paths:
      - 'engines/ocr-service/requirements.lock'
      - 'scripts/hash-pinned-pypi.py'
      - '.github/workflows/bootstrap-ocr-hash-lock.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: build/hash-ocr-pypi

      - name: Setup exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Regenerate OCR PyPI hash lock
        run: python scripts/hash-pinned-pypi.py engines/ocr-service/requirements.lock engines/ocr-service/requirements.hashed.lock

      - name: Commit generated OCR hash lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engines/ocr-service/requirements.hashed.lock
          if git diff --cached --quiet; then
            echo 'OCR hash lock already current.'
            exit 0
          fi
          git commit -m 'build: regenerate OCR hash lock with setuptools'
          git push origin HEAD:build/hash-ocr-pypi
