name: Publish v0.1.7

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.7.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release content
        uses: actions/checkout@v4

      - name: Verify release metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('frontend/package.json').read_text())
          lock = json.loads(Path('frontend/package-lock.json').read_text())
          backend = Path('backend/app/main.py').read_text()
          changelog = Path('CHANGELOG.md').read_text()
          manifest = Path('docs/RELEASE-MANIFEST.md').read_text()
          closeout = Path('docs/V1.4-CLOSEOUT.md').read_text()
          audit = Path('docs/V1.4-PARITY-AUDIT.md')
          notes = Path('docs/RELEASE-NOTES-v0.1.7.md')

          assert package['version'] == '0.1.7', package['version']
          assert lock['version'] == '0.1.7', lock['version']
          assert lock['packages']['']['version'] == '0.1.7', lock['packages']['']['version']
          assert 'version="0.1.7"' in backend
          assert '## [0.1.7] - 2026-10-15' in changelog
          assert '# SolYan PDF v0.1.7 — Release Dependency Manifest' in manifest
          assert 'Release date: 2026-10-15' in manifest
          assert audit.is_file()
          assert notes.is_file()
          assert 'SELF-CONTAINED SCOPE COMPLETE' in closeout
          assert 'PDF → PostScript / EPS' in closeout
          assert not list(Path('.github/workflows').glob('prepare-v0.1.7-*.yml'))
          assert not list(Path('.github/workflows').glob('diag-v0.1.7-*.yml'))
          assert not Path('scripts/prepare-v0.1.7.py').exists()
          PY

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.7 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.1.7 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.1.7 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "SolYan PDF v0.1.7" \
            --notes-file docs/RELEASE-NOTES-v0.1.7.md
