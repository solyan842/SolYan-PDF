name: Windows Desktop CI

on:
  pull_request:
    paths:
      - "desktop/**"
      - "backend/app/**"
      - "engines/sign-service/**"
      - "engines/archive-service/**"
      - "engines/office-service/**"
      - "docs/WINDOWS-DESKTOP-*.md"
      - ".github/workflows/windows-desktop-ci.yml"
      - ".github/workflows/ci-result.yml"
      - "scripts/Get-CiBrief.ps1"
      - "scripts/tests/**"
  workflow_dispatch:
  push:
    branches:
      - "feat/windows-desktop-v1"
      - "feat/windows-desktop-d4-text-integration"
      - "feat/windows-desktop-d5-signing"
      - "feat/windows-desktop-d5-pdfa-integration"
    paths:
      - "desktop/**"
      - "backend/app/**"
      - "engines/sign-service/**"
      - "engines/archive-service/**"
      - "engines/office-service/**"
      - "docs/WINDOWS-DESKTOP-*.md"
      - ".github/workflows/windows-desktop-ci.yml"
      - ".github/workflows/ci-result.yml"
      - "scripts/Get-CiBrief.ps1"
      - "scripts/tests/**"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/backend/requirements-windows.txt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Prepare diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Validate desktop UI contract and CSP hygiene
        shell: pwsh
        run: |
          & ./desktop/ui/validate-contract.ps1 2>&1 | Tee-Object -FilePath "artifacts/desktop-ui-contract.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage pinned browser-local PDF engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item desktop/ui/vendor -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item desktop/ui/.vendor-build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force desktop/ui/vendor | Out-Null
          New-Item -ItemType Directory -Force desktop/ui/.vendor-build | Out-Null
          Push-Location desktop/ui/.vendor-build
          try {
            $archive = (npm pack pdf-lib@1.17.1 --silent).Trim()
            if (-not $archive) { throw "npm pack did not return a pdf-lib archive" }
            tar -xzf $archive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item package/dist/pdf-lib.min.js ../vendor/pdf-lib.min.js
          } finally {
            Pop-Location
          }
          Remove-Item desktop/ui/.vendor-build -Recurse -Force
          if (-not (Test-Path desktop/ui/vendor/pdf-lib.min.js)) { throw "pdf-lib browser bundle was not staged" }
          $bundleHash = (Get-FileHash desktop/ui/vendor/pdf-lib.min.js -Algorithm SHA256).Hash.ToLowerInvariant()
          "pdf-lib 1.17.1 $bundleHash" | Tee-Object -FilePath artifacts/desktop-pdf-lib.log

      - name: Build local core and Office resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath artifacts/desktop-pip-bootstrap.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r desktop/backend/requirements-windows.txt 2>&1 | Tee-Object -FilePath artifacts/desktop-pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./desktop/backend/stage-native-runtimes.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./desktop/backend/stage-office-runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m PyInstaller --noconfirm --clean --onefile --name solyan-office --paths engines/office-service --collect-submodules app desktop/backend/office_runner.py 2>&1 | Tee-Object -FilePath artifacts/desktop-office-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/solyan-office.exe desktop/src-tauri/resources/office/solyan-office.exe
          if (-not (Test-Path desktop/src-tauri/resources/office/solyan-office.exe)) { throw "solyan-office.exe was not staged" }

          python -m PyInstaller --noconfirm --clean --onefile --name solyan-core --paths . --collect-submodules backend.app desktop/backend/runner.py 2>&1 | Tee-Object -FilePath artifacts/desktop-core-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/solyan-core.exe desktop/src-tauri/resources/core/solyan-core.exe
          if (-not (Test-Path desktop/src-tauri/resources/core/solyan-core.exe)) { throw "solyan-core.exe was not staged" }

          Get-ChildItem desktop/src-tauri/resources/core -Recurse | Select-Object FullName, Length | Format-Table | Out-String | Tee-Object -FilePath artifacts/desktop-core-resource-inventory.log
          Get-ChildItem desktop/src-tauri/resources/office -Recurse | Select-Object FullName, Length | Format-Table | Out-String | Tee-Object -FilePath artifacts/desktop-office-resource-inventory.log

      - name: Stage offline OCR models and package OCR sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r desktop/backend/requirements-ocr-windows.txt 2>&1 | Tee-Object -FilePath artifacts/desktop-ocr-pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install paddlepaddle==3.2.0 --index-url https://www.paddlepaddle.org.cn/packages/stable/cpu/ 2>&1 | Tee-Object -FilePath artifacts/desktop-paddle-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check 2>&1 | Tee-Object -FilePath artifacts/desktop-ocr-pip-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./desktop/backend/stage-ocr-runtime.ps1 2>&1 | Tee-Object -FilePath artifacts/desktop-tesseract-stage.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./desktop/backend/stage-ocr-models.ps1 2>&1 | Tee-Object -FilePath artifacts/desktop-paddle-models-stage.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m PyInstaller --noconfirm --clean --onefile --name solyan-ocr --additional-hooks-dir desktop/backend/hooks --paths . --paths engines/ocr-service --collect-submodules app --collect-all paddle --collect-all paddleocr --collect-all paddlex --collect-all pypdfium2 --collect-all chardet --hidden-import cv2 desktop/backend/ocr_runner.py 2>&1 | Tee-Object -FilePath artifacts/desktop-ocr-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "desktop/src-tauri/resources/ocr"
          Copy-Item dist/solyan-ocr.exe "$root/solyan-ocr.exe"
          foreach ($file in @("$root/solyan-ocr.exe", "$root/tesseract/tesseract.exe", "$root/tesseract/tessdata/vie.traineddata", "$root/tesseract/tessdata/eng.traineddata", "$root/paddlex-cache/solyan-model-inventory.json")) {
            if (-not (Test-Path $file)) { throw "OCR packaging resource is missing: $file" }
          }
          Get-ChildItem $root -File -Recurse | Select-Object FullName, Length | Format-Table | Out-String | Set-Content artifacts/desktop-ocr-resource-inventory.log

      - name: Package dedicated Windows signing sidecar (pyHanko)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r desktop/backend/requirements-sign-windows.txt 2>&1 | Tee-Object -FilePath artifacts/desktop-sign-pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check 2>&1 | Tee-Object -FilePath artifacts/desktop-sign-pip-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s desktop/backend/tests -p "test_sign_runner.py" -v 2>&1 | Tee-Object -FilePath artifacts/desktop-sign-contract-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --name solyan-sign --paths . --paths engines/sign-service --collect-submodules app --collect-all pyhanko --collect-all pyhanko_certvalidator desktop/backend/sign_runner.py 2>&1 | Tee-Object -FilePath artifacts/desktop-sign-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "desktop/src-tauri/resources/sign"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item dist/solyan-sign.exe "$root/solyan-sign.exe" -ErrorAction Stop
          if (-not (Test-Path "$root/solyan-sign.exe" -PathType Leaf)) { throw "Windows signing sidecar resource missing" }
          Get-ChildItem $root -File | Select-Object Name,Length,FullName |
            Format-List | Out-String | Set-Content artifacts/desktop-sign-resource-inventory.log

      - name: Package PDF-A archive service in isolated Windows Python environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .pdfa-venv
          $py = ".pdfa-venv/Scripts/python.exe"
          & $py -m pip install -r desktop/backend/requirements-pdfa-windows.txt 2>&1 | Tee-Object -FilePath artifacts/desktop-pdfa-pip.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip check 2>&1 | Tee-Object -FilePath artifacts/desktop-pdfa-pip-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m PyInstaller --noconfirm --clean --onefile --name solyan-archive --paths . --paths engines/archive-service --collect-submodules app desktop/backend/archive_runner.py 2>&1 | Tee-Object -FilePath artifacts/desktop-pdfa-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "desktop/src-tauri/resources/archive"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item dist/solyan-archive.exe "$root/solyan-archive.exe" -ErrorAction Stop
          if (-not (Test-Path "$root/solyan-archive.exe" -PathType Leaf)) { throw "Native PDF/A resource missing" }
          Get-ChildItem $root -File | Select-Object Name, Length, FullName |
            Format-List | Out-String | Set-Content artifacts/desktop-pdfa-resource-inventory.log

      - name: Check pinned Tauri CLI
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2.12.3 --version 2>&1 | Tee-Object -FilePath "artifacts/tauri-cli-version.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cargo check
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          cargo check 2>&1 | Tee-Object -FilePath "../../artifacts/desktop-cargo-check.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Trim source-only resources and measure installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "desktop/src-tauri/resources"
          $totalBefore = (Get-ChildItem $root -File -Recurse | Measure-Object Length -Sum).Sum
          $removed = New-Object System.Collections.Generic.List[string]

          # LibreOffice has already been checksum-verified and administratively
          # extracted. The MSI is not required for runtime execution or NSIS uninstall.
          $office = Join-Path $root "office/libreoffice"
          Get-ChildItem $office -Filter "*.msi" -File -ErrorAction Stop | ForEach-Object {
            $removed.Add("MSI: $($_.FullName)")
            Remove-Item $_.FullName -Force
          }
          foreach ($optional in @("help", "readmes")) {
            $candidate = Join-Path $office $optional
            if (Test-Path $candidate) {
              $removed.Add("Office documentation: $candidate")
              Remove-Item $candidate -Recurse -Force
            }
          }

          # Spellcheck dictionaries are optional for headless PDF conversion.
          # Retain English and Vietnamese; preserve the full LibreOffice program,
          # fonts, templates, filters, and every conversion component.
          $extensions = Join-Path $office "share/extensions"
          if (Test-Path $extensions) {
            Get-ChildItem $extensions -Directory -Filter "dict-*" | Where-Object {
              $_.Name -notin @("dict-en", "dict-vi", "dict-vn")
            } | ForEach-Object {
              $removed.Add("Optional spellcheck dictionary: $($_.FullName)")
              Remove-Item $_.FullName -Recurse -Force
            }
          }

          # Only developer import/static libraries and headers, never CLI binaries,
          # runtime DLLs, Tesseract language files, or Paddle model weights.
          $core = Join-Path $root "core"
          Get-ChildItem (Join-Path $core "qpdf") -Directory | ForEach-Object {
            $candidate = Join-Path $_.FullName "lib"
            if (Test-Path $candidate) {
              $removed.Add("qpdf static/import libraries: $candidate")
              Remove-Item $candidate -Recurse -Force
            }
          }
          Get-ChildItem (Join-Path $core "poppler") -Directory | ForEach-Object {
            foreach ($optional in @("Library/include", "Library/lib")) {
              $candidate = Join-Path $_.FullName $optional
              if (Test-Path $candidate) {
                $removed.Add("Poppler development files: $candidate")
                Remove-Item $candidate -Recurse -Force
              }
            }
          }
          $removed | Set-Content artifacts/desktop-excluded-source-assets.log -Encoding utf8

          foreach ($component in @("core", "office", "ocr", "sign", "archive")) {
            $items = @(Get-ChildItem (Join-Path $root $component) -Recurse -File)
            [pscustomobject]@{
              Component = $component
              Files = $items.Count
              Bytes = [int64](($items | Measure-Object Length -Sum).Sum)
            } | Format-List | Out-String | Add-Content artifacts/desktop-payload-by-component.log
          }
          $remainingFiles = @(Get-ChildItem $root -File -Recurse)
          $totalAfter = ($remainingFiles | Measure-Object Length -Sum).Sum
          @(
            "before_bytes=$totalBefore"
            "after_bytes=$totalAfter"
            "reclaimed_bytes=$($totalBefore - $totalAfter)"
          ) | Set-Content artifacts/desktop-payload-total.log
          $remainingFiles | Sort-Object Length -Descending |
            Select-Object -First 20 FullName, Length |
            Format-List | Out-String | Set-Content artifacts/desktop-largest-payload-files.log
          if ($totalAfter -ge $totalBefore) { throw "No non-runtime packaging assets were removed" }

          foreach ($essential in @(
            "$root/core/solyan-core.exe",
            "$root/office/solyan-office.exe",
            "$root/ocr/solyan-ocr.exe",
            "$root/sign/solyan-sign.exe",
            "$root/archive/solyan-archive.exe",
            "$root/ocr/tesseract/tesseract.exe",
            "$root/ocr/tesseract/tessdata/vie.traineddata",
            "$root/ocr/tesseract/tessdata/eng.traineddata",
            "$root/ocr/paddlex-cache/solyan-model-inventory.json"
          )) {
            if (-not (Test-Path $essential -PathType Leaf)) {
              throw "Required runtime resource removed: $essential"
            }
          }

      - name: Build NSIS installer with local sidecars
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          npx --yes @tauri-apps/cli@2.12.3 build --bundles nsis 2>&1 | Tee-Object -FilePath "../../artifacts/desktop-tauri-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction Stop)
          if ($installers.Count -lt 1) { throw "No NSIS installer was produced" }
          $installers | Select-Object Name, Length, FullName | Format-Table | Out-String | Tee-Object -FilePath "artifacts/desktop-installer-inventory.log"

      - name: Smoke silent install and local sidecar lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer is unavailable for runtime smoke" }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)" }

          $expectedRoot = Join-Path $env:LOCALAPPDATA "SolYan PDF"
          $candidatePaths = @(
            (Join-Path $expectedRoot "solyan-pdf-desktop.exe"),
            (Join-Path $expectedRoot "SolYan PDF.exe")
          )
          $appExe = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $appExe) {
            $candidate = Get-ChildItem $env:LOCALAPPDATA -Filter "solyan-pdf-desktop.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $candidate) {
              $candidate = Get-ChildItem $env:LOCALAPPDATA -Filter "SolYan PDF.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if ($candidate) { $appExe = $candidate.FullName }
          }
          if (-not $appExe -or -not (Test-Path $appExe)) {
            Get-ChildItem $env:LOCALAPPDATA -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*SolYan*" -or $_.Name -like "*solyan*" } |
              Select-Object FullName | Format-Table | Out-String |
              Set-Content "artifacts/desktop-install-location-diagnostic.log"
            throw "Installed SolYan PDF application executable was not found"
          }

          $installRoot = Split-Path $appExe -Parent
          $coreExe = Get-ChildItem $installRoot -Filter "solyan-core.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $officeExe = Get-ChildItem $installRoot -Filter "solyan-office.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $sofficeExe = Get-ChildItem $installRoot -Filter "soffice.com" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sofficeExe) { $sofficeExe = Get-ChildItem $installRoot -Filter "soffice.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $qpdfExe = Get-ChildItem $installRoot -Filter "qpdf.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $pdftoppmExe = Get-ChildItem $installRoot -Filter "pdftoppm.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $pdfinfoExe = Get-ChildItem $installRoot -Filter "pdfinfo.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $coreExe) { throw "Installed solyan-core.exe resource was not found" }
          if (-not $officeExe) { throw "Installed solyan-office.exe resource was not found" }
          if (-not $sofficeExe) { throw "Installed LibreOffice soffice resource was not found" }
          if (-not $qpdfExe) { throw "Installed qpdf.exe resource was not found" }
          if (-not $pdftoppmExe) { throw "Installed pdftoppm.exe resource was not found" }
          if (-not $pdfinfoExe) { throw "Installed pdfinfo.exe resource was not found" }
          $ocrExe = Get-ChildItem $installRoot -Filter "solyan-ocr.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $tesseractExe = Get-ChildItem $installRoot -Filter "tesseract.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $modelInventory = Get-ChildItem $installRoot -Filter "solyan-model-inventory.json" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ocrExe) { throw "Installed solyan-ocr.exe resource was not found" }
          if (-not $tesseractExe) { throw "Installed Tesseract runtime was not found" }
          if (-not $modelInventory) { throw "Installed offline Paddle model inventory was not found" }
          $signExe = Get-ChildItem $installRoot -Filter "solyan-sign.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signExe) { throw "Installed solyan-sign.exe was not found" }
          $archiveExe = Get-ChildItem $installRoot -Filter "solyan-archive.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $archiveExe) { throw "Installed solyan-archive.exe was not found" }

          Get-Process -Name "solyan-core" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "solyan-office" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "solyan-ocr" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "solyan-sign" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "solyan-archive" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $appExe -PassThru
          $core = $null
          $office = $null
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Milliseconds 500
            $core = Get-Process -Name "solyan-core" -ErrorAction SilentlyContinue | Select-Object -First 1
            $office = Get-Process -Name "solyan-office" -ErrorAction SilentlyContinue | Select-Object -First 1
            $ocr = Get-Process -Name "solyan-ocr" -ErrorAction SilentlyContinue | Select-Object -First 1
            $sign = Get-Process -Name "solyan-sign" -ErrorAction SilentlyContinue | Select-Object -First 1
            $archive = Get-Process -Name "solyan-archive" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($core -and $office -and $ocr -and $sign -and $archive) { break }
            if ($app.HasExited) { throw "SolYan PDF exited before local sidecars became ready" }
          }
          if (-not $office) { throw "SolYan PDF did not start solyan-office.exe" }
          if (-not $core) { throw "SolYan PDF did not start solyan-core.exe" }
          if (-not $ocr) { throw "SolYan PDF did not start solyan-ocr.exe" }
          if (-not $sign) { throw "SolYan PDF did not start solyan-sign.exe" }
          if (-not $archive) { throw "SolYan PDF did not start solyan-archive.exe" }

          $closed = $app.CloseMainWindow()
          if ($closed) { $null = $app.WaitForExit(15000) }
          if (-not $app.HasExited) {
            $app.Kill()
            $app.WaitForExit()
          }

          $coreOrphan = $null
          $officeOrphan = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            $coreOrphan = Get-Process -Name "solyan-core" -ErrorAction SilentlyContinue | Select-Object -First 1
            $officeOrphan = Get-Process -Name "solyan-office" -ErrorAction SilentlyContinue | Select-Object -First 1
            $ocrOrphan = Get-Process -Name "solyan-ocr" -ErrorAction SilentlyContinue | Select-Object -First 1
            $signOrphan = Get-Process -Name "solyan-sign" -ErrorAction SilentlyContinue | Select-Object -First 1
            $archiveOrphan = Get-Process -Name "solyan-archive" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $coreOrphan -and -not $officeOrphan -and -not $ocrOrphan -and -not $signOrphan -and -not $archiveOrphan) { break }
          }
          if ($coreOrphan) {
            $coreOrphan | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "solyan-core.exe remained after SolYan PDF exited"
          }
          if ($officeOrphan) {
            $officeOrphan | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "solyan-office.exe remained after SolYan PDF exited"
          }
          if ($ocrOrphan) {
            $ocrOrphan | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "solyan-ocr.exe remained after SolYan PDF exited"
          }
          if ($signOrphan) {
            $signOrphan | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "solyan-sign.exe remained after SolYan PDF exited"
          }
          if ($archiveOrphan) {
            $archiveOrphan | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "solyan-archive.exe remained after SolYan PDF exited"
          }

          @(
            "installer=$($installer.Name)",
            "app=$appExe",
            "core=$($coreExe.FullName)",
            "office=$($officeExe.FullName)",
            "ocr=$($ocrExe.FullName)",
            "sign=$($signExe.FullName)",
            "archive=$($archiveExe.FullName)",
            "tesseract=$($tesseractExe.FullName)",
            "paddle_model_inventory=$($modelInventory.FullName)",
            "libreoffice=$($sofficeExe.FullName)",
            "qpdf=$($qpdfExe.FullName)",
            "pdftoppm=$($pdftoppmExe.FullName)",
            "pdfinfo=$($pdfinfoExe.FullName)",
            "runtime_core_started=true",
            "runtime_office_started=true",
            "runtime_ocr_started=true",
            "runtime_sign_started=true",
            "runtime_archive_started=true",
            "runtime_core_stopped=true",
            "runtime_office_stopped=true",
            "runtime_ocr_stopped=true",
            "runtime_sign_stopped=true",
            "runtime_archive_stopped=true"
          ) | Set-Content "artifacts/desktop-installed-runtime-smoke.log"

          # Verify two actual installed native capabilities, not merely process startup.
          python desktop/backend/tests/sign_runtime_smoke.py --exe $signExe.FullName --output artifacts 2>&1 | Tee-Object -FilePath artifacts/desktop-installed-sign-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tesseractBin = Split-Path $tesseractExe.FullName -Parent
          $env:PATH = "$tesseractBin;$env:PATH"
          $env:TESSDATA_PREFIX = Join-Path $tesseractBin "tessdata"
          & .pdfa-venv/Scripts/python.exe desktop/backend/tests/pdfa_frozen_smoke.py --exe $archiveExe.FullName --output artifacts 2>&1 | Tee-Object -FilePath artifacts/desktop-installed-pdfa-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-diagnostics
          path: artifacts/
          if-no-files-found: warn

      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SolYan-PDF-Windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  ci-result:
    needs: build-windows-x64
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/ci-result.yml
    with:
      build-result: ${{ needs.build-windows-x64.result }}
