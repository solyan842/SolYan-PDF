name: Windows Desktop CI

on:
  pull_request:
    paths:
      - "desktop/**"
      - "backend/app/**"
      - "docs/WINDOWS-DESKTOP-*.md"
      - ".github/workflows/windows-desktop-ci.yml"
  push:
    branches:
      - "feat/windows-desktop-v1"
    paths:
      - "desktop/**"
      - "backend/app/**"
      - "docs/WINDOWS-DESKTOP-*.md"
      - ".github/workflows/windows-desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/backend/requirements-windows.txt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Prepare diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Validate desktop UI contract and CSP hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "desktop/ui/index.html",
            "desktop/ui/styles.css",
            "desktop/ui/catalog.js",
            "desktop/ui/app.js",
            "desktop/ui/merge.html",
            "desktop/ui/merge.js",
            "desktop/ui/repair.html",
            "desktop/ui/repair.js",
            "desktop/ui/extract-images.html",
            "desktop/ui/extract-images.js",
            "desktop/ui/info.html",
            "desktop/ui/info.js",
            "desktop/ui/workspace.html",
            "desktop/backend/stage-native-runtimes.ps1",
            "desktop/vendor/qpdf-windows-x64.json",
            "desktop/vendor/poppler-windows-x64.json",
            "desktop/src-tauri/tauri.conf.json"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required desktop file: $path" }
          }
          $html = Get-Content "desktop/ui/index.html" -Raw
          $catalog = Get-Content "desktop/ui/catalog.js" -Raw
          $app = Get-Content "desktop/ui/app.js" -Raw
          $repair = Get-Content "desktop/ui/repair.js" -Raw
          $extractImages = Get-Content "desktop/ui/extract-images.js" -Raw
          $info = Get-Content "desktop/ui/info.js" -Raw
          foreach ($text in @("Công cụ phổ biến", "Tất cả công cụ", "Ctrl K")) {
            if (-not $html.Contains($text)) { throw "Desktop UI contract missing: $text" }
          }
          foreach ($text in @("Nối PDF", "PDF sang Word", "OCR PDF", "Tiện ích Việt Nam", "Sửa lỗi PDF", "Trích xuất hình ảnh", "Thông tin PDF")) {
            if (-not $catalog.Contains($text)) { throw "Desktop catalog missing: $text" }
          }
          foreach ($text in @("repair: './repair.html'", "'extract-images': './extract-images.html'", "info: './info.html'")) {
            if (-not $app.Contains($text)) { throw "Desktop route contract missing: $text" }
          }
          foreach ($text in @("desktop_core_session", "/pdf/repair", "X-SolYan-Desktop-Token")) {
            if (-not $repair.Contains($text)) { throw "Repair PDF local-core contract missing: $text" }
          }
          foreach ($text in @("desktop_core_session", "/pdf/extract-images", "X-SolYan-Desktop-Token", "X-SolYan-Extracted-Images")) {
            if (-not $extractImages.Contains($text)) { throw "Extract Images local-core contract missing: $text" }
          }
          foreach ($text in @("desktop_core_session", "/pdf/info", "X-SolYan-Desktop-Token", "password")) {
            if (-not $info.Contains($text)) { throw "PDF Info local-core contract missing: $text" }
          }
          foreach ($page in @("desktop/ui/index.html", "desktop/ui/merge.html", "desktop/ui/repair.html", "desktop/ui/extract-images.html", "desktop/ui/info.html", "desktop/ui/workspace.html")) {
            if ((Get-Content $page -Raw) -match 'style\s*=') { throw "Strict CSP violation: inline style attribute found in $page" }
          }
          "Desktop UI contract and CSP hygiene OK" | Tee-Object -FilePath "artifacts/desktop-ui-contract.log"

      - name: Stage pinned browser-local PDF engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item desktop/ui/vendor -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item desktop/ui/.vendor-build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force desktop/ui/vendor | Out-Null
          New-Item -ItemType Directory -Force desktop/ui/.vendor-build | Out-Null
          Push-Location desktop/ui/.vendor-build
          try {
            $archive = (npm pack pdf-lib@1.17.1 --silent).Trim()
            if (-not $archive) { throw "npm pack did not return a pdf-lib archive" }
            tar -xzf $archive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item package/dist/pdf-lib.min.js ../vendor/pdf-lib.min.js
          } finally {
            Pop-Location
          }
          Remove-Item desktop/ui/.vendor-build -Recurse -Force
          if (-not (Test-Path desktop/ui/vendor/pdf-lib.min.js)) { throw "pdf-lib browser bundle was not staged" }
          $bundleHash = (Get-FileHash desktop/ui/vendor/pdf-lib.min.js -Algorithm SHA256).Hash.ToLowerInvariant()
          "pdf-lib 1.17.1 $bundleHash" | Tee-Object -FilePath artifacts/desktop-pdf-lib.log

      - name: Build local core resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath artifacts/desktop-pip-bootstrap.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r desktop/backend/requirements-windows.txt 2>&1 | Tee-Object -FilePath artifacts/desktop-pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./desktop/backend/stage-native-runtimes.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m PyInstaller --noconfirm --clean --onefile --name solyan-core --paths . --collect-submodules backend.app desktop/backend/runner.py 2>&1 | Tee-Object -FilePath artifacts/desktop-core-pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/solyan-core.exe desktop/src-tauri/resources/core/solyan-core.exe
          if (-not (Test-Path desktop/src-tauri/resources/core/solyan-core.exe)) { throw "solyan-core.exe was not staged" }
          Get-ChildItem desktop/src-tauri/resources/core -Recurse | Select-Object FullName, Length | Format-Table | Out-String | Tee-Object -FilePath artifacts/desktop-resource-inventory.log

      - name: Check pinned Tauri CLI
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2.12.3 --version 2>&1 | Tee-Object -FilePath "artifacts/tauri-cli-version.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cargo check
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          cargo check 2>&1 | Tee-Object -FilePath "../../artifacts/desktop-cargo-check.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer with local core
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          npx --yes @tauri-apps/cli@2.12.3 build --bundles nsis 2>&1 | Tee-Object -FilePath "../../artifacts/desktop-tauri-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction Stop)
          if ($installers.Count -lt 1) { throw "No NSIS installer was produced" }
          $installers | Select-Object Name, Length, FullName | Format-Table | Out-String | Tee-Object -FilePath "artifacts/desktop-installer-inventory.log"

      - name: Smoke silent install and local core lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer is unavailable for runtime smoke" }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)" }

          $expectedRoot = Join-Path $env:LOCALAPPDATA "SolYan PDF"
          $candidatePaths = @(
            (Join-Path $expectedRoot "solyan-pdf-desktop.exe"),
            (Join-Path $expectedRoot "SolYan PDF.exe")
          )
          $appExe = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $appExe) {
            $candidate = Get-ChildItem $env:LOCALAPPDATA -Filter "solyan-pdf-desktop.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $candidate) {
              $candidate = Get-ChildItem $env:LOCALAPPDATA -Filter "SolYan PDF.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if ($candidate) { $appExe = $candidate.FullName }
          }
          if (-not $appExe -or -not (Test-Path $appExe)) {
            Get-ChildItem $env:LOCALAPPDATA -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*SolYan*" -or $_.Name -like "*solyan*" } |
              Select-Object FullName | Format-Table | Out-String |
              Set-Content "artifacts/desktop-install-location-diagnostic.log"
            throw "Installed SolYan PDF application executable was not found"
          }

          $installRoot = Split-Path $appExe -Parent
          $coreExe = Get-ChildItem $installRoot -Filter "solyan-core.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $qpdfExe = Get-ChildItem $installRoot -Filter "qpdf.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $pdftoppmExe = Get-ChildItem $installRoot -Filter "pdftoppm.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $pdfinfoExe = Get-ChildItem $installRoot -Filter "pdfinfo.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $coreExe) { throw "Installed solyan-core.exe resource was not found" }
          if (-not $qpdfExe) { throw "Installed qpdf.exe resource was not found" }
          if (-not $pdftoppmExe) { throw "Installed pdftoppm.exe resource was not found" }
          if (-not $pdfinfoExe) { throw "Installed pdfinfo.exe resource was not found" }

          Get-Process -Name "solyan-core" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $appExe -PassThru
          $core = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            $core = Get-Process -Name "solyan-core" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($core) { break }
            if ($app.HasExited) { throw "SolYan PDF exited before local core became ready" }
          }
          if (-not $core) { throw "SolYan PDF did not start solyan-core.exe" }

          $closed = $app.CloseMainWindow()
          if ($closed) { $null = $app.WaitForExit(10000) }
          if (-not $app.HasExited) {
            $app.Kill()
            $app.WaitForExit()
          }

          $orphan = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $orphan = Get-Process -Name "solyan-core" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $orphan) { break }
          }
          if ($orphan) {
            $orphan | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "solyan-core.exe remained after SolYan PDF exited"
          }

          @(
            "installer=$($installer.Name)",
            "app=$appExe",
            "core=$($coreExe.FullName)",
            "qpdf=$($qpdfExe.FullName)",
            "pdftoppm=$($pdftoppmExe.FullName)",
            "pdfinfo=$($pdfinfoExe.FullName)",
            "runtime_core_started=true",
            "runtime_core_stopped=true"
          ) | Set-Content "artifacts/desktop-installed-runtime-smoke.log"

      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-diagnostics
          path: artifacts/
          if-no-files-found: warn

      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SolYan-PDF-Windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
