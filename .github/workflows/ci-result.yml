name: CI result summary

on:
  workflow_call:
    inputs:
      build-result:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test CI collector
        shell: pwsh
        run: ./scripts/tests/Test-CiBrief.ps1
      - name: Collect exact-run evidence and write Job Summary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ inputs.build-result }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/Get-CiBrief.ps1 -Repo $env:GITHUB_REPOSITORY -RunId ([long]$env:GITHUB_RUN_ID) -ExpectedSha $env:EXPECTED_HEAD_SHA -BuildResult $env:BUILD_RESULT -OutputDirectory ci-result
      - name: Preserve compact CI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-result/brief.txt
            ci-result/result.json
            ci-result/run.json
            ci-result/jobs.json
            ci-result/summary.md
          if-no-files-found: error
          retention-days: 14

  notify-result:
    needs: summarize
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      # No checkout or execution of repository code with a write token.
      - name: Notify subscribers of PASS or FAIL on the fixed CI issue
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ inputs.build-result }}
          REPORT_RESULT: ${{ needs.summarize.result }}
        with:
          script: |
            const issue_number = 135;
            const repo = context.repo;
            const marker = `<!-- ci-result:${context.runId}:${process.env.GITHUB_RUN_ATTEMPT} -->`;
            const body = `${marker}\nCI result: build **${process.env.BUILD_RESULT}**, evidence collection **${process.env.REPORT_RESULT}**.\nSHA: \`${context.sha}\`\n[Run and Job Summary](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId})\nDownload the ci-result artifact for failed job IDs and bounded error evidence. No automatic rebuild or AI invocation.`;
            let existing;
            for await (const page of github.paginate.iterator(github.rest.issues.listComments, {...repo, issue_number, per_page: 100})) {
              existing = page.data.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
              if (existing) break;
            }
            if (existing) {
              await github.rest.issues.updateComment({...repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...repo, issue_number, body});
            }
