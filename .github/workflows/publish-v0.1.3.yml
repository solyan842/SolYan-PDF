name: Publish v0.1.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.3.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release content
        uses: actions/checkout@v4

      - name: Verify release metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('frontend/package.json').read_text())
          lock = json.loads(Path('frontend/package-lock.json').read_text())
          backend = Path('backend/app/main.py').read_text()
          changelog = Path('CHANGELOG.md').read_text()
          manifest = Path('docs/RELEASE-MANIFEST.md').read_text()
          policy = json.loads(Path('benchmarks/corpora/pdf_to_office_release_v1.json').read_text())

          assert package['version'] == '0.1.3', package['version']
          assert lock['version'] == '0.1.3', lock['version']
          assert lock['packages']['']['version'] == '0.1.3', lock['packages']['']['version']
          assert 'version="0.1.3"' in backend
          assert '## [0.1.3] - 2026-10-13' in changelog
          assert '# SolYan PDF v0.1.3 — Release Dependency Manifest' in manifest
          assert policy['version'] == 'pdf-to-office-release-v1'
          assert policy['release_gate'] is True
          assert Path('docs/RELEASE-NOTES-v0.1.3.md').is_file()
          PY

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.1.3 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.1.3 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "SolYan PDF v0.1.3" \
            --notes-file docs/RELEASE-NOTES-v0.1.3.md
