name: PDF-to-Office Real Corpus Probe

on:
  push:
    branches:
      - benchmark/pdf-office-real-diagnostic-v1
    paths:
      - '.github/workflows/pdf-office-real-corpus-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PY_PDF_COMMIT: 02b8203bf416db3dbdb03438bc8278dfcb0555f3

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PDF probe dependencies
        run: pip install pypdf==6.1.1 cryptography==46.0.3 pypdfium2==5.14.0 Pillow==12.3.0

      - name: Download and fingerprint candidate corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from pypdf import PdfReader

          commit = os.environ['PY_PDF_COMMIT']
          cases = [
              {'id': 'docx-google-doc', 'target': 'docx', 'category': 'document', 'license': 'CC BY-SA 4.0', 'source': 'py-pdf/sample-files', 'upstream_path': '011-google-doc-document/google-doc-document.pdf'},
              {'id': 'docx-multicolumn', 'target': 'docx', 'category': 'multi-column', 'license': 'CC BY-SA 4.0', 'source': 'py-pdf/sample-files', 'upstream_path': '026-latex-multicolumn/multicolumn.pdf'},
              {'id': 'docx-libreoffice-images', 'target': 'docx', 'category': 'document-images', 'license': 'CC BY-SA 4.0', 'source': 'py-pdf/sample-files', 'upstream_path': '028-image-references-deduplication/wrong-references.pdf'},
          ]
          commons = [
              ('xlsx-table-material', 'xlsx', 'table', 'NDL8818342 The table of material. Report No. 44a(4), USSBS Index Section 2.pdf', 'Public Domain'),
              ('xlsx-unidentified-table', 'xlsx', 'table', 'NDL8816038 Unidentified table. Report No. 17g(9), USSBS Index Section 2.pdf', 'Public Domain'),
              ('xlsx-transport-table', 'xlsx', 'table', 'NDL8820352 Comparative table on transportation plan and actual transportation results of "C" ships. Report No. 54tt(1), USSBS Index Section 2 part2.pdf', 'Public Domain'),
              ('pptx-commons-copyright', 'pptx', 'slides', 'Presentation on Wikimedia Commons & Copyright.pdf', 'CC BY-SA 4.0'),
              ('pptx-what-is-cc', 'pptx', 'slides', 'What is Creative Commons.pdf', 'CC BY-SA 4.0'),
              ('pptx-copyright-laws', 'pptx', 'slides', '2.Introduction to copyright laws.pdf', 'CC BY-SA 4.0'),
          ]
          for case_id, target, category, filename, license_name in commons:
              cases.append({'id': case_id, 'target': target, 'category': category, 'license': license_name, 'source': 'Wikimedia Commons', 'commons_filename': filename})

          out_dir = Path('/tmp/pdf-office-real-probe')
          out_dir.mkdir(parents=True, exist_ok=True)
          inventory = []
          base_headers = {'User-Agent': 'SolYan-PDF PDF-to-Office benchmark/0.1.2 (https://github.com/solyan842/SolYan-PDF)'}

          for case in cases:
              if case['source'] == 'py-pdf/sample-files':
                  encoded_path = '/'.join(urllib.parse.quote(part, safe='') for part in case['upstream_path'].split('/'))
                  url = f'https://api.github.com/repos/py-pdf/sample-files/contents/{encoded_path}?ref={commit}'
                  headers = {**base_headers, 'Accept': 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28'}
              else:
                  url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + urllib.parse.quote(case['commons_filename'], safe='')
                  headers = base_headers

              print('FETCH', case['id'], url, flush=True)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=180) as response:
                  data = response.read()
                  resolved_url = response.geturl()
              assert data[:5] == b'%PDF-', (case['id'], data[:80], resolved_url)

              path = out_dir / f"{case['id']}.pdf"
              path.write_bytes(data)
              reader = PdfReader(path)
              item = {
                  **case,
                  'filename': path.name,
                  'bytes': len(data),
                  'pages': len(reader.pages),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'resolved_url': resolved_url,
              }
              if case['source'] == 'py-pdf/sample-files':
                  item['upstream_commit'] = commit
              inventory.append(item)
              print(case['id'], 'pages=', item['pages'], 'bytes=', item['bytes'], 'sha256=', item['sha256'], flush=True)

          assert len(inventory) == 9
          assert {x['target'] for x in inventory} == {'docx', 'xlsx', 'pptx'}
          assert all(x['pages'] >= 1 and x['bytes'] > 1000 for x in inventory)
          Path('/tmp/pdf-office-real-inventory.json').write_text(
              json.dumps({'schema_version': 1, 'cases': inventory}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Render page contact sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          import pypdfium2 as pdfium
          from PIL import Image, ImageDraw, ImageFont

          root = Path('/tmp/pdf-office-real-probe')
          out = Path('/tmp/pdf-office-real-contact-sheets')
          out.mkdir(parents=True, exist_ok=True)
          targets = sorted(root.glob('xlsx-*.pdf')) + sorted(root.glob('pptx-*.pdf'))
          font = ImageFont.load_default()
          thumb_w, thumb_h = 240, 180
          label_h = 24
          cols = 4
          margin = 10

          for pdf_path in targets:
              doc = pdfium.PdfDocument(str(pdf_path))
              thumbs = []
              for index in range(len(doc)):
                  page = doc[index]
                  bitmap = page.render(scale=0.35)
                  image = bitmap.to_pil().convert('RGB')
                  image.thumbnail((thumb_w, thumb_h))
                  tile = Image.new('RGB', (thumb_w, thumb_h + label_h), 'white')
                  x = (thumb_w - image.width) // 2
                  y = (thumb_h - image.height) // 2
                  tile.paste(image, (x, y))
                  draw = ImageDraw.Draw(tile)
                  draw.text((6, thumb_h + 4), f'Page {index + 1}', font=font, fill='black')
                  thumbs.append(tile)

              rows = (len(thumbs) + cols - 1) // cols
              sheet = Image.new('RGB', (cols * thumb_w + (cols + 1) * margin, rows * (thumb_h + label_h) + (rows + 1) * margin), 'white')
              for i, tile in enumerate(thumbs):
                  row, col = divmod(i, cols)
                  sheet.paste(tile, (margin + col * (thumb_w + margin), margin + row * (thumb_h + label_h + margin)))
              path = out / f'{pdf_path.stem}.png'
              sheet.save(path, optimize=True)
              print(path, 'pages=', len(thumbs), 'size=', sheet.size)
          PY

      - name: Upload candidate inventory
        uses: actions/upload-artifact@v4
        with:
          name: pdf-office-real-corpus-inventory
          path: /tmp/pdf-office-real-inventory.json
          retention-days: 7

      - name: Upload contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: pdf-office-real-contact-sheets
          path: /tmp/pdf-office-real-contact-sheets/*.png
          retention-days: 7
