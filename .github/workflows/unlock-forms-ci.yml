name: Unlock PDF Forms CI

on:
  pull_request:
    paths:
      - 'backend/app/unlock_forms.py'
      - 'backend/app/main.py'
      - 'frontend/app/unlock-forms/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/unlock-forms-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/unlock_forms.py'
      - 'backend/app/main.py'
      - 'frontend/app/unlock-forms/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/unlock-forms-ci.yml'

jobs:
  unlock-forms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install qpdf
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          qpdf --version

      - name: Install hash-verified backend dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements.hashed.lock
          python -m pip install --no-deps -r backend/requirements.txt
          python -m pip install pypdf==6.1.1
          python -m pip check

      - name: Compile backend form unlocker
        run: python -m compileall backend/app

      - name: Reject cyclic form trees safely
        working-directory: backend
        run: |
          python - <<'PY'
          from fastapi import HTTPException
          from app.unlock_forms import UnlockFormStats, _unlock_field_tree

          objects = {
              'obj:3 0 R': {'value': {'/Kids': ['4 0 R']}},
              'obj:4 0 R': {'value': {'/Kids': ['3 0 R']}},
          }
          try:
              _unlock_field_tree(
                  objects,
                  '3 0 R',
                  stats=UnlockFormStats(),
                  active_path=set(),
                  counter=[0],
                  depth=0,
              )
          except HTTPException as exc:
              assert exc.status_code == 422, exc
              assert 'cycle' in str(exc.detail).lower(), exc.detail
          else:
              raise AssertionError('cyclic form tree must be rejected')
          print('cyclic field tree rejected with bounded 422 response')
          PY

      - name: Generate AcroForm and compressed XFA fixture
        run: |
          mkdir -p /tmp/solyan-unlock-forms
          python - <<'PY'
          from pypdf import PdfWriter
          from pypdf.generic import (
              ArrayObject,
              BooleanObject,
              DecodedStreamObject,
              DictionaryObject,
              NameObject,
              NumberObject,
              TextStringObject,
          )

          root = '/tmp/solyan-unlock-forms'
          writer = PdfWriter()
          writer.add_blank_page(width=595, height=842)

          locked = DictionaryObject({
              NameObject('/FT'): NameObject('/Tx'),
              NameObject('/T'): TextStringObject('LockedText'),
              NameObject('/V'): TextStringObject('Original value'),
              NameObject('/Ff'): NumberObject(1 | 4096),
              NameObject('/Lock'): DictionaryObject({NameObject('/Action'): NameObject('/All')}),
          })
          writable = DictionaryObject({
              NameObject('/FT'): NameObject('/Tx'),
              NameObject('/T'): TextStringObject('WritableText'),
              NameObject('/V'): TextStringObject('Keep this value'),
              NameObject('/Ff'): NumberObject(0),
          })
          locked_ref = writer._add_object(locked)
          writable_ref = writer._add_object(writable)

          xfa = DecodedStreamObject()
          xfa.set_data(b'<template><field access="readOnly"/><field access="open"/><subform access="readOnly"/></template>')
          xfa_ref = writer._add_object(xfa.flate_encode())
          acroform = DictionaryObject({
              NameObject('/Fields'): ArrayObject([locked_ref, writable_ref]),
              NameObject('/NeedAppearances'): BooleanObject(False),
              NameObject('/XFA'): ArrayObject([TextStringObject('template'), xfa_ref]),
          })
          writer._root_object[NameObject('/AcroForm')] = writer._add_object(acroform)
          with open(f'{root}/locked.pdf', 'wb') as handle:
              writer.write(handle)

          noop = PdfWriter()
          noop.add_blank_page(width=595, height=842)
          plain = DictionaryObject({
              NameObject('/FT'): NameObject('/Tx'),
              NameObject('/T'): TextStringObject('AlreadyWritable'),
              NameObject('/V'): TextStringObject('No change'),
              NameObject('/Ff'): NumberObject(0),
          })
          plain_ref = noop._add_object(plain)
          noop._root_object[NameObject('/AcroForm')] = noop._add_object(
              DictionaryObject({NameObject('/Fields'): ArrayObject([plain_ref])})
          )
          with open(f'{root}/noop.pdf', 'wb') as handle:
              noop.write(handle)
          PY
          qpdf --check /tmp/solyan-unlock-forms/locked.pdf
          qpdf --check /tmp/solyan-unlock-forms/noop.pdf

      - name: Unlock form through production API
        working-directory: backend
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/solyan-unlock-forms/api.log
          import io
          from pathlib import Path

          from fastapi.testclient import TestClient
          from pypdf import PdfReader
          from app.main import app

          root = Path('/tmp/solyan-unlock-forms')
          source = root.joinpath('locked.pdf').read_bytes()
          client = TestClient(app)
          response = client.post('/pdf/unlock-forms', files={'file': ('locked.pdf', source, 'application/pdf')})
          assert response.status_code == 200, response.text
          assert int(response.headers['X-SolYan-Readonly-Flags-Cleared']) == 1, response.headers
          assert int(response.headers['X-SolYan-Form-Locks-Removed']) == 1, response.headers
          assert int(response.headers['X-SolYan-XFA-Streams-Modified']) == 1, response.headers
          assert int(response.headers['X-SolYan-XFA-Attributes-Opened']) == 2, response.headers
          root.joinpath('unlocked.pdf').write_bytes(response.content)

          reader = PdfReader(io.BytesIO(response.content))
          fields = reader.get_fields() or {}
          assert 'LockedText' in fields, fields
          assert 'WritableText' in fields, fields
          locked = fields['LockedText']
          writable = fields['WritableText']
          assert int(locked.get('/Ff', 0)) == 4096, locked
          assert locked.get('/V') == 'Original value', locked
          assert '/Lock' not in locked, locked
          assert int(writable.get('/Ff', 0)) == 0, writable
          assert writable.get('/V') == 'Keep this value', writable

          acroform = reader.trailer['/Root']['/AcroForm'].get_object()
          assert bool(acroform.get('/NeedAppearances')) is True, acroform
          xfa = acroform['/XFA']
          xfa_stream = xfa[1].get_object()
          xml = xfa_stream.get_data()
          assert b'access="readOnly"' not in xml, xml
          assert xml.count(b'access="open"') == 3, xml
          print('AcroForm flags/values preserved and compressed XFA opened:', xml)
          PY
          qpdf --check /tmp/solyan-unlock-forms/unlocked.pdf
          qpdf --qdf --object-streams=disable /tmp/solyan-unlock-forms/unlocked.pdf /tmp/solyan-unlock-forms/unlocked-qdf.pdf

      - name: Preserve byte-identical no-op input
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from fastapi.testclient import TestClient
          from app.main import app

          root = Path('/tmp/solyan-unlock-forms')
          source = root.joinpath('noop.pdf').read_bytes()
          response = TestClient(app).post('/pdf/unlock-forms', files={'file': ('noop.pdf', source, 'application/pdf')})
          assert response.status_code == 200, response.text
          assert response.content == source, 'already-writable PDF must remain byte-identical'
          assert int(response.headers['X-SolYan-Readonly-Flags-Cleared']) == 0
          assert int(response.headers['X-SolYan-Form-Locks-Removed']) == 0
          assert int(response.headers['X-SolYan-XFA-Attributes-Opened']) == 0
          print('no-op path is byte-identical')
          PY

      - name: Gate frontend and route wiring
        run: |
          grep -q "'/unlock-forms'" frontend/app/page.tsx
          grep -q '/pdf/unlock-forms' frontend/app/unlock-forms/page.tsx
          grep -q 'app.include_router(unlock_forms_router)' backend/app/main.py
          grep -q 'X-SolYan-XFA-Attributes-Opened' backend/app/main.py

      - name: Upload unlock-form diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlock-forms-diagnostics
          path: |
            /tmp/solyan-unlock-forms/api.log
            /tmp/solyan-unlock-forms/unlocked-qdf.pdf
          if-no-files-found: ignore
