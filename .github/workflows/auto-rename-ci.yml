name: Auto Rename CI

on:
  pull_request:
    paths:
      - 'frontend/lib/auto-rename.ts'
      - 'frontend/app/auto-rename/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/auto-rename-ci.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/ROADMAP.md'
  push:
    branches:
      - main
    paths:
      - 'frontend/lib/auto-rename.ts'
      - 'frontend/app/auto-rename/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/auto-rename-ci.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/ROADMAP.md'

jobs:
  auto-rename:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Compile heuristic for direct Node regression
        run: |
          rm -rf /tmp/solyan-auto-rename-ts
          npx tsc lib/auto-rename.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir /tmp/solyan-auto-rename-ts

      - name: Gate PDF.js title extraction, sanitization and 200-line bound
        run: |
          set -euo pipefail
          node <<'NODE' 2>&1 | tee /tmp/auto-rename-ci.log
          const assert = require('node:assert/strict');
          const { PDFDocument, StandardFonts } = require('pdf-lib');
          const {
            chooseAutoRenameSuggestion,
            extractAutoRenameLines,
            sanitizePdfBaseName,
          } = require('/tmp/solyan-auto-rename-ts/auto-rename.js');

          (async () => {
            const source = await PDFDocument.create();
            const page = source.addPage([595, 842]);
            const font = await source.embedFont(StandardFonts.Helvetica);
            page.drawText('Small body text appears first', { x: 60, y: 730, size: 10, font });
            page.drawText('SolYan Flagship Document', { x: 60, y: 670, size: 24, font });
            page.drawText('More body text', { x: 60, y: 620, size: 11, font });
            const bytes = await source.save();

            const pdfjs = await import('pdfjs-dist/legacy/build/pdf.mjs');
            const task = pdfjs.getDocument({ data: new Uint8Array(bytes), disableWorker: true });
            const pdf = await task.promise;
            const lines = await extractAutoRenameLines(pdf, 200);
            const suggestion = chooseAutoRenameSuggestion(lines, 'original.pdf');
            console.log('lines:', lines);
            console.log('suggestion:', suggestion);
            assert.equal(suggestion.filename, 'SolYan Flagship Document.pdf');
            assert.equal(suggestion.page, 1);
            assert.equal(suggestion.fallback, false);
            await task.destroy();

            assert.equal(sanitizePdfBaseName('Title: Test/Doc*File'), 'Title TestDocFile');
            assert.equal(sanitizePdfBaseName('CON'), '');
            assert.equal(chooseAutoRenameSuggestion([], 'scan.pdf').filename, 'scan.pdf');
            assert.equal(
              chooseAutoRenameSuggestion([{ text: 'CON', fontSize: 30, page: 1, order: 0 }], 'fallback.pdf').filename,
              'fallback.pdf',
            );

            const fakePdf = {
              numPages: 1,
              async getPage() {
                return {
                  async getTextContent() {
                    return {
                      items: Array.from({ length: 230 }, (_, index) => ({
                        str: `Line ${index + 1}`,
                        transform: [10, 0, 0, 10, 50, 800 - index * 12],
                        height: 10,
                      })),
                    };
                  },
                };
              },
            };
            const bounded = await extractAutoRenameLines(fakePdf, 200);
            assert.equal(bounded.length, 200);
            console.log('200-line bound: PASS');
            console.log('Auto Rename PDF.js gate: PASS');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Gate local byte-preserving product wiring
        run: |
          set -euo pipefail
          grep -q "href: '/auto-rename'" app/page.tsx
          grep -q "extractAutoRenameLines" app/auto-rename/page.tsx
          grep -Fq "new Blob([bytes]" app/auto-rename/page.tsx
          grep -q "không rewrite file" app/auto-rename/page.tsx
          echo 'local byte-preserving UI wiring: PASS' | tee -a /tmp/auto-rename-ci.log

      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Upload Auto Rename evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-rename-ci-evidence
          path: /tmp/auto-rename-ci.log
          if-no-files-found: warn
          retention-days: 14
