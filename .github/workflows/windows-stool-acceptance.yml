name: Windows sTool Existing Installer Acceptance

# Optional release/integration gate. Reuse a packaged candidate: never rebuild
# engines/models/NSIS just to rerun a test or repair its driver.
on:
  push:
    branches:
      - 'test/stool-installer9-acceptance'
      - 'test/stool-installer10-acceptance'
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: Successful Windows sTool Installer run containing the candidate
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  accept-existing-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Resolve immutable candidate source
        id: candidate
        uses: actions/github-script@v7
        env:
          CANDIDATE_RUN: ${{ inputs.installer_run_id || '40340094919' }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.CANDIDATE_RUN)) throw new Error('Numeric run ID required');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.CANDIDATE_RUN)
            });
            if (run.path !== '.github/workflows/windows-stool-installer.yml' ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !/^[a-f0-9]{40}$/.test(run.head_sha)) throw new Error('Invalid installer candidate run');
            // A driver-only fix may test the SAME installer. Refuse a newer
            // product revision pretending to be the candidate's application.
            const {data: diff} = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${run.head_sha}...${context.sha}`
            });
            const testingOnly = /^(?:docs\/|\.github\/workflows\/|desktop\/(?:tests\/|stool-tests\/|backend\/(?:tests\/|stool-[^/]+\.ps1$|verify-installer-release\.ps1$|stool-package-manifest\.py$)))/;
            if (!['identical', 'ahead'].includes(diff.status) || diff.files.length >= 300 ||
                diff.files.some(f => !testingOnly.test(f.filename) || (f.previous_filename && !testingOnly.test(f.previous_filename)))) {
              throw new Error('Application source differs from installer; select its matching test revision');
            }
            core.setOutput('sha', run.head_sha);
      - name: Checkout compatible test driver (product identity checked above)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download existing installer
        uses: actions/download-artifact@v4
        with:
          name: sTool-PDF-Windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis
          run-id: ${{ inputs.installer_run_id || '40340094919' }}
          github-token: ${{ github.token }}
      - name: Download candidate checksum identity
        uses: actions/download-artifact@v4
        with:
          name: sTool-PDF-Windows-package-manifest
          path: candidate-manifest
          run-id: ${{ inputs.installer_run_id || '40340094919' }}
          github-token: ${{ github.token }}
      - name: Verify installer bytes against candidate source
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $manifest = Get-Content candidate-manifest/stool-package.json -Raw | ConvertFrom-Json
          $files = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Exactly one candidate required' }
          $file = $files[0]
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.repo -ne 'solyan842/SolYan-PDF' -or $manifest.source_commit -ne $env:CANDIDATE_SHA -or $manifest.installer_name -ne $file.Name -or $manifest.installer_bytes -ne $file.Length -or $manifest.installer_sha256 -ne $hash) { throw 'Candidate identity mismatch' }
          Copy-Item candidate-manifest/* artifacts/
          "candidate_sha=$env:CANDIDATE_SHA`ndriver_sha=$env:GITHUB_SHA" | Set-Content artifacts/stool-acceptance-source.log
          "Verified existing installer: $hash" | Tee-Object artifacts/stool-existing-candidate.log
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install verification dependencies only
        shell: pwsh
        run: |
          python -m pip install -r desktop/backend/requirements-sign-windows.txt Pillow==11.3.0 2>&1 | Tee-Object artifacts/stool-acceptance-deps.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .pdfa-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .pdfa-venv/Scripts/python.exe -m pip install -r desktop/backend/requirements-pdfa-windows.txt 2>&1 | Tee-Object artifacts/stool-acceptance-pdfa-deps.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop/stool-tests 2>&1 | Tee-Object artifacts/stool-test-driver.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full existing installed acceptance and D6 uninstall
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & ./desktop/backend/stool-installer-smoke.ps1 2>&1 | Tee-Object artifacts/stool-installer-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stool-existing-installer-acceptance
          path: |
            artifacts/
            !artifacts/stool-native/profile/**
          if-no-files-found: warn
