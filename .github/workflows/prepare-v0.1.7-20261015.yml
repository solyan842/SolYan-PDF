name: Prepare v0.1.7 metadata

on:
  push:
    branches:
      - release/v0.1.7-20261015
    paths:
      - '.github/workflows/prepare-v0.1.7-20261015.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.7-20261015

      - name: Synchronize v0.1.7 metadata
        run: python scripts/prepare-v0.1.7.py

      - name: Commit synchronized metadata and remove temporary release tooling
        run: |
          set -euo pipefail
          git config user.name 'SolYan Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/prepare-v0.1.7-20261015.yml
          git rm .github/workflows/diag-v0.1.7-actionlint.yml
          git rm scripts/prepare-v0.1.7.py
          git add CHANGELOG.md backend/app/main.py docs/RELEASE-MANIFEST.md docs/RELEASE-NOTES-v0.1.7.md docs/ROADMAP.md frontend/package.json frontend/package-lock.json frontend/app/page.tsx README.md
          git diff --cached --check
          git commit -m 'release: synchronize v0.1.7 metadata'
          git push origin HEAD:release/v0.1.7-20261015
