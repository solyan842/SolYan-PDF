name: PDF to Markdown CI

on:
  pull_request:
    paths:
      - 'backend/app/pdf_to_markdown.py'
      - 'backend/app/main.py'
      - 'engines/ocr-service/app/main.py'
      - 'frontend/app/pdf-to-markdown/**'
      - 'frontend/app/page.tsx'
      - 'docs/V1.3-PARITY-AUDIT.md'
      - '.github/workflows/pdf-to-markdown-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/pdf_to_markdown.py'
      - 'backend/app/main.py'
      - 'engines/ocr-service/app/main.py'
      - 'frontend/app/pdf-to-markdown/**'
      - 'frontend/app/page.tsx'
      - 'docs/V1.3-PARITY-AUDIT.md'
      - '.github/workflows/pdf-to-markdown-ci.yml'

jobs:
  pdf-to-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'

      - name: Install lightweight production-route dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r backend/requirements.hashed.lock
          python -m pip install --no-deps -r backend/requirements.txt
          python -m pip install httpx==0.28.1
          python -m pip check

      - name: Compile backend and OCR service
        run: python -m compileall backend/app engines/ocr-service/app

      - name: Gate production OCR Markdown assembly
        working-directory: engines/ocr-service
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/solyan-pdf-markdown
          python <<'PY' 2>&1 | tee /tmp/solyan-pdf-markdown/gate.log
          from pathlib import Path
          from fastapi.testclient import TestClient
          import app.main as ocr_main

          class FakeResult:
              def __init__(self, page, markdown):
                  self.page = page
                  self.markdown = markdown

              @property
              def json(self):
                  return {'page': self.page, 'type': 'fake-layout-result'}

              def save_to_markdown(self, save_path):
                  Path(save_path, f'page-{self.page:03d}.md').write_text(self.markdown, encoding='utf-8')

          def fake_structure_results(_input_path):
              return [
                  FakeResult(1, '# Tiêu đề\n\nĐoạn tiếng Việt.'),
                  FakeResult(2, '| A | B |\n|---|---|\n| 1 | 2 |'),
              ]

          original = ocr_main._structure_results
          ocr_main._structure_results = fake_structure_results
          try:
              client = TestClient(ocr_main.app)
              response = client.post(
                  '/ocr/structured',
                  files={'file': ('fixture.pdf', b'%PDF-1.7\n%fake', 'application/pdf')},
              )
          finally:
              ocr_main._structure_results = original

          assert response.status_code == 200, response.text
          payload = response.json()
          assert payload['engine'] == 'PP-StructureV3', payload
          assert len(payload['pages']) == 2, payload
          assert payload['markdown'] == '# Tiêu đề\n\nĐoạn tiếng Việt.\n\n---\n\n| A | B |\n|---|---|\n| 1 | 2 |', payload['markdown']
          Path('/tmp/solyan-pdf-markdown/ocr-output.md').write_text(payload['markdown'], encoding='utf-8')
          print('production OCR save_to_markdown assembly: PASS')
          PY

      - name: Gate production PDF Markdown adapter
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python <<'PY' 2>&1 | tee -a /tmp/solyan-pdf-markdown/gate.log
          import httpx
          from fastapi.testclient import TestClient
          from unittest.mock import patch

          from app.main import app

          markdown = '# Tiêu đề\n\nĐoạn tiếng Việt.\n\n---\n\n| A | B |\n|---|---|\n| 1 | 2 |'

          def structured_response(*_args, **_kwargs):
              return httpx.Response(
                  200,
                  json={
                      'mode': 'structured',
                      'engine': 'PP-StructureV3',
                      'pages': [{'page': 1}, {'page': 2}],
                      'markdown': markdown,
                  },
              )

          client = TestClient(app)
          with patch('app.pdf_to_markdown._post_bytes', side_effect=structured_response) as upstream:
              response = client.post(
                  '/pdf/to-markdown',
                  files={'file': ('fixture.pdf', b'%PDF-1.7\n%fixture', 'application/pdf')},
              )

          assert response.status_code == 200, response.text
          assert response.content.decode('utf-8') == markdown
          assert response.headers['content-type'].startswith('text/markdown')
          assert response.headers['content-disposition'] == 'attachment; filename="solyan-pdf.md"'
          assert response.headers['x-solyan-markdown-engine'] == 'PP-StructureV3'
          assert response.headers['x-solyan-markdown-pages'] == '2'
          assert upstream.call_args.args[0] == '/ocr/structured', upstream.call_args

          non_pdf = client.post(
              '/pdf/to-markdown',
              files={'file': ('notes.txt', b'hello', 'text/plain')},
          )
          assert non_pdf.status_code == 400, non_pdf.text

          def missing_markdown(*_args, **_kwargs):
              return httpx.Response(200, json={'engine': 'PP-StructureV3', 'pages': []})

          with patch('app.pdf_to_markdown._post_bytes', side_effect=missing_markdown):
              malformed = client.post(
                  '/pdf/to-markdown',
                  files={'file': ('fixture.pdf', b'%PDF-1.7\n%fixture', 'application/pdf')},
              )
          assert malformed.status_code == 502, malformed.text
          print('production PDF Markdown adapter: PASS')
          PY

      - name: Gate router reuse and product boundary
        run: |
          set -euo pipefail
          grep -q 'from .ocr_proxy import _json_response, _post_bytes, _read_upload' backend/app/pdf_to_markdown.py
          grep -q '_post_bytes("/ocr/structured"' backend/app/pdf_to_markdown.py
          grep -q 'from .pdf_to_markdown import router as pdf_to_markdown_router' backend/app/main.py
          grep -q 'app.include_router(pdf_to_markdown_router)' backend/app/main.py
          grep -q '/pdf/to-markdown' frontend/app/pdf-to-markdown/page.tsx
          grep -q "href: '/pdf-to-markdown'" frontend/app/page.tsx
          grep -q 'không phải chuyển đổi byte-perfect' frontend/app/pdf-to-markdown/page.tsx
          echo 'OCR reuse/UI/explicit semantic boundary wiring: PASS' | tee -a /tmp/solyan-pdf-markdown/gate.log

      - name: Upload PDF to Markdown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-markdown-evidence
          path: |
            /tmp/solyan-pdf-markdown/gate.log
            /tmp/solyan-pdf-markdown/ocr-output.md
          if-no-files-found: warn
          retention-days: 14
