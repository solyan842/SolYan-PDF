name: Page Geometry CI

on:
  pull_request:
    paths:
      - 'frontend/lib/page-geometry.ts'
      - 'frontend/lib/n-up.ts'
      - 'frontend/app/crop/**'
      - 'frontend/app/resize-pages/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/page-geometry-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/lib/page-geometry.ts'
      - 'frontend/lib/n-up.ts'
      - 'frontend/app/crop/**'
      - 'frontend/app/resize-pages/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/page-geometry-ci.yml'

jobs:
  geometry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          qpdf --version
          pdfinfo -v

      - name: Compile geometry helpers
        run: |
          rm -rf .tmp-geometry
          npx tsc lib/n-up.ts lib/page-geometry.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --noEmit false \
            --outDir .tmp-geometry

      - name: Verify crop boxes and real resized PDFs
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { PDFDocument, StandardFonts, degrees } = require('pdf-lib');
          const {
            cropPdf,
            planCropBox,
            resizePdf,
            resolveTargetPageSize,
          } = require('./.tmp-geometry/page-geometry.js');

          const margins = { left: 50, right: 70, top: 80, bottom: 60 };
          assert.deepEqual(
            planCropBox({ x: 10, y: 20, width: 400, height: 600 }, margins),
            { x: 60, y: 80, width: 280, height: 460 },
          );
          assert.throws(
            () => planCropBox({ x: 0, y: 0, width: 100, height: 100 }, { left: 60, right: 60, top: 0, bottom: 0 }),
            /quá nhỏ hoặc âm/,
          );

          const a4Landscape = resolveTargetPageSize({ pageSize: 'A4', orientation: 'landscape', scaleFactor: 1 });
          assert.ok(Math.abs(a4Landscape.width - 841.89) < 0.01);
          assert.ok(Math.abs(a4Landscape.height - 595.28) < 0.01);
          assert.deepEqual(
            resolveTargetPageSize({ pageSize: 'CUSTOM', orientation: 'landscape', scaleFactor: 1, customWidth: 700, customHeight: 500 }),
            { width: 700, height: 500 },
          );

          (async () => {
            const source = await PDFDocument.create();
            const font = await source.embedFont(StandardFonts.Helvetica);
            for (let i = 0; i < 3; i += 1) {
              const page = source.addPage([400, 600]);
              if (i === 1) page.setRotation(degrees(90));
              page.drawText(`GEOMETRY PAGE ${i + 1}`, { x: 135, y: 300, size: 16, font });
              page.drawText(`OUTSIDE ${i + 1}`, { x: 6, y: 8, size: 8, font });
            }
            const sourceBytes = await source.save();

            const croppedBytes = await cropPdf(sourceBytes, margins, [0, 2]);
            fs.writeFileSync('/tmp/solyan-cropped.pdf', Buffer.from(croppedBytes));
            const cropped = await PDFDocument.load(croppedBytes);
            assert.equal(cropped.getPageCount(), 3);
            const c0 = cropped.getPage(0).getCropBox();
            const m0 = cropped.getPage(0).getMediaBox();
            assert.deepEqual([c0.x, c0.y, c0.width, c0.height].map(Math.round), [50, 60, 280, 460]);
            assert.deepEqual([m0.x, m0.y, m0.width, m0.height].map(Math.round), [50, 60, 280, 460]);
            const c1 = cropped.getPage(1).getCropBox();
            assert.deepEqual([c1.x, c1.y, c1.width, c1.height].map(Math.round), [0, 0, 400, 600]);
            assert.equal(cropped.getPage(1).getRotation().angle, 90);
            const c2 = cropped.getPage(2).getCropBox();
            assert.deepEqual([c2.x, c2.y, c2.width, c2.height].map(Math.round), [50, 60, 280, 460]);

            const resizedBytes = await resizePdf(sourceBytes, {
              pageSize: 'A4',
              orientation: 'landscape',
              scaleFactor: 0.9,
            });
            fs.writeFileSync('/tmp/solyan-resized-a4.pdf', Buffer.from(resizedBytes));
            const resized = await PDFDocument.load(resizedBytes);
            assert.equal(resized.getPageCount(), 3);
            for (const page of resized.getPages()) {
              const size = page.getSize();
              assert.ok(Math.abs(size.width - 841.89) < 0.05, size.width);
              assert.ok(Math.abs(size.height - 595.28) < 0.05, size.height);
              assert.equal(page.getRotation().angle, 0);
            }

            const customBytes = await resizePdf(sourceBytes, {
              pageSize: 'CUSTOM',
              orientation: 'landscape',
              scaleFactor: 1,
              customWidth: 700,
              customHeight: 500,
            });
            fs.writeFileSync('/tmp/solyan-resized-custom.pdf', Buffer.from(customBytes));
            const custom = await PDFDocument.load(customBytes);
            assert.deepEqual(custom.getPage(0).getSize(), { width: 700, height: 500 });

            await assert.rejects(
              () => resizePdf(sourceBytes, { pageSize: 'A4', orientation: 'portrait', scaleFactor: 2.1 }),
              /10% đến 200%/,
            );
            console.log('crop and resize geometry ok');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

          qpdf --check /tmp/solyan-cropped.pdf
          qpdf --check /tmp/solyan-resized-a4.pdf
          qpdf --check /tmp/solyan-resized-custom.pdf
          test "$(pdfinfo /tmp/solyan-cropped.pdf | awk '/^Pages:/ {print $2}')" = "3"
          test "$(pdfinfo /tmp/solyan-resized-a4.pdf | awk '/^Pages:/ {print $2}')" = "3"
          pdftotext /tmp/solyan-cropped.pdf /tmp/solyan-cropped.txt
          pdftotext /tmp/solyan-resized-a4.pdf /tmp/solyan-resized-a4.txt
          for page in 1 2 3; do
            grep -q "GEOMETRY PAGE ${page}" /tmp/solyan-cropped.txt
            grep -q "GEOMETRY PAGE ${page}" /tmp/solyan-resized-a4.txt
          done

      - name: Remove temporary compiled helpers
        if: always()
        run: rm -rf .tmp-geometry
