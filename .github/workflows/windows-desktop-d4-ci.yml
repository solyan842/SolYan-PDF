name: Windows Desktop D4 - Installer Gate
on:
  push:
    branches:
      - feat/windows-desktop-d4-text-integration
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop-d4-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-d4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Prepare durable diagnostics
        run: New-Item -ItemType Directory -Force -Path diagnostic | Out-Null
      - name: Verify desktop installer prerequisites
        id: preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'desktop/src-tauri/Cargo.toml',
            'desktop/src-tauri/tauri.conf.json',
            'desktop/ui/index.html',
            'desktop/src-tauri/resources/core',
            'desktop/src-tauri/resources/office'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            $message = "MISSING DESKTOP PACKAGING RESOURCES:`n" + ($missing -join "`n")
            $message | Tee-Object -FilePath diagnostic/preflight.txt
            throw $message
          }
          'Desktop packaging prerequisites found' | Tee-Object -FilePath diagnostic/preflight.txt
      - name: Install Tauri CLI
        if: steps.preflight.outcome == 'success'
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build NSIS installer
        if: steps.preflight.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Continue'
          cargo tauri build --ci --bundles nsis --manifest-path desktop/src-tauri/Cargo.toml *>&1 | Tee-Object -FilePath diagnostic/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record installer hashes
        if: success()
        run: |
          $files = @(Get-ChildItem -Path desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'No NSIS EXE was produced' }
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path)" } | Set-Content diagnostic/SHA256SUMS.txt
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-d4-diagnostics
          path: diagnostic/
          retention-days: 14
      - name: Upload NSIS installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: solyan-pdf-windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
