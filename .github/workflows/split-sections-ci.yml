name: Split Sections CI

on:
  pull_request:
    paths:
      - 'frontend/lib/split-sections.ts'
      - 'frontend/lib/n-up.ts'
      - 'frontend/lib/pdf-client.ts'
      - 'frontend/app/split-sections/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/split-sections-ci.yml'
      - 'docs/ROADMAP.md'
  push:
    branches:
      - main
    paths:
      - 'frontend/lib/split-sections.ts'
      - 'frontend/lib/n-up.ts'
      - 'frontend/lib/pdf-client.ts'
      - 'frontend/app/split-sections/**'
      - 'frontend/app/page.tsx'
      - '.github/workflows/split-sections-ci.yml'
      - 'docs/ROADMAP.md'

jobs:
  split-sections:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          qpdf --version
      - name: Compile split-sections helper
        run: |
          rm -rf .tmp-split-sections
          npx tsc lib/n-up.ts lib/pdf-client.ts lib/split-sections.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --noEmit false \
            --outDir .tmp-split-sections
      - name: Verify planning, merge, parts and rotated CropBox
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { PDFDocument, StandardFonts, degrees } = require('pdf-lib');
          const { planSectionPieces, resolveSectionPages, createMergedSectionPdf, createSectionParts } = require('./.tmp-split-sections/split-sections.js');

          (async () => {
            assert.deepEqual([...resolveSectionPages(4, 'except-first-last')], [1, 2]);
            assert.deepEqual([...resolveSectionPages(4, 'custom', '1,3-4')], [0, 2, 3]);
            const plans = planSectionPieces(
              [{width:400,height:200},{width:300,height:300},{width:400,height:200}],
              { columns:2, rows:2, mode:'custom', customPages:'1,3' },
            );
            assert.equal(plans.length, 9);
            assert.deepEqual(plans.slice(0,4).map((p)=>[p.sectionNumber,p.column,p.row,p.cropX,p.cropY]), [
              [1,0,0,0,100], [2,0,1,0,0], [3,1,0,200,100], [4,1,1,200,0],
            ]);
            assert.equal(plans[4].split, false);
            assert.equal(plans[4].sourceIndex, 1);

            const source = await PDFDocument.create();
            const font = await source.embedFont(StandardFonts.Helvetica);
            const p1 = source.addPage([400,200]);
            p1.drawText('A-TOP-LEFT', {x:30,y:150,size:14,font});
            p1.drawText('B-BOTTOM-LEFT', {x:30,y:50,size:14,font});
            p1.drawText('C-TOP-RIGHT', {x:235,y:150,size:14,font});
            p1.drawText('D-BOTTOM-RIGHT', {x:235,y:50,size:14,font});
            const p2 = source.addPage([300,300]);
            p2.drawText('PAGE-TWO-FULL', {x:70,y:150,size:16,font});
            const p3 = source.addPage([400,200]);
            p3.drawText('PAGE-THREE', {x:150,y:100,size:16,font});
            const bytes = await source.save();

            const merged = await createMergedSectionPdf(bytes, {columns:2,rows:2,mode:'custom',customPages:'1,3'});
            fs.writeFileSync('/tmp/sections-merged.pdf', Buffer.from(merged));
            const mergedDoc = await PDFDocument.load(merged);
            assert.equal(mergedDoc.getPageCount(), 9);
            assert.deepEqual(mergedDoc.getPage(0).getSize(), {width:200,height:100});
            assert.deepEqual(mergedDoc.getPage(4).getSize(), {width:300,height:300});

            const parts = await createSectionParts(bytes, {columns:2,rows:2,mode:'custom',customPages:'1,3'});
            assert.equal(parts.length, 9);
            assert.equal(parts[0].filename, 'page-001-section-01.pdf');
            assert.equal(parts[4].filename, 'page-002.pdf');
            parts.slice(0,5).forEach((part,index)=>fs.writeFileSync(`/tmp/section-part-${index+1}.pdf`, Buffer.from(part.bytes)));

            const rotatedSource = await PDFDocument.create();
            const rotatedFont = await rotatedSource.embedFont(StandardFonts.Helvetica);
            const rp = rotatedSource.addPage([400,300]);
            rp.setCropBox(50,25,250,200);
            rp.setRotation(degrees(90));
            rp.drawText('ROTATED-SECTION', {x:105,y:110,size:16,font:rotatedFont});
            const rotated = await createMergedSectionPdf(await rotatedSource.save(), {columns:1,rows:1,mode:'all'});
            fs.writeFileSync('/tmp/sections-rotated.pdf', Buffer.from(rotated));
            const rd = await PDFDocument.load(rotated);
            assert.equal(rd.getPageCount(), 1);
            const rs = rd.getPage(0).getSize();
            assert.ok(Math.abs(rs.width-200)<0.1 && Math.abs(rs.height-250)<0.1, rs);
            console.log('split-sections planner and PDF generation ok');
          })().catch((error)=>{ console.error(error); process.exit(1); });
          NODE

          qpdf --check /tmp/sections-merged.pdf
          qpdf --check /tmp/sections-rotated.pdf
          for file in /tmp/section-part-*.pdf; do qpdf --check "$file"; done

          pdftotext -f 1 -l 1 /tmp/sections-merged.pdf - | grep -q 'A-TOP-LEFT'
          pdftotext -f 2 -l 2 /tmp/sections-merged.pdf - | grep -q 'B-BOTTOM-LEFT'
          pdftotext -f 3 -l 3 /tmp/sections-merged.pdf - | grep -q 'C-TOP-RIGHT'
          pdftotext -f 4 -l 4 /tmp/sections-merged.pdf - | grep -q 'D-BOTTOM-RIGHT'
          pdftotext -f 5 -l 5 /tmp/sections-merged.pdf - | grep -q 'PAGE-TWO-FULL'
          pdftotext /tmp/sections-rotated.pdf - | grep -q 'ROTATED-SECTION'
      - name: Remove temporary compiled helper
        if: always()
        run: rm -rf .tmp-split-sections
