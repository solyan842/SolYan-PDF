name: Bloom PPTX Commons Debug

on:
  push:
    branches:
      - benchmark/pdf-office-real-diagnostic-v1
    paths:
      - '.github/workflows/bloom-pptx-commons-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BLOOM_REPO: https://github.com/stemlen/bloom-pdf-editor.git
  BLOOM_COMMIT: 9ed16c43e356cffd4bd3b004b0dab19e582a59d5
  BLOOM_PATCH: patches/bloom/table-cluster-group-bottom.patch
  REAL_MANIFEST: benchmarks/corpora/pdf_to_office_real_diagnostic_v1.json

jobs:
  debug-pptx:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SolYan PDF
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install debug dependencies
        run: pip install httpx==0.28.1 pypdf==6.1.1 cryptography==46.0.3

      - name: Materialize pinned Commons presentation PDF
        run: |
          set -euo pipefail
          mkdir -p /tmp/pptx-corpus
          python benchmarks/fetch_pdf_to_office_real_corpus.py \
            --manifest "$REAL_MANIFEST" \
            --case-id pptx-commons-copyright \
            --output-dir /tmp/pptx-corpus \
            --output-inventory /tmp/pptx-inventory.json

      - name: Fetch pinned Bloom and apply SolYan patch
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$BLOOM_REPO" /tmp/bloom
          git -C /tmp/bloom fetch --depth=1 origin "$BLOOM_COMMIT"
          git -C /tmp/bloom checkout --detach "$BLOOM_COMMIT"
          test "$(git -C /tmp/bloom rev-parse HEAD)" = "$BLOOM_COMMIT"
          git -C /tmp/bloom apply --check "$GITHUB_WORKSPACE/$BLOOM_PATCH"
          git -C /tmp/bloom apply "$GITHUB_WORKSPACE/$BLOOM_PATCH"

      - name: Build debug images
        run: |
          docker build -t solyan-bloom-pptx-debug /tmp/bloom/server
          docker build -t solyan-office-pptx-debug engines/office-service
          docker build -t solyan-backend-pptx-debug backend

      - name: Start isolated debug stack
        run: |
          docker network create solyan-bloom-pptx-debug
          docker run -d --name bloom-pptx-debug --network solyan-bloom-pptx-debug \
            -e BLOOM_STORAGE_ROOT=/tmp/bloom-storage \
            solyan-bloom-pptx-debug
          docker run -d --name office-pptx-debug --network solyan-bloom-pptx-debug solyan-office-pptx-debug
          docker run -d --name backend-pptx-debug --network solyan-bloom-pptx-debug -p 8000:8000 \
            -e BLOOM_SERVICE_URL=http://bloom-pptx-debug:8787 \
            -e OFFICE_SERVICE_URL=http://office-pptx-debug:8020 \
            solyan-backend-pptx-debug

      - name: Wait for health
        run: |
          python - <<'PY'
          import time
          import urllib.request

          for url in (
              'http://127.0.0.1:8000/health',
              'http://127.0.0.1:8000/experimental/bloom/health',
          ):
              deadline = time.monotonic() + 180
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if 200 <= response.status < 300:
                              print(url, response.read().decode('utf-8', 'replace'))
                              break
                  except Exception as exc:
                      if time.monotonic() >= deadline:
                          raise SystemExit(f'health timeout for {url}: {exc}')
                      time.sleep(3)
          PY

      - name: Capture and inspect Bloom PPTX
        run: |
          set -euo pipefail
          mkdir -p /tmp/pptx-debug
          python - <<'PY'
          import io
          import json
          import posixpath
          import re
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import httpx

          pdf_path = Path('/tmp/pptx-corpus/pptx-commons-copyright.pdf')
          source = pdf_path.read_bytes()
          output_dir = Path('/tmp/pptx-debug')
          pptx_path = output_dir / 'pptx-commons-copyright-bloom.pptx'
          diag_path = output_dir / 'diagnostics.json'
          roundtrip_path = output_dir / 'roundtrip.pdf'

          diagnostics = {
              'pdf_bytes': len(source),
              'pptx_bytes': 0,
              'zip_valid': False,
              'zip_test_error': None,
              'entry_count': 0,
              'duplicate_entries': [],
              'missing_required_entries': [],
              'xml_parse_errors': [],
              'forbidden_xml_controls': [],
              'missing_relationship_targets': [],
              'missing_content_type_parts': [],
              'slide_count': 0,
              'slide_rel_ids_missing': [],
              'office_status': None,
              'office_body': None,
              'roundtrip_pdf_bytes': 0,
          }

          with httpx.Client(timeout=360.0) as client:
              converted = client.post(
                  'http://127.0.0.1:8000/experimental/pdf-to-office',
                  files={'file': (pdf_path.name, source, 'application/pdf')},
                  data={'target': 'pptx'},
              )
              converted.raise_for_status()
              pptx = converted.content
              diagnostics['pptx_bytes'] = len(pptx)
              pptx_path.write_bytes(pptx)

              required = {
                  '[Content_Types].xml',
                  '_rels/.rels',
                  'ppt/presentation.xml',
                  'ppt/_rels/presentation.xml.rels',
              }
              rel_ns = {'r': 'http://schemas.openxmlformats.org/package/2006/relationships'}
              p_ns = {
                  'p': 'http://schemas.openxmlformats.org/presentationml/2006/main',
                  'r': 'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
              }
              ct_ns = {'ct': 'http://schemas.openxmlformats.org/package/2006/content-types'}
              forbidden = re.compile(rb'[\x00-\x08\x0b\x0c\x0e-\x1f]')

              try:
                  with zipfile.ZipFile(io.BytesIO(pptx), 'r') as archive:
                      all_names = archive.namelist()
                      names = set(all_names)
                      diagnostics['zip_valid'] = True
                      diagnostics['entry_count'] = len(all_names)
                      diagnostics['zip_test_error'] = archive.testzip()
                      diagnostics['duplicate_entries'] = sorted(
                          {name for name in all_names if all_names.count(name) > 1}
                      )
                      diagnostics['missing_required_entries'] = sorted(required - names)

                      xml_roots = {}
                      for name in sorted(names):
                          if not (name.endswith('.xml') or name.endswith('.rels')):
                              continue
                          raw = archive.read(name)
                          controls = [(match.start(), match.group(0).hex()) for match in forbidden.finditer(raw)]
                          if controls:
                              diagnostics['forbidden_xml_controls'].append({
                                  'entry': name,
                                  'controls': controls[:32],
                              })
                          try:
                              xml_roots[name] = ET.fromstring(raw)
                          except Exception as exc:
                              diagnostics['xml_parse_errors'].append({'entry': name, 'error': str(exc)})

                      for rel_name, root in sorted(xml_roots.items()):
                          if not rel_name.endswith('.rels'):
                              continue
                          if rel_name == '_rels/.rels':
                              source_part = ''
                          elif '/_rels/' in rel_name:
                              prefix, tail = rel_name.rsplit('/_rels/', 1)
                              source_part = posixpath.join(prefix, tail[:-5])
                          else:
                              continue
                          base_dir = posixpath.dirname(source_part)
                          for rel in root.findall('r:Relationship', rel_ns):
                              if rel.attrib.get('TargetMode') == 'External':
                                  continue
                              target = rel.attrib.get('Target', '')
                              if not target:
                                  continue
                              resolved = posixpath.normpath(posixpath.join(base_dir, target)).lstrip('/')
                              if resolved not in names:
                                  diagnostics['missing_relationship_targets'].append({
                                      'rels': rel_name,
                                      'id': rel.attrib.get('Id'),
                                      'target': target,
                                      'resolved': resolved,
                                  })

                      content_root = xml_roots.get('[Content_Types].xml')
                      if content_root is not None:
                          for override in content_root.findall('ct:Override', ct_ns):
                              part = override.attrib.get('PartName', '').lstrip('/')
                              if part and part not in names:
                                  diagnostics['missing_content_type_parts'].append(part)

                      presentation = xml_roots.get('ppt/presentation.xml')
                      presentation_rels = xml_roots.get('ppt/_rels/presentation.xml.rels')
                      if presentation is not None:
                          slide_ids = presentation.findall('.//p:sldId', p_ns)
                          diagnostics['slide_count'] = len(slide_ids)
                          rel_ids = set()
                          if presentation_rels is not None:
                              rel_ids = {
                                  rel.attrib.get('Id')
                                  for rel in presentation_rels.findall('r:Relationship', rel_ns)
                              }
                          for slide_id in slide_ids:
                              rid = slide_id.attrib.get('{http://schemas.openxmlformats.org/officeDocument/2006/relationships}id')
                              if rid not in rel_ids:
                                  diagnostics['slide_rel_ids_missing'].append(rid)
              except Exception as exc:
                  diagnostics['zip_error'] = str(exc)

              office = client.post(
                  'http://127.0.0.1:8000/office/to-pdf',
                  files={'file': ('roundtrip.pptx', pptx, 'application/octet-stream')},
              )
              diagnostics['office_status'] = office.status_code
              diagnostics['office_body'] = office.text[:4000] if office.status_code >= 400 else None
              if office.status_code < 400:
                  diagnostics['roundtrip_pdf_bytes'] = len(office.content)
                  roundtrip_path.write_bytes(office.content)

          diag_path.write_text(json.dumps(diagnostics, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(diagnostics, ensure_ascii=False, indent=2))
          PY

      - name: Capture container logs
        if: always()
        run: |
          mkdir -p /tmp/pptx-debug
          for name in bloom-pptx-debug office-pptx-debug backend-pptx-debug; do
            docker logs "$name" > "/tmp/pptx-debug/${name}.log" 2>&1 || true
          done

      - name: Upload PPTX debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloom-pptx-commons-debug
          path: /tmp/pptx-debug/
          if-no-files-found: error
          retention-days: 7

      - name: Stop debug stack
        if: always()
        run: |
          docker rm -f backend-pptx-debug office-pptx-debug bloom-pptx-debug 2>/dev/null || true
          docker network rm solyan-bloom-pptx-debug 2>/dev/null || true
