name: Publish v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release content
        uses: actions/checkout@v4
        with:
          ref: 51133e124952c4cad405c25ba03b45d84f4579a4

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.1.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --target 51133e124952c4cad405c25ba03b45d84f4579a4 \
            --title "SolYan PDF v0.1.0" \
            --notes-file CHANGELOG.md
