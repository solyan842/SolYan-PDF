services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      SOLYAN_ALLOWED_ORIGINS: ${SOLYAN_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      ALLOW_PRIVATE_NETWORK_UTILITIES: ${ALLOW_PRIVATE_NETWORK_UTILITIES:-0}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr-service:8010}
      OFFICE_SERVICE_URL: ${OFFICE_SERVICE_URL:-http://office-service:8020}
      SIGN_SERVICE_URL: ${SIGN_SERVICE_URL:-http://sign-service:8030}
      ARCHIVE_SERVICE_URL: ${ARCHIVE_SERVICE_URL:-http://archive-service:8040}
      BLOOM_SERVICE_URL: ${BLOOM_SERVICE_URL:-http://bloom-service:8787}
      BLOOM_API_KEY: ${BLOOM_API_KEY:-}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}
      SITE_RANK_API_TEMPLATE: ${SITE_RANK_API_TEMPLATE:-https://tranco-list.eu/api/ranks/domain/{domain}}
    ports:
      - "8000:8000"
    depends_on:
      ocr-service:
        condition: service_healthy
      office-service:
        condition: service_healthy
      sign-service:
        condition: service_healthy
      archive-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ocr-service:
    build:
      context: ./engines/ocr-service
    expose:
      - "8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=4).read()"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  office-service:
    build:
      context: ./engines/office-service
    expose:
      - "8020"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=4).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  sign-service:
    build:
      context: ./engines/sign-service
    expose:
      - "8030"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=4).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  archive-service:
    build:
      context: ./engines/archive-service
    expose:
      - "8040"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/health', timeout=4).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

# Experimental Bloom PDF -> Office is intentionally not bundled here.
# Deploy the pinned upstream Bloom service separately and set BLOOM_SERVICE_URL.
