<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolYan PDF Desktop</title><link rel="stylesheet" href="./tool.css"></head><body class="tool-shell"><div class="tool-layout"><aside class="tool-sidebar"><a class="back-link" href="./index.html">← Trang chủ</a><div class="desktop-brand">SolYan PDF</div><p class="desktop-subtitle">Windows Desktop</p><hr class="tool-divider"><div class="sidebar-links">Sắp xếp PDF<br>Chuyển đổi<br>Chỉnh sửa<br>Bảo mật<br>OCR & Scan<br>Cloud</div></aside><main class="tool-main"><div class="tool-top"><a id="breadcrumb" class="back-link" href="./index.html">Công cụ</a><span id="engineLabel" class="muted-small"></span></div><div class="tool-title"><div id="toolIcon" class="big-icon">◇</div><div><h1 id="toolTitle">Công cụ PDF</h1><p id="toolDescription"></p></div></div><div class="repair-layout"><section class="surface"><div id="dropzone" class="dropzone"><div class="upload-icon">⇧</div><h2>Chọn tệp PDF</h2><p id="dropHint">Kéo PDF vào đây hoặc chọn từ máy tính.</p><input id="fileInput" type="file" accept="application/pdf,.pdf" hidden><button id="pickFile" class="primary">＋ Chọn tệp PDF</button><div class="upload-helper">Xử lý cục bộ · PDF nguồn không bị ghi đè</div></div><div id="selectedFile" class="selected-file" hidden><div class="selected-file-icon">PDF</div><div class="selected-file-body"><strong id="fileName"></strong><span id="fileMeta"></span></div><button id="removeFile" class="secondary-button" type="button">Xóa</button></div><div id="result" class="active-report" hidden><div id="resultMessage" class="verdict-card clear"></div></div></section><aside class="surface options"><h2 id="optionTitle">Thiết lập</h2><p id="optionDescription" class="status-text"></p><div id="warning" class="security-note" hidden></div><button id="runBtn" class="primary merge-btn" disabled>Thực hiện →</button><p id="status" class="status-text">Chọn một tệp PDF để bắt đầu.</p></aside></div></main></div><script src="./output-name.js"></script><script src="./transform.js"></script></body></html>
