<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiện ích — SolYan PDF</title><link rel="stylesheet" href="./tool.css"></head>
<body class="tool-shell"><div class="tool-layout"><aside class="tool-sidebar"><a class="back-link" href="./index.html">← Trang chủ</a><div class="desktop-brand">SolYan PDF</div><p class="desktop-subtitle">Windows Desktop</p><hr class="tool-divider"><div class="sidebar-links">Sắp xếp PDF<br>Chuyển đổi<br>Chỉnh sửa<br>Bảo mật<br>OCR &amp; Scan<br>Tiện ích Việt Nam</div></aside>
<main class="tool-main"><div class="tool-top"><a class="back-link" href="./index.html">Công cụ › Tiện ích</a><span class="muted-small">Tính toán cục bộ · Không tải dữ liệu lên</span></div><div class="tool-title"><div id="toolIcon" class="big-icon">123</div><div><h1 id="toolTitle">Tiện ích</h1><p id="toolDescription"></p></div></div>
<div class="repair-layout"><section class="surface"><div id="inputGroup" class="option-group"><div id="numberGroup" hidden><label for="numberInput">Số nguyên</label><input id="numberInput" class="text-input" type="number" min="0" step="1" value="1005"></div>
<div id="vnTextGroup" hidden><label for="vnText">Văn bản</label><textarea id="vnText" class="text-input" rows="7" placeholder="Nhập văn bản tiếng Việt"></textarea><label for="vnAction">Thao tác</label><select id="vnAction" class="text-input"><option value="normalize">Chuẩn hóa Unicode và khoảng trắng</option><option value="upper">Chuyển thành chữ hoa</option><option value="lower">Chuyển thành chữ thường</option></select></div>
<div id="vatGroup" hidden><label for="vatAmount">Số tiền (VNĐ)</label><input id="vatAmount" class="text-input" type="number" min="0" value="100000"><label for="vatRate">Thuế suất (%)</label><select id="vatRate" class="text-input"><option value="5">5%</option><option value="8">8%</option><option value="10" selected>10%</option></select><label for="vatMode">Số tiền nhập</label><select id="vatMode" class="text-input"><option value="before">Giá chưa gồm VAT</option><option value="inclusive">Giá đã gồm VAT</option></select></div>
<div id="percentGroup" hidden><label for="percentBase">Giá trị ban đầu</label><input id="percentBase" class="text-input" type="number" value="200"><label for="percentNext">Giá trị mới</label><input id="percentNext" class="text-input" type="number" value="150"></div>
<div id="ageGroup" hidden><label for="birthDate">Ngày sinh</label><input id="birthDate" class="text-input" type="date"><label for="asOfDate">Tính đến ngày</label><input id="asOfDate" class="text-input" type="date"></div>
<div id="bmiGroup" hidden><label for="weightKg">Cân nặng (kg)</label><input id="weightKg" class="text-input" type="number" min="1" step="0.1" value="70"><label for="heightCm">Chiều cao (cm)</label><input id="heightCm" class="text-input" type="number" min="1" step="0.1" value="175"></div>
<div id="airconGroup" hidden><label for="areaM2">Diện tích phòng (m²)</label><input id="areaM2" class="text-input" type="number" min="1" step="0.1" value="20"><label for="sunlight">Điều kiện nắng</label><select id="sunlight" class="text-input"><option value="550">Ít nắng</option><option value="600" selected>Bình thường</option><option value="700">Nắng nhiều</option></select></div>
<button id="calculate" class="primary merge-btn" type="button">Tính →</button><p id="status" class="status-text" role="status">Nhập dữ liệu và chọn Tính.</p></div></section>
<aside class="surface"><h2>Kết quả</h2><div id="result" class="verdict-card clear" aria-live="polite">Kết quả sẽ hiển thị tại đây.</div><p id="note" class="option-note"></p></aside></div></main></div><script src="./utility-tools.js"></script></body></html>
