<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Che và đánh dấu PDF — SolYan PDF</title><link rel="stylesheet" href="./tool.css"><link rel="stylesheet" href="./redaction-tools.css"></head>
<body class="tool-shell"><div class="tool-layout"><aside class="tool-sidebar"><a class="back-link" href="./index.html">← Trang chủ</a><div class="desktop-brand">SolYan PDF</div><p class="desktop-subtitle">Windows Desktop</p><hr class="tool-divider"><div class="sidebar-links">Chỉnh sửa PDF<br>Đánh dấu<br>Bảo mật</div></aside>
<main class="tool-main"><div class="tool-top"><a class="back-link" href="./index.html">Công cụ › <span id="crumb">Đánh dấu nội dung</span></a><span class="muted-small">Local · PDF.js + pdf-lib</span></div>
<div class="tool-title"><div id="toolIcon" class="big-icon" aria-hidden="true"></div><div><h1 id="title">Đánh dấu nội dung</h1><p id="description">Chọn vùng trên trang để đánh dấu hoặc che.</p></div></div>
<div class="redaction-layout"><section class="surface visual-main"><label class="visual-file"><span>Chọn PDF</span><input id="fileInput" type="file" accept="application/pdf,.pdf"><small id="fileLabel">Chưa chọn tệp</small></label>
<div id="autoOptions" class="redaction-options" hidden><label class="option-group wide"><span>Từ hoặc cụm từ cần che · mỗi dòng một mục</span><textarea id="terms" rows="5" class="tool-input" placeholder="Số căn cước&#10;Tên riêng&#10;Mã khách hàng"></textarea></label><label class="checkbox-option"><input id="wholeWord" type="checkbox"><span>Chỉ khớp nguyên từ (Unicode)</span></label><label class="checkbox-option"><input id="caseSensitive" type="checkbox"><span>Phân biệt hoa/thường</span></label></div>
<div id="manualOptions" class="redaction-options" hidden><label class="option-group"><span>Trang</span><div class="redaction-actions"><button id="prevPage" class="secondary-button" type="button">‹</button><input id="pageNumber" class="tool-input" type="number" min="1" value="1"><span id="pageCount">/ 0</span><button id="nextPage" class="secondary-button" type="button">›</button></div></label><label id="colorOption" class="option-group"><span>Màu tô</span><input id="markColor" type="color" value="#ffe46b"></label></div>
<div id="warning" class="redaction-warning" hidden></div><div id="previewWrap" class="page-preview" hidden><canvas id="pageCanvas"></canvas><canvas id="selection"></canvas></div>
<div class="redaction-actions"><button id="runBtn" class="primary" type="button" disabled>Áp dụng</button><p id="status" class="status-text" role="status">Chọn PDF để bắt đầu.</p></div><progress id="progress" max="100" value="0" hidden></progress></section>
<aside class="surface redaction-aside"><h2 id="asideTitle">Cách dùng</h2><div id="help" class="local-note"></div><div id="stats" class="redaction-stats" hidden></div></aside></div></main></div>
<script src="./icons.js"></script><script src="./vendor/pdf-lib.min.js"></script><script src="./output-name.js"></script><script src="./output-save.js"></script><script type="module" src="./redaction-tools.js"></script></body></html>
