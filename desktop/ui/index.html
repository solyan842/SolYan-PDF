<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolYan PDF Desktop</title>
  <style>
    :root { font-family: "Segoe UI", system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111318; color: #f5f7fb; }
    main { width: min(720px, calc(100vw - 48px)); padding: 36px; border-radius: 22px; background: #191c23; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { margin: 8px 0; line-height: 1.55; color: #cbd2df; }
    .badge { display: inline-block; margin-bottom: 18px; padding: 7px 11px; border-radius: 999px; background: #25304a; color: #b9ceff; font-size: 13px; }
    code { color: #d7e3ff; }
  </style>
</head>
<body>
  <main>
    <div class="badge">Windows Desktop D1</div>
    <h1>SolYan PDF Desktop</h1>
    <p>The Windows shell is running locally.</p>
    <p>D1 validates Tauri/WebView2 packaging first. The production SolYan UI and local engine sidecars are connected in the following desktop milestones.</p>
    <p>No remote SolYan PDF host is used by this shell.</p>
  </main>
</body>
</html>
