[package]
name = "solyan-pdf-desktop"
version = "0.1.0"
description = "SolYan PDF Windows desktop shell"
authors = ["SolYan"]
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "=2.12.5" }
rand = "0.9"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-window-state = { path = "vendor/tauri-plugin-window-state-2.5.0", optional = true }
tauri-plugin-single-instance = { version = "=2.4.5", optional = true }
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_Storage_FileSystem", "Win32_Graphics_Printing"] }

[features]
default = []
reader-only = ["dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state"]
