[package]
name = "solyan-pdf-desktop"
version = "0.1.0"
description = "SolYan PDF Windows desktop shell"
authors = ["SolYan"]
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
rand = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_Controls_Dialogs"] }

[features]
default = []
